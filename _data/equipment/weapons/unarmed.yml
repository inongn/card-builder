id: unarmed
name: "Unarmed Strike"
type: Activity
duration: instantaneous
tags: [simple, melee, unarmed, weaponAttack, bludgeoningDamage]
time: action
range: 5 feet
description: |
  You strike with a punch, kick, head-butt or similar forceful blow. Make a $(formatBonus(attributes.melee.attack)) attack against the target. On a hit, the target takes $(Math.max(1, 1+attributes.melee.bonus)) Bludgeoning damage.
extra:
  name: Grapple or Shove
  description: You can replace one attack with a grapple or shove attempt. The target must succeed on a DC $(8+attributes.prof+Math.max(stats.str.mod, stats.dex.mod)) Dexterity saving throw or it has the Grappled or Prone condition.
