id: lifeDomainVestige
summary: "Gain divine healing spells and heavy armor proficiency from the Life Domain."
name: Life Domain
tags: [vestigeType]
type: Folder
children:
  - type: Reference
    target: [cureWounds, bless, lesserRestoration, spiritualWeapon]
  - type: Reference
    condition: $(meta.level >= 5)
    target: [beaconOfHope, revivify]
  - type: Reference
    condition: $(meta.level >= 7)
    target: [deathWard, guardianOfFaith]
  - type: Reference
    condition: $(meta.level >= 9)
    target: [massCureWounds, raiseDead]
