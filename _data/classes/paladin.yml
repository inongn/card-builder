id: paladin
name: Paladin
description: Holy warriors bound by sacred oaths, smiting evil with radiant power and protective auras.
tags:
  - class
type: Folder
children:
  - id: hitDie
    type: Attribute
    value: 10
  - id: weaponMastery
    type: Attribute
    value: true
  - type: Reference
    value:
      - wisSave
      - chaSave
  - type: Reference
    value:
      - simpleWeaponProficiency
      - martialWeaponProficiency
  - type: Reference
    value:
      - lightArmorTraining
      - mediumArmorTraining
      - heavyArmorTraining
      - shieldTraining
  - id: paladinSkillProficiencies
    type: Slot
    name: Paladin Skill Proficiencies
    quantity: 2
    target: athleticsProficiency OR insightProficiency OR intimidationProficiency OR medicineProficiency OR persuasionProficiency OR religionProficiency
  - type: Reference
    target:
      - layOnHands
  - id: layOnHands
    type: Resource
    name: Lay On Hands
    quantity: $(meta.level)
  - id: masteryProperties
    type: Reference
    target: masteryProperties
  - type: Reference
    target:
      - halfCaster
      - chaCaster
  - type: Slot
    name: Paladin Spells
    id: paladinSpells
    target: 'paladin NOT cantrip $(local.maxLevel < 5 ? ''NOT level5Spell'' : '''') $(local.maxLevel < 4 ? ''NOT level4Spell'' : '''') $(local.maxLevel < 3 ? ''NOT level3Spell'' : '''') $(local.maxLevel < 2 ? ''NOT level2Spell'' : '''')'
    variables:
      maxLevel: '$(meta.level >= 17 ? 5 : meta.level >= 13 ? 4 : meta.level >= 9 ? 3 : meta.level >= 5 ? 2 : 1)'
    quantity: $(progression(2,3,4,5,6,6,7,7,9,9,10,10,11,11,12,12,14,14,15,15))
  - id: fightingStyle
    type: Slot
    name: Fighting Style
    quantity: 1
    target: fightingStyle OR blessedWarrior
    condition: $(meta.level >= 2)
  - type: Reference
    target: divineSmite
    condition: $(meta.level >= 2)
  - id: paladinSubclass
    name: Paladin Subclass
    condition: $(meta.level >= 3)
    type: Slot
    target: paladinSubclass
  - id: channelDivinity
    type: Resource
    name: Channel Divinity
    quantity: '$(meta.level >= 11 ? 3 : 2)'
    sr: 1
    condition: $(meta.level >= 3)
  - type: Reference
    target:
      - divineSense
    condition: $(meta.level >= 3)
  - id: level4feat
    name: Level 4 Feat
    type: Slot
    quantity: 1
    target: feat
    condition: $(meta.level >= 4)
  - type: Reference
    target:
      - extraAttack
    condition: $(meta.level >= 5)
  - type: Reference
    target: findSteed
    condition: $(meta.level >= 5)
  - type: Reference
    target:
      - auraOfProtection
    condition: $(meta.level >= 6)
  - id: level8feat
    name: Level 8 Feat
    type: Slot
    quantity: 1
    target: feat
    condition: $(meta.level >= 8)
