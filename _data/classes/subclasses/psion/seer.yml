id: seer
name: Seer
description: Master the stream of time and foresight, slipping through attacks, guiding allies, and altering outcomes.
type: Folder
tags:
  - psionSubclass
children:
  - type: Reference
    target:
      - detectEvilAndGood
      - findTraps
      - guidingBolt
      - huntersMark
    condition: $(meta.level >= 3)
  - type: Reference
    target:
      - augury
      - seeInvisibility
    condition: $(meta.level >= 5)
  - type: Reference
    target:
      - arcaneEye
      - locateCreature
    condition: $(meta.level >= 7)
  - id: precognitiveDefense
    type: Effect
    target: attributes.ac
    operation: set
    value: $(10 + stats.dex.mod + stats.int.mod)
    condition: $(meta.level >= 3)
  - id: splitSecondWarning
    type: Reference
    target: dexAdvantage
    condition: $(meta.level >= 3)
  - type: Reference
    target:
      - instantSlip
    condition: $(meta.level >= 3)
  - type: Reference
    target:
      - foresightPropel
    condition: $(meta.level >= 6)
  - type: Reference
    target:
      - temporalGlitch
    condition: $(meta.level >= 6)
