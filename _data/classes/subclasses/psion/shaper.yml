id: shaper
name: Shaper
description: Manifest raw mental mass, ectoplasm, and psionic constructs from the Astral Plane to fight alongside you.
type: Folder
tags:
  - psionSubclass
children:
  - type: Reference
    target:
      - summonBeast
      - cureWounds
      - findFamiliar
      - unseenServant
    condition: $(meta.level >= 3)
  - type: Reference
    target:
      - summonFey
      - summonAstralEntity
    condition: $(meta.level >= 5)
  - type: Reference
    target:
      - summonAberration
      - summonElemental
    condition: $(meta.level >= 7)
  - id: astralShapingBeast
    type: Effect
    target: activities[id=summonBeast].resource
    operation: set
    value: psionicEnergyDice
    condition: $(meta.level >= 3)
  - id: astralShapingFey
    type: Effect
    target: activities[id=summonFey].resource
    operation: set
    value: psionicEnergyDice
    condition: $(meta.level >= 5)
  - id: astralShapingAstral
    type: Effect
    target: activities[id=summonAstralEntity].resource
    operation: set
    value: psionicEnergyDice
    condition: $(meta.level >= 5)
  - id: astralShapingAberration
    type: Effect
    target: activities[id=summonAberration].resource
    operation: set
    value: psionicEnergyDice
    condition: $(meta.level >= 7)
  - id: astralShapingElemental
    type: Effect
    target: activities[id=summonElemental].resource
    operation: set
    value: psionicEnergyDice
    condition: $(meta.level >= 7)
  - id: ectoplasmicShiftPropel
    type: Extra
    target: telekineticPropel
    name: Ectoplasmic Shift
    description: When targeting a creature summoned by your Psion spells, you do not need to expend a Psionic Energy Die, and you can move the target up to 15 feet or swap it for another summon.
    condition: $(meta.level >= 3)
  - id: empoweredServitorHp
    type: Effect
    target: statblocks[tags=summon].hp
    operation: add
    condition: $(meta.level >= 6)
    value: $(meta.level * 2)
  - id: empoweredServitorPsionicStrike
    type: Effect
    target: statblocks[tags=summon].traits
    operation: push
    condition: $(meta.level >= 6)
    value:
      name: Psionic Strike
      description: The summon's attacks deal an extra $(Math.max(1, stats.int.mod)) Psychic damage.
  - id: empoweredServitorPsionicStrike
    type: Effect
    target: statblocks[tags=summon].traits
    operation: push
    condition: $(meta.level >= 6)
    value:
      name: Harmonic Conduit
      description: You can cast spells through the summon.
