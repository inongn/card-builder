id: battleSmith
name: Battle Smith
description: Combine protection and healing, accompanied by a loyal Steel Defender of your own creation.
tags:
  - artificerSubclass
type: Folder
children:
  - type: Reference
    target:
      - smithsTools
      - martialWeaponProficiency
  - type: Reference
    target:
      - heroism
      - shield
    condition: $(meta.level >= 3)
  - type: Reference
    target:
      - shiningSmite
      - wardingBond
    condition: $(meta.level >= 5)
  - id: pactOfTheBlade
    type: Attribute
    value: true
  - type: Reference
    target: steelDefender
  - id: steelDefenderName
    type: Input
    name: Steel Defender Name
    inputType: text
    label: Steel Defender Name
  - type: Effect
    target: statblocks[steelDefender].name
    operation: set
    value: '$(meta.steeldefendername ? meta.steeldefendername : ''Steel Defender'')'
  - type: Reference
    target:
      - commandSteelDefender
  - type: Reference
    target:
      - extraAttack
    condition: $(meta.level >= 5)
  - id: battleSmithExtraAttack
    type: Effect
    target: activities[tags=weaponAttack].extra["instead of once, whenever you take the Attack action on your turn."]
    operation: replace
    condition: $(meta.level >= 5)
    value: "instead of once, whenever you take the Attack action on your turn. You can replace one of the attacks with a command to your Steel Defender to take an action in its stat block."
