id: reanimator
name: Reanimator
description: Stitch together servants from corpses, transforming the dark art of necromancy into a grim science.
type: Folder
tags:
  - artificerSubclass
children:
  - type: Reference
    target:
      - falseLife
      - spareTheDying
      - witchBolt
    condition: $(meta.level >= 3)
  - type: Reference
    target:
      - blindnessdeafness
      - enhanceAbility
    condition: $(meta.level >= 5)
  - type: Reference
    target:
      - animateDead
      - lightningBolt
    condition: $(meta.level >= 9)
  - type: Reference
    target:
      - blight
      - deathWard
    condition: $(meta.level >= 13)
  - type: Reference
    target:
      - antilifeShell
      - raiseDead
    condition: $(meta.level >= 17)
  - type: Reference
    target:
      - alchemistsTools
  - id: joltToLifeResource
    type: Resource
    name: Jolt to Life
    quantity: $(Math.max(1, stats.int.mod))
    condition: $(meta.level >= 3)
  - type: Reference
    target:
      - joltToLife
    condition: $(meta.level >= 3)
  - type: Reference
    target: reanimatedCompanion
  - id: strangeModifications
    name: Strange Modifications
    type: Slot
    target: strangeModifications or classoption
    condition: $(meta.level >= 5)
