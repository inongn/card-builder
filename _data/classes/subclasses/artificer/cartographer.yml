id: cartographer
name: Cartographer
description: Navigate and scout, using your creations to highlight threats, safeguard allies, and carve portals.
type: Folder
tags:
  - artificerSubclass
children:
  - type: Reference
    target:
      - calligraphersSupplies
      - cartographersTools
  - type: Reference
    target:
      - faerieFire
      - guidingBolt
      - healingWord
    condition: $(meta.level >= 3)
  - type: Reference
    target:
      - locateObject
      - mindSpike
    condition: $(meta.level >= 5)
  - type: Reference
    target:
      - callLightning
      - clairvoyance
    condition: $(meta.level >= 9)
  - type: Reference
    target:
      - banishment
      - locateCreature
    condition: $(meta.level >= 13)
  - type: Reference
    target:
      - scrying
      - teleportationCircle
    condition: $(meta.level >= 17)
  - type: Reference
    target:
      - adventurersAtlas
    condition: $(meta.level >= 3)
  - type: Reference
    target:
      - portalJump
    condition: $(meta.level >= 3)
  - id: illuminatedCartography
    type: Resource
    name: Illuminated Cartography
    quantity: $(Math.max(1, stats.int.mod))
    condition: $(meta.level >= 3)
  - type: Effect
    target: activities[id=faerieFire].resource
    operation: set
    value: illuminatedCartography
    condition: $(meta.level >= 3)
  - type: Reference
    target:
      - guidedPrecision
    condition: $(meta.level >= 5)
