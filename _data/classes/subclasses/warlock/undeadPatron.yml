id: undeadPatron
name: Undead Patron
description: Make a pact with a legendary undead entity, gaining dreadful powers to ward off death and terrify foes.
tags:
  - warlockSubclass
type: Folder
children:
  - type: Reference
    target:
      - bane
      - blindnessDeafness
      - phantasmalForce
      - rayOfSickness
  - type: Reference
    condition: $(meta.level >= 5)
    target:
      - speakWithDead
      - summonUndead
  - type: Reference
    condition: $(meta.level >= 7)
    target:
      - greaterInvisibility
      - phantasmalKiller
  - type: Reference
    condition: $(meta.level >= 9)
    target:
      - antilifeShell
      - cloudkill
  - type: Reference
    target:
      - formOfDread
  - id: formOfDread
    name: Form of Dread
    type: Resource
    quantity: $(Math.max(1, stats.cha.mod))
  - type: Reference
    target:
      - arcaneNecrosis
    condition: $(meta.level >= 6)
  - type: Reference
    target:
      - necroticSpellConversion
    condition: $(meta.level >= 6)
  - type: Reference
    target:
      - dreadedNecrosis
    condition: $(meta.level >= 6)
