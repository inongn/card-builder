id: celestialPatron
name: Celestial Patron
description: Draw power from the Upper Planes, forging a pact with heavenly entities to wield light and healing.
tags:
  - warlockSubclass
type: Folder
children:
  - type: Reference
    target:
      - aid
      - cureWounds
      - guidingBolt
      - lesserRestoration
      - light
      - sacredFlame
    condition: $(meta.level >= 3)
  - type: Reference
    target:
      - daylight
      - revivify
    condition: $(meta.level >= 5)
  - type: Reference
    target:
      - guardianOfFaith
      - wallOfFire
    condition: $(meta.level >= 7)
  - type: Reference
    target:
      - greaterRestoration
      - summonCelestial
    condition: $(meta.level >= 9)
  - type: Reference
    target:
      - healingLight
    condition: $(meta.level >= 3)
  - id: healingLight
    type: Resource
    name: Healing Light
    quantity: $(1 + meta.level)
    condition: $(meta.level >= 3)
    sr: 0
  - id: radiantSoulRes
    type: Reference
    target: radiantResistance
    condition: $(meta.level >= 6)
  - id: radiantSoulD12
    type: Effect
    target: activities[tags=damageSpell AND (tags=radiantDamage OR tags=fireDamage)].description["d12"]
    operation: replace
    value: d12$(formatBonus(stats.cha.mod))
    condition: $(meta.level >= 6)
  - id: radiantSoulD10
    type: Effect
    target: activities[tags=damageSpell AND (tags=radiantDamage OR tags=fireDamage)].description["d10"]
    operation: replace
    value: d10$(formatBonus(stats.cha.mod))
    condition: $(meta.level >= 6)
  - id: radiantSoulD8
    type: Effect
    target: activities[tags=damageSpell AND (tags=radiantDamage OR tags=fireDamage)].description["d8"]
    operation: replace
    value: d8$(formatBonus(stats.cha.mod))
    condition: $(meta.level >= 6)
  - id: radiantSoulD6
    type: Effect
    target: activities[tags=damageSpell AND (tags=radiantDamage OR tags=fireDamage)].description["d6"]
    operation: replace
    value: d6$(formatBonus(stats.cha.mod))
    condition: $(meta.level >= 6)
  - id: radiantSoulD4
    type: Effect
    target: activities[tags=damageSpell AND (tags=radiantDamage OR tags=fireDamage)].description["d4"]
    operation: replace
    value: d4$(formatBonus(stats.cha.mod))
    condition: $(meta.level >= 6)
