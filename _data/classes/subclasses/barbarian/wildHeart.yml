id: wildHeart
name: Path of the Wild Heart
description: Communicate with animals and channel supernatural might as your Rage deepens your primal connection.
tags:
  - barbarianSubclass
type: Folder
children:
  - type: Reference
    target:
      - beastSense
      - speakWithAnimals
      - wisCaster
  - type: Reference
    target:
      - rageOfTheWilds
  - type: Reference
    target:
      - rageOfTheWildsBear
  - type: Reference
    target:
      - rageOfTheWildsEagle
  - type: Reference
    target:
      - rageOfTheWildsWolf
  - id: aspectOfTheWilds
    type: Slot
    target: classOption OR aspectOfTheWilds
    name: Aspect of the Wilds
    condition: $(meta.level >= 6)
