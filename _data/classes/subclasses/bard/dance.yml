id: dance
name: College of Dance
description: Harmonize with the whirling cosmos through agile, speedy, and graceful dances that weave magic.
type: Folder
tags:
  - bardSubclass
children:
  - id: dazzlingFootworkDance
    type: Reference
    target: performanceAdvantage
  - type: Reference
    target:
      - dazzlingFootworkAgileStrike
  - id: martialArtsReplacementUnarmed
    type: Effect
    target: activities[tags=unarmed].description["$(Math.max(1, 1+attributes.melee.bonus))"]
    operation: replace
    value: 1d$(attributes.bardicDie)$(formatBonus(attributes.finesse.bonus))
    condition: $(meta.level >= 1)
  - id: unarmoredDefenseDance
    type: Effect
    target: attributes.ac
    operation: set
    value: $(10 + stats.dex.mod + stats.cha.mod)
  - id: martialArtsReplacementd4
    type: Effect
    target: activities[tags=unarmed and tags=weaponAttack].description["1d4"]
    operation: replace
    value: 1d$(attributes.bardicDie)
  - type: Reference
    target:
      - inspiringMovement
    condition: $(meta.level >= 6)
  - type: Reference
    target:
      - tandemFootwork
    condition: $(meta.level >= 6)
