id: lifeDomain
name: Life Domain
description: Tap into the positive energy of the multiverse as a master of healing, using life force to cure.
type: Folder
tags:
  - clericSubclass
children:
  - id: discipleOfLife
    type: Extra
    name: Disciple of Life
    target: healingSpell
    description: The creature regains an additional $(2+(stats.wis.mod)) Hit Points.
    condition: $(meta.level >= 3)
  - type: Reference
    target:
      - aid
      - bless
      - cureWounds
      - lesserRestoration
    condition: $(meta.level >= 3)
  - type: Reference
    target:
      - massHealingWord
      - revivify
    condition: $(meta.level >= 5)
  - type: Reference
    target:
      - auraOfLife
      - deathWard
    condition: $(meta.level >= 7)
  - type: Reference
    target:
      - greaterRestoration
      - massCureWounds
    condition: $(meta.level >= 9)
  - id: preserveLife
    type: Activity
    name: Preserve Life
    time: action
    range: 30 feet
    duration: Instantaneous
    resource: channelDivinity
    description: You evoke healing energy to restore up to $(5 * meta.level) Hit Points. Choose Bloodied creatures within range and divide the points among them. This can't restore a creature to more than half its Hit Point maximum.
    condition: $(meta.level >= 3)
  - id: blessedHealer
    type: Extra
    name: Blessed Healer
    target: healingSpell
    description: If you cast this on another creature, you regain $(2+(stats.wis.mod)) Hit Points.
    condition: $(meta.level >= 6)
