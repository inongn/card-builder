id: warDomain
name: War Domain
description: Excel in battle by tapping into the magic of war, inspiring others or offering violence as a prayer.
type: Folder
tags:
  - clericSubclass
children:
  - type: Reference
    target:
      - guidingBolt
      - magicWeapon
      - shieldOfFaith
      - spiritualWeapon
    condition: $(meta.level >= 3)
  - type: Reference
    target:
      - crusadersMantle
      - spiritGuardians
    condition: $(meta.level >= 5)
  - type: Reference
    target:
      - fireShield
      - freedomOfMovement
    condition: $(meta.level >= 7)
  - type: Reference
    target:
      - holdMonster
      - steelWindStrike
    condition: $(meta.level >= 9)
  - type: Reference
    target:
      - guidedStrike
    condition: $(meta.level >= 3)
  - type: Reference
    target:
      - warPriest
    condition: $(meta.level >= 3)
  - id: warPriest
    type: Resource
    name: War Priest
    quantity: $(Math.max(1, stats.wis.mod))
    condition: $(meta.level >= 3)
  - id: warGodsBlessingShield
    type: Effect
    target: activities[id=shieldOfFaith].resource
    operation: set
    value: channelDivinity
    condition: $(meta.level >= 6)
  - id: warGodsBlessingSpirit
    type: Effect
    target: activities[id=spiritualWeapon].resource
    operation: set
    value: channelDivinity
    condition: $(meta.level >= 6)
