id: lightDomain
name: Light Domain
description: Emphasize the divine power of blazing fire and revelation, burning away darkness and chasing away lies.
type: Folder
tags:
  - clericSubclass
children:
  - type: Reference
    target:
      - burningHands
      - faerieFire
      - scorchingRay
      - seeInvisibility
    condition: $(meta.level >= 3)
  - type: Reference
    target:
      - daylight
      - fireball
    condition: $(meta.level >= 5)
  - type: Reference
    target:
      - arcaneEye
      - wallOfFire
    condition: $(meta.level >= 7)
  - type: Reference
    target:
      - flameStrike
      - scrying
    condition: $(meta.level >= 9)
  - type: Reference
    target:
      - radianceOfTheDawn
    condition: $(meta.level >= 3)
  - type: Reference
    target:
      - wardingFlare
    condition: $(meta.level >= 3)
  - id: wardingFlare
    type: Resource
    name: Warding Flare
    quantity: $(Math.max(1, stats.wis.mod))
    sr: '$(meta.level >= 6 ? ''all'' : 0)'
    condition: $(meta.level >= 3)
