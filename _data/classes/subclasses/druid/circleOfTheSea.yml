id: circleOfTheSea
name: Circle of the Sea
description: Draw on the tempestuous forces of oceans and storms, embodying nature's wrath or mystical unity.
type: Folder
tags:
  - druidSubclass
children:
  - type: Reference
    target:
      - fogCloud
      - gustOfWind
      - rayOfFrost
      - thunderwave
    condition: $(meta.level >= 3)
  - type: Reference
    target:
      - lightningBolt
      - waterBreathing
    condition: $(meta.level >= 5)
  - type: Reference
    target:
      - controlWater
      - iceStorm
    condition: $(meta.level >= 7)
  - type: Reference
    target:
      - wrathOfTheSea
    condition: $(meta.level >= 3)
  - id: aquaticAffinity
    type: Effect
    target: attributes.movement.swim
    operation: set
    value: $(attributes.movement.walk)
    condition: $(meta.level >= 6)
