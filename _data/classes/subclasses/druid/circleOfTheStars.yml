id: circleOfTheStars
name: Circle of the Stars
description: Track heavenly patterns to discover cosmic secrets, harnessing the power of constellations.
type: Folder
tags:
  - druidSubclass
children:
  - type: Reference
    target:
      - guidance
    condition: $(meta.level >= 3)
  - id: starMap
    type: Reference
    target:
      - guidingBolt
    condition: $(meta.level >= 3)
    overwrite:
      resource: starMap
  - id: starMap
    type: Resource
    name: Star Map
    quantity: $(Math.max(1, stats.wis.mod))
    condition: $(meta.level >= 3)
  - type: Reference
    target:
      - starryForm
    condition: $(meta.level >= 3)
  - type: Reference
    target:
      - cosmicOmen
    condition: $(meta.level >= 6)
  - id: cosmicOmen
    type: Resource
    name: Cosmic Omen
    quantity: $(Math.max(1, stats.wis.mod))
    condition: $(meta.level >= 6)
