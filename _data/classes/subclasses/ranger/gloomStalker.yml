id: gloomStalker
name: Gloom Stalker
description: Feel at home in the darkest places, wielding Shadowfell magic to combat enemies lurking in darkness.
tags:
  - rangerSubclass
type: Folder
children:
  - type: Reference
    target:
      - dreadAmbusherLeap
  - type: Reference
    target:
      - dreadfulStrike
  - id: dreadfulStrike
    type: Resource
    name: Dreadful Strike
    quantity: $(Math.max(1, stats.wis.mod))
  - id: dreadAmbusherInitiative
    type: Effect
    target: attributes.initiative
    operation: add
    value: $(stats.wis.mod)
  - type: Reference
    target: disguiseSelf
  - type: Reference
    target: ropeTrick
    condition: $(meta.level >= 5)
  - type: Reference
    target: fear
    condition: $(meta.level >= 9)
  - type: Reference
    target: greaterInvisibility
    condition: $(meta.level >= 13)
  - type: Reference
    target: seeming
    condition: $(meta.level >= 17)
  - id: umbralSightDarkvision
    type: Effect
    target: attributes.senses.darkvision
    operation: add
    value: 60
  - type: Reference
    target:
      - umbralSightInvisibility
  - id: ironMind
    type: Slot
    name: Iron Mind
    quantity: 1
    target: wisSave OR intSave OR chaSave
    condition: $(meta.level >= 7)
