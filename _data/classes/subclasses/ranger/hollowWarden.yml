id: hollowWarden
name: Hollow Warden
description: Draw power from ancient horrors to grow bark armor and unleash nature's primal, terrifying vengeance.
tags:
  - rangerSubclass
type: Folder
children:
  - type: Reference
    target:
      - wrathfulSmite
  - type: Reference
    condition: $(meta.level >= 5)
    target:
      - alterSelf
  - type: Reference
    condition: $(meta.level >= 9)
    target:
      - phantomSteed
  - type: Reference
    condition: $(meta.level >= 13)
    target:
      - dominateBeast
  - type: Reference
    condition: $(meta.level >= 17)
    target:
      - steelWindStrike
  - type: Reference
    target:
      - wrathOfTheWild
  - id: hungeringMightConSaves
    type: Effect
    target: saves.constitution.bonus
    operation: add
    condition: $(meta.level >= 7)
    value: $(Math.max(1, stats.wis.mod))
  - type: Reference
    target:
      - hungeringMightHeal
    condition: $(meta.level >= 7)
