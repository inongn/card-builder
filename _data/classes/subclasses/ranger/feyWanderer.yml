id: feyWanderer
name: Fey Wanderer
description: Embody a fey mystique to brighten hearts with joyful laughter and strike terror with martial prowess.
tags:
  - rangerSubclass
type: Folder
children:
  - type: Reference
    target:
      - dreadfulStrikes
  - type: Reference
    target: charmPerson
  - type: Reference
    target: mistyStep
    condition: $(meta.level >= 5 && meta.level < 15)
  - type: Reference
    target: summonFey
    condition: $(meta.level >= 9)
  - type: Reference
    target: dimensionDoor
    condition: $(meta.level >= 13)
  - type: Reference
    target: mislead
    condition: $(meta.level >= 17)
  - id: otherworldlyGlamourPRF
    type: Effect
    target: skills.performance.bonus
    operation: add
    value: $(stats.wis.mod)
    condition: $(meta.level >= 3)
  - id: otherworldlyGlamourDEC
    type: Effect
    target: skills.deception.bonus
    operation: add
    value: $(stats.wis.mod)
    condition: $(meta.level >= 3)
  - id: otherworldlyGlamourPER
    type: Effect
    target: skills.persuasion.bonus
    operation: add
    value: $(stats.wis.mod)
    condition: $(meta.level >= 3)
  - id: otherworldlyGlamourITM
    type: Effect
    target: skills.intimidation.bonus
    operation: add
    value: $(stats.wis.mod)
    condition: $(meta.level >= 3)
  - id: otherworldlyGlamourSkill
    type: Slot
    name: Otherworldly Glamour Skill
    quantity: 1
    target: deceptionProficiency OR performanceProficiency OR persuasionProficiency
  - type: Reference
    target:
      - charmedAdvantage
      - frightenedAdvantage
    condition: $(meta.level >= 7)
  - type: Reference
    target:
      - beguilingTwist
    condition: $(meta.level >= 7)
