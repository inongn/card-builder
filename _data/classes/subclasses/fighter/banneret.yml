id: banneret
name: Banneret
description: Rally allies to fight against evil as a paragon of valor, utilizing inspiring presence and diplomacy.
type: Folder
tags:
  - fighterSubclass
children:
  - type: Reference
    target:
      - comprehendLanguages
      - chaCaster
    condition: $(meta.level >= 3)
    overwrite:
      time: 10 minutes
  - id: wellSpokenSkill
    name: Well Spoken Skill Proficiency
    type: Slot
    target: insightProficiency OR intimidationProficiency OR persuasionProficiency OR performanceProficiency
    quantity: 1
    condition: $(meta.level >= 3)
  - type: Reference
    target:
      - groupRecovery
    condition: $(meta.level >= 3)
