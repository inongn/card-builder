id: arcaneArcher
name: Arcane Archer
description: Study a unique method of elven archery that weaves magic into shots to create supernatural effects.
type: Folder
tags:
  - fighterSubclass
children:
  - type: Slot
    id: arcaneArcherLoreCantrip
    name: Arcane Archer Lore Cantrip
    target: druidcraft OR prestidigitation
    quantity: 1
    condition: $(meta.level >= 3)
    overwrite:
      variables.classification: spellcasting
      tags:
        - fighterSpell
  - type: Reference
    target: intCaster
    condition: $(meta.level >= 3)
  - type: Reference
    target:
      - arcanaProficiency
      - natureProficiency
    condition: $(meta.level >= 3 && !skills.arcana.proficiency && !skills.nature.proficiency)
  - id: arcaneShot
    type: Resource
    name: Arcane Shot
    quantity: $(Math.max(1, stats.int.mod))
    sr: 1
    condition: $(meta.level >= 3)
  - id: arcaneShotOptions
    name: Arcane Shot Options
    type: Slot
    target: arcaneShotOption OR classOption
    quantity: '$(meta.level >= 7 ? 3 : 2)'
    condition: $(meta.level >= 3)
  - type: Reference
    target:
      - curvingShot
    condition: $(meta.level >= 7)
  - type: Reference
    target:
      - magicalAmmunition
    condition: $(meta.level >= 7)
