id: draconic
name: Draconic Sorcery
description: Wield innate magic granted by dragons, channeling their ancient power into devastating spells.
type: Folder
tags:
  - sorcererSubclass
children:
  - id: draconicResilienceHP
    type: Effect
    target: attributes.hp
    operation: add
    value: $(meta.level)
    condition: $(meta.level >= 3)
  - id: draconicResilienceAC
    type: Effect
    target: attributes.ac
    operation: set
    value: $(10 + stats.dex.mod + stats.cha.mod)
    condition: $(meta.level >= 3)
  - type: Reference
    target:
      - alterSelf
      - chromaticOrb
      - command
      - dragonsBreath
    condition: $(meta.level >= 3)
  - type: Reference
    target:
      - fear
      - fly
    condition: $(meta.level >= 5)
  - type: Reference
    target:
      - arcaneEye
      - charmMonster
    condition: $(meta.level >= 7)
  - type: Reference
    target:
      - legendLore
      - summonDragon
    condition: $(meta.level >= 9)
  - id: elementalAffinity
    type: Slot
    name: Elemental Affinity
    condition: $(meta.level >= 6)
    target: classOptions OR elementalAffinity
