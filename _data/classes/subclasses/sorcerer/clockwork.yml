id: clockwork
name: Clockwork Sorcery
description: Channel the cosmic force of order, utilizing clockwork magic from Mechanus to manipulate reality.
type: Folder
tags:
  - sorcererSubclass
children:
  - type: Reference
    target:
      - aid
      - alarm
      - lesserRestoration
      - protectionFromEvilAndGood
    condition: $(meta.level >= 3)
  - type: Reference
    target:
      - dispelMagic
      - protectionFromEnergy
    condition: $(meta.level >= 5)
  - type: Reference
    target:
      - freedomOfMovement
      - summonConstruct
    condition: $(meta.level >= 7)
  - type: Reference
    target:
      - greaterRestoration
      - wallOfForce
    condition: $(meta.level >= 9)
  - type: Reference
    target:
      - restoreBalance
    condition: $(meta.level >= 3)
  - id: restoreBalance
    type: Resource
    name: Restore Balance
    quantity: $(Math.max(1, stats.cha.mod))
    condition: $(meta.level >= 3)
    sr: 0
  - type: Reference
    target:
      - bastionOfLaw
    condition: $(meta.level >= 6)
