id: shadow
name: Shadow Sorcery
description: Draw magic from the Shadowfell to command darkness, wrap yourself in gloom, and summon foul beasts.
tags:
  - sorcererSubclass
type: Folder
children:
  - type: Reference
    target:
      - bane
      - darkness
      - inflictWounds
      - passWithoutTrace
  - type: Reference
    condition: $(meta.level >= 5)
    target:
      - hungerOfHadar
      - nondetection
  - type: Reference
    condition: $(meta.level >= 7)
    target:
      - greaterInvisibility
      - phantasmalKiller
  - type: Reference
    condition: $(meta.level >= 9)
    target:
      - contagion
      - creation
  - id: eyesOfTheDark
    type: Effect
    target: attributes.senses.darkvision
    operation: set
    value: 120
  - type: Reference
    target:
      - strengthOfTheGrave
  - id: beastsOfIllOmen
    type: Reference
    target: summonBeast
    condition: $(meta.level >= 6)
  - id: beastsOfIllOmenEffect
    type: Effect
    target: activities[summonBeastActivity].time
    operation: set
    value: bonus action
