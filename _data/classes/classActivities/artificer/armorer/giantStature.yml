id: giantStature
type: Activity
duration: instantaneous
range: self
name: Giant Stature
time: bonus action
resource: giantStatureResource
description: |
  As a Bonus Action, you transform and enlarge your armor for 1 minute. For the duration:
  - Your reach increases by $(meta.level >= 15 ? '10' : '5') feet.
  - If you are smaller than Large, you become Large.
