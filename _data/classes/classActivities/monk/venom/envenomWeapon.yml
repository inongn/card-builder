id: envenomWeapon
type: Activity
duration: instantaneous
range: self
name: Envenom Weapon
time: free action
resource: 1 focusPoints
description: |
  You coat your Monk weapon in toxin. For 1 minute or until you hit a creature with it, the next creature taking damage from the weapon is subjected to one of the following:

  **Slowing Toxin.** The target's Speed is halved, it can't take Reactions, and it can take either an action or a Bonus Action on its turn, not both. These effects last until the start of your next turn.

  **Venom.** The target takes Poison damage equal to two rolls of your Martial Arts die (2d$(attributes.martialArtsDie)).
