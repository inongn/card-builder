id: sharpenedMind
name: Sharpened Mind
summary: "Ignore Psychic resistance and substitute a recorded Psionic die roll on damage once per turn."
tags: [psionicDiscipline]
type: Activity
time: free action
range: self
duration: 1 minute
resource: psionicEnergyDice
description: |
  At the start of your turn, roll 1d$(attributes.psiDice) and record the number rolled. You gain the following benefits for 1 minute or until you have the Incapacitated condition:
  * **Bypassing Psionics.** Damage from your weapon attacks, Psion spells, and Psion features ignores Resistance to Psychic damage.
  * **Attack Mode.** Once per turn, when you deal Psychic damage to one or more creatures, you can replace the number rolled on one of the damage dice with the number recorded when you activated this Psionic Discipline.

  When you use Sharpened Mind, you can also use a different Psionic Discipline this turn.
