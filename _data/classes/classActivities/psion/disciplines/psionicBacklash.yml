id: psionicBacklash
name: Psionic Backlash
summary: "Reduce incoming attack damage and deal Psychic damage back to the attacker."
tags: [psionicDiscipline]
type: Activity
time: reaction
range: Varies
duration: Instantaneous
resource: psionicEnergyDice
description: |
  Immediately after a creature you can see hits you with an attack roll, you reduce the damage you take from the attack by an amount equal to two times the number rolled on 1d$(attributes.psiDice) + $(stats.int.mod) (minimum 2). In addition, you force the attacker to make a DC $(attributes.spellcasting.save) Wisdom saving throw. On a failed save, the target takes Psychic damage equal to the amount of damage reduced.
