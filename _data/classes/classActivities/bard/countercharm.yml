id: countercharm
type: Activity
duration: instantaneous
name: Countercharm
time: reaction
range: 30 feet
description: |
  When you or an ally within range fails a saving throw, against an effect that applies the Charmed or Frightened condition, you use musical notes or words of power to disrupt its mind-influencing effect. Cause the save to be rerolled, and the new roll has Advantage.
