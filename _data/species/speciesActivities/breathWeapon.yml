id: breathWeapon
type: Activity
name: Breath Weapon
time: action
range: self
duration: Instantaneous
resource: breathWeapon
description: |
  You exhale magical energy in a 15-foot Cone or a 30-foot Line (5 feet wide). Each creature in that area must make a DC $(8 + stats.con.mod + attributes.prof) Dexterity saving throw. On a failed save, a creature takes $(meta.level >= 17 ? '4' : meta.level >= 11 ? '3' : meta.level >= 5 ? '2' : '1')d10 $(attributes.dragonicAncestryDamage) damage. On a successful save, a creature takes half as much damage.
