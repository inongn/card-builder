id: triton
name: Triton
tags:
  - species
description: Aquatic guardians from the Plane of Water who defend both ocean depths and surface shores.
type: Folder
children:
  - type: Effect
    target: attributes.senses.darkvision
    operation: set
    value: 60
  - type: Effect
    target: attributes.movement.swim
    operation: set
    value: 30
  - type: Reference
    target:
      - primordialLanguage
      - guidance
      - chooseCaster
  - type: Reference
    condition: $(meta.level >= 3)
    target: fogCloud
    overwrite:
      resource: limited
  - type: Reference
    condition: $(meta.level >= 5)
    target: gustOfWind
    overwrite:
      resource: limited
