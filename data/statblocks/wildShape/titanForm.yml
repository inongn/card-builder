name: Titan Form Templates
id: titanForm
children:
  - type: Statblock
    name: Behemoth
    tags: [titanFormTemplate]
    id: behemothTitanForm
    size: Large
    category: wildShape
    classification: Monstrosity
    ac: $(13 + stats.wis.mod)
    movement:
      walk: 40
      climb: 40
    stats:
      str: $(stats.wis.score)
      dex: $(stats.wis.score)
      con: $(stats.con.score)
      int: $(stats.int.score)
      wis: $(stats.wis.score)
      cha: $(stats.cha.score)
    senses:
      darkvision: 60
    traits:
      - name: Siege Monster
        description: "You deal double damage to objects and structures."
    actions:
      - id: rend
        name: Rend
        mechanic:
          pattern: attack
          attack:
            classification: melee
            type: weapon
            bonus: "$(attributes.spellcasting.attack)"
          target:
            type: single
            range: reach 10 feet
          hit:
            - type: damage
              dice:
                count: "$(meta.level >= 12 ? 3 : meta.level >= 6 ? 2 : 1)"
                sides: 8
                bonus: "$(stats.wis.mod)"
              damageType: slashing
      - id: incandescentBreath
        name: Incandescent Breath
        mechanic:
          pattern: save
          save:
            ability: dex
            dc: "$(attributes.spellcasting.save)"
          target:
            type: area
            range: self
            aoe:
              shape: line
              size: 60
          failure:
            type: damage
            dice:
              count: "$(2 * (local.slotLevel || 1))"
              sides: 10
            damageType: radiant
            text: "2d10 Radiant damage per level of the spell slot expended"
          success:
            halfDamage: true
          text: "You expend a level 1+ spell slot."

  - type: Statblock
    name: Leviathan
    tags: [titanFormTemplate]
    id: leviathanTitanForm
    size: Large
    category: wildShape
    classification: Monstrosity
    ac: $(13 + stats.wis.mod)
    movement:
      walk: 40
      swim: 40
    stats:
      str: $(stats.wis.score)
      dex: $(stats.wis.score)
      con: $(stats.con.score)
      int: $(stats.int.score)
      wis: $(stats.wis.score)
      cha: $(stats.cha.score)
    senses:
      darkvision: 60
    traits:
      - name: Amphibious
        description: "You can breathe air and water."
      - name: Siege Monster
        description: "You deal double damage to objects and structures."
    actions:
      - id: rend
        name: Rend
        mechanic:
          pattern: attack
          attack:
            classification: melee
            type: weapon
            bonus: "$(attributes.spellcasting.attack)"
          target:
            type: single
            range: reach 10 feet
          hit:
            - type: damage
              dice:
                count: "$(meta.level >= 12 ? 3 : meta.level >= 6 ? 2 : 1)"
                sides: 8
                bonus: "$(stats.wis.mod)"
              damageType: bludgeoning

  - type: Statblock
    name: Insectoid
    tags: [titanFormTemplate]
    id: insectoidTitanForm
    size: Large
    category: wildShape
    classification: Monstrosity
    ac: $(13 + stats.wis.mod)
    movement:
      walk: 40
      fly: "$(meta.level >= 10 ? 40 : 0)"
    stats:
      str: $(stats.wis.score)
      dex: $(stats.wis.score)
      con: $(stats.con.score)
      int: $(stats.int.score)
      wis: $(stats.wis.score)
      cha: $(stats.cha.score)
    senses:
      darkvision: 60
    traits:
      - name: Siege Monster
        description: "You deal double damage to objects and structures."
      - name: Flyby (Requires Druid Level 10+)
        description: "You don't provoke Opportunity Attacks when you fly out of an enemy's reach."
    actions:
      - id: rend
        name: Rend
        mechanic:
          pattern: attack
          attack:
            classification: melee
            type: weapon
            bonus: "$(attributes.spellcasting.attack)"
          target:
            type: single
            range: reach 10 feet
          hit:
            - type: damage
              dice:
                count: "$(meta.level >= 12 ? 3 : meta.level >= 6 ? 2 : 1)"
                sides: 8
                bonus: "$(stats.wis.mod)"
              damageType: piercing
      - id: energizingPollen
        name: Energizing Pollen
        mechanic:
          pattern: healing
          target:
            type: single
            range: 5 feet
          healing:
            dice:
              count: "$(2 * (local.slotLevel || 1))"
              sides: 6
            type: hitPoints
          text: "You expend a level 1+ spell slot and can move up to $(Math.floor(attributes.movement.walk / 2 / 5) * 5) feet without provoking Opportunity Attacks while emitting a cloud of healing pollen. When you move within 5 feet of another creature during this movement, you can restore a number of Hit Points equal to 2d6 per level of the spell slot expended (once per turn per creature)."
