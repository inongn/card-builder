type: Statblock
name: Trampling Charger Beast
id: wildShapeTramplingCharger
summary: Boars, rhinos, and elk that gore with a running charge, knock foes down, and trample them.
tags: [lunarWildShape, classOption]
repeatable: true
size: "$(meta.level >= 6 ? 'Large' : 'Medium')"
category: wildShape
classification: Beast
ac: "$(12 + Math.floor((stats.wis.score - 10) / 2))"
movement:
  walk: 50
stats:
  str: "$(17 + Math.floor(meta.level / 3))"
  dex: "$(12 + Math.floor(meta.level / 3))"
  con: "$(16 + Math.floor(meta.level / 3))"
  int: "$(stats.int.score)"
  wis: "$(stats.wis.score)"
  cha: "$(stats.cha.score)"
actions:
  - name: Bestial Strike
    description: "_Melee Attack Roll:_ $(formatBonus((meta.level >= 5 ? 3 : 2) + Math.floor((stats.wis.score - 10) / 2))), reach 5 ft. _Hit:_ $(meta.level >= 6 ? 2 : 1)d10$(formatBonus(Math.floor((stats.wis.score - 10) / 2))) Piercing damage, and if you moved at least 20 feet straight toward the target immediately before the hit, it takes an extra $(meta.level >= 6 ? 2 : 1)d10 damage and, if it is a creature of your size or smaller, it has the Prone condition."
bonusActions:
  - name: Trample
    description: "_Dexterity Saving Throw:_ DC $(attributes.spellcasting.save), one prone creature within 5 feet. _Failure:_ 2d10$(formatBonus(Math.floor((stats.wis.score - 10) / 2))) Bludgeoning damage. _Success:_ Half damage."