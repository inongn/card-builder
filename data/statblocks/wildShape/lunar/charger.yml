type: Statblock
name: Trampling Charger
id: wildShapeTramplingCharger
summary: Boars and rhinos that impale and trample foes.
tags: [lunarWildShape, classOption]
repeatable: true
size: "$(meta.level >= 6 ? 'Large' : 'Medium')"
category: wildShape
classification: Beast
ac: "$(12 + Math.floor((stats.wis.score - 10) / 2))"
movement:
  walk: 50
stats:
  str: "$(17 + Math.floor(meta.level / 3))"
  dex: "$(12 + Math.floor(meta.level / 3))"
  con: "$(16 + Math.floor(meta.level / 3))"
  int: "$(stats.int.score)"
  wis: "$(stats.wis.score)"
  cha: "$(stats.cha.score)"
actions:
  - name: Bestial Strike
    description: "_Melee Attack Roll:_ $(formatBonus((meta.level >= 5 ? 3 : 2) + Math.floor((stats.wis.score - 10) / 2))) to hit, reach 5 ft., one target. _Hit:_ $(meta.level >= 6 ? 2 : 1)d10$(formatBonus(Math.floor((stats.wis.score - 10) / 2))) Piercing damage. If you moved at least 20 feet straight toward the target immediately before the hit, it takes an extra $(meta.level >= 6 ? 2 : 1)d10 damage and must succeed on a DC $(attributes.spellcasting.save) Strength saving throw or be knocked prone."
bonusActions:
  - name: Trample
    description: "Force one Prone creature within 5 feet to make a DC $(attributes.spellcasting.save) Dexterity saving throw. _Failure:_ 2d10$(formatBonus(Math.floor((stats.wis.score - 10) / 2))) Bludgeoning damage. _Success:_ Half damage."