type: Statblock
name: Charger Beast
id: lunarBeastCharger
summary: Elks, boars, and rhinos with charging strikes that knock targets prone.
tags: [lunarWildShape, classOption]
repeatable: true
size: "$(meta.level >= 12 ? 'Huge' : meta.level >= 6 ? 'Large' : 'Medium')"
category: wildShape
classification: Beast
ac: "$(12 + Math.floor((15 + Math.floor(meta.level / 6) - 10) / 2))"
movement:
  walk: 50
stats:
  str: "$(14 + Math.floor(meta.level / 3))"
  dex: "$(15 + Math.floor(meta.level / 6))"
  con: "$(14 + Math.floor(meta.level / 3))"
  int: "$(stats.int.score)"
  wis: "$(stats.wis.score)"
  cha: "$(stats.cha.score)"
traits:
  - name: Keen Sense
    description: "You have advantage on Wisdom (Perception) checks that rely on hearing, sight, or smell (your choice)."
  - name: Charge
    description: "If you move at least 20 feet straight toward a target and then hit it with a Gore attack on the same turn, the target takes an extra $(meta.level >= 6 ? 2 : 1)d10 damage of the same type as your Gore attack. If the target is a creature, it must succeed on a DC $(attributes.spellcasting.save) Strength saving throw or be knocked prone."
actions:
  - name: Gore
    description: "_Melee Attack Roll:_ $(formatBonus((meta.level >= 15 ? 3 : 2) + Math.floor((14 + Math.floor(meta.level / 3) - 10) / 2))) to hit, reach 5 ft., one target. _Hit:_ $(meta.level >= 6 ? 2 : 1)d10$(formatBonus(Math.floor((14 + Math.floor(meta.level / 3) - 10) / 2) + Math.floor(meta.level / 3) + (meta.level >= 12 ? 2 : 0))) Bludgeoning, Piercing, or Slashing damage."
