type: Statblock
name: Trampling Charger Beast
id: wildShapeTramplingCharger
summary: Boars, rhinos, and elk that gore with a running charge, knock foes down, and trample them.
tags: [lunarWildShape, classOption]
repeatable: true
size: "$(meta.level >= 6 ? 'Large' : 'Medium')"
category: wildShape
classification: Beast
ac: "$(12 + Math.floor((stats.wis.score - 10) / 2))"
movement:
  walk: 50
stats:
  str: "$(17 + Math.floor(meta.level / 3))"
  dex: "$(12 + Math.floor(meta.level / 3))"
  con: "$(16 + Math.floor(meta.level / 3))"
  int: "$(stats.int.score)"
  wis: "$(stats.wis.score)"
  cha: "$(stats.cha.score)"
actions:
  - id: bestialStrike
    name: Bestial Strike
    mechanic:
      pattern: attack
      attack:
        classification: melee
        type: weapon
        bonus: "$((meta.level >= 5 ? 3 : 2) + Math.floor((stats.wis.score - 10) / 2))"
      target:
        type: single
        range: reach 5 feet
      hit:
        - type: damage
          dice:
            count: "$(meta.level >= 6 ? 2 : 1)"
            sides: 10
            bonus: "$(Math.floor((stats.wis.score - 10) / 2))"
          damageType: piercing
        - type: condition
          condition: prone
      text: "If you moved at least 20 feet straight toward the target immediately before the hit, it takes an extra $(meta.level >= 6 ? 2 : 1)d10 damage."
bonusActions:
  - id: trample
    name: Trample
    mechanic:
      pattern: save
      save:
        ability: dex
        dc: "$(attributes.spellcasting.save)"
      target:
        type: single
        range: 5 feet
        filter: prone creature
      failure:
        type: damage
        dice:
          count: 2
          sides: 10
          bonus: "$(Math.floor((stats.wis.score - 10) / 2))"
        damageType: bludgeoning
      success:
        halfDamage: true
