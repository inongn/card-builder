type: Statblock
name: Amphibious Constrictor Beast
id: wildShapeAmphibiousConstrictor
summary: Crocodiles, constrictor snakes, and giant toads that grapple, restrain, and crush their prey.
tags: [lunarWildShape, classOption]
repeatable: true
size: "$(meta.level >= 6 ? 'Large' : 'Medium')"
category: wildShape
classification: Beast
ac: "$(13 + Math.floor((stats.wis.score - 10) / 2))"
movement:
  walk: 30
  swim: 30
stats:
  str: "$(16 + Math.floor(meta.level / 3))"
  dex: "$(12 + Math.floor(meta.level / 3))"
  con: "$(14 + Math.floor(meta.level / 3))"
  int: "$(stats.int.score)"
  wis: "$(stats.wis.score)"
  cha: "$(stats.cha.score)"
senses:
  blindsight: 10
traits:
  - name: Amphibious
    description: "You can breathe air and water."
actions:
  - name: Bestial Strike
    description: "_Melee Attack Roll:_ $(formatBonus((meta.level >= 5 ? 3 : 2) + Math.floor((stats.wis.score - 10) / 2))), reach 5 ft. _Hit:_ $(meta.level >= 6 ? 2 : 1)d10$(formatBonus(Math.floor((stats.wis.score - 10) / 2))) Piercing damage, and the target has the Grappled condition (escape DC $(attributes.spellcasting.save)). Until the grapple ends, the target has the Restrained condition."
bonusActions:
  - name: Engulf
    description: "One creature you have grappled takes $(meta.level >= 6 ? 2 : 1)d8$(formatBonus(Math.floor((stats.wis.score - 10) / 2))) Bludgeoning damage."