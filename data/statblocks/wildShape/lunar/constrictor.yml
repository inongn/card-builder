type: Statblock
name: Amphibious Constrictor Beast
id: wildShapeAmphibiousConstrictor
summary: Crocodiles, constrictor snakes, and giant toads that grapple, restrain, and crush their prey.
tags: [lunarWildShape, classOption]
repeatable: true
size: "$(meta.level >= 6 ? 'Large' : 'Medium')"
category: wildShape
classification: Beast
ac: "$(13 + Math.floor((stats.wis.score - 10) / 2))"
movement:
  walk: 30
  swim: 30
stats:
  str: "$(16 + Math.floor(meta.level / 3))"
  dex: "$(12 + Math.floor(meta.level / 3))"
  con: "$(14 + Math.floor(meta.level / 3))"
  int: "$(stats.int.score)"
  wis: "$(stats.wis.score)"
  cha: "$(stats.cha.score)"
senses:
  blindsight: 10
traits:
  - name: Amphibious
    description: "You can breathe air and water."
actions:
  - id: bestialStrike
    name: Bestial Strike
    mechanic:
      pattern: attack
      attack:
        classification: melee
        type: weapon
        bonus: "$((meta.level >= 5 ? 3 : 2) + Math.floor((stats.wis.score - 10) / 2))"
      target:
        type: single
        range: reach 5 feet
      hit:
        - type: damage
          dice:
            count: "$(meta.level >= 6 ? 2 : 1)"
            sides: 10
            bonus: "$(Math.floor((stats.wis.score - 10) / 2))"
          damageType: piercing
        - type: condition
          condition:
            - grappled
            - restrained
          end: action_check
bonusActions:
  - id: engulf
    name: Engulf
    mechanic:
      pattern: automatic
      target:
        type: single
        filter: creature you have grappled
      payloads:
        - type: damage
          dice:
            count: "$(meta.level >= 6 ? 2 : 1)"
            sides: 8
            bonus: "$(Math.floor((stats.wis.score - 10) / 2))"
          damageType: bludgeoning
