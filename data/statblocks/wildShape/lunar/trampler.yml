type: Statblock
name: Trampler Beast
id: lunarBeastTrampler
summary: Horses and elephants that trample prone enemies underfoot.
tags: [lunarWildShape, classOption]
repeatable: true
size: "$(meta.level >= 12 ? 'Huge' : meta.level >= 6 ? 'Large' : 'Medium')"
category: wildShape
classification: Beast
ac: "$(12 + Math.floor((10 + Math.floor(meta.level / 6) - 10) / 2))"
movement:
  walk: 50
stats:
  str: "$(15 + Math.floor(meta.level / 3))"
  dex: "$(10 + Math.floor(meta.level / 6))"
  con: "$(17 + Math.floor(meta.level / 3))"
  int: "$(stats.int.score)"
  wis: "$(stats.wis.score)"
  cha: "$(stats.cha.score)"
traits:
  - name: Keen Sense
    description: "You have advantage on Wisdom (Perception) checks that rely on hearing, sight, or smell (your choice)."
  - name: Trample
    description: "If you move at least 20 feet straight toward a creature and then hit it with a Hooves attack on the same turn, that target must succeed on a DC $(attributes.spellcasting.save) Strength saving throw or be knocked prone. If the target is prone, you can make another Hooves attack against it as a bonus action."
actions:
  - name: Hooves
    description: "_Melee Attack Roll:_ $(formatBonus((meta.level >= 15 ? 3 : 2) + Math.floor((15 + Math.floor(meta.level / 3) - 10) / 2))) to hit, reach 5 ft., one target. _Hit:_ $(meta.level >= 6 ? 2 : 1)d6$(formatBonus(Math.floor((15 + Math.floor(meta.level / 3) - 10) / 2) + Math.floor(meta.level / 3) + (meta.level >= 12 ? 2 : 0))) Bludgeoning damage."
