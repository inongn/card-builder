type: Statblock
name: Aerial Ravager Beast
id: aerialLunarBeastRavager
summary: Giant bats and pterosaurs with blindsight and frenzied bites.
tags: [lunarWildShape, classOption]
repeatable: true
size: "$(meta.level >= 12 ? 'Large' : 'Medium')"
category: wildShape
classification: Beast
ac: "$(11 + Math.floor((16 + Math.floor(meta.level / 3) - 10) / 2))"
hp: "$(((meta.level >= 18 ? 13 : meta.level >= 15 ? 11 : meta.level >= 12 ? 9 : meta.level >= 9 ? 7 : meta.level >= 6 ? 5 : 3)) * (4 + Math.floor((15 + Math.floor(meta.level / 3) - 10) / 2)))"
movement:
  walk: 10
  fly: 60
stats:
  str: "$(12 + Math.floor(meta.level / 3))"
  dex: "$(16 + Math.floor(meta.level / 3))"
  con: "$(15 + Math.floor(meta.level / 3))"
  int: "$(stats.int.score)"
  wis: "$(stats.wis.score)"
  cha: "$(stats.cha.score)"
senses:
  blindsight: 120
traits:
  - name: Blood Frenzy
    description: "You have advantage on melee attack rolls against any creature that doesn't have all its hit points."
  - name: Echolocation
    description: "You gain blindsight to a distance of 120 ft. You can't use this blindsight while deafened."
actions:
  - name: Bite
    description: "_Melee Attack Roll:_ $(formatBonus((meta.level >= 15 ? 3 : 2) + Math.floor((16 + Math.floor(meta.level / 3) - 10) / 2))) to hit, reach 5 ft., one target. _Hit:_ $(meta.level >= 12 ? 2 : 1)d6$(formatBonus(Math.floor((16 + Math.floor(meta.level / 3) - 10) / 2) + Math.floor(meta.level / 3))) Piercing damage."
