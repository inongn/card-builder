type: Statblock
name: Subterranean Excavator Beast
id: wildShapeExcavator
summary: Giant badgers and moles that tunnel underground and burst out to ambush and topple foes.
tags: [lunarWildShape, classOption]
repeatable: true
size: "$(meta.level >= 6 ? 'Large' : 'Medium')"
category: wildShape
classification: Beast
ac: "$(13 + Math.floor((stats.wis.score - 10) / 2))"
movement:
  walk: 30
  burrow: 20
stats:
  str: "$(15 + Math.floor(meta.level / 3))"
  dex: "$(14 + Math.floor(meta.level / 3))"
  con: "$(16 + Math.floor(meta.level / 3))"
  int: "$(stats.int.score)"
  wis: "$(stats.wis.score)"
  cha: "$(stats.cha.score)"
senses:
  tremorsense: 60
traits:
  - name: Tunneler
    description: "You can burrow through solid earth and nonmagical, unworked stone. While doing so, you can choose to leave a 5-foot-diameter tunnel in your wake."
actions:
  - id: bestialStrike
    name: Bestial Strike
    mechanic:
      pattern: attack
      attack:
        classification: melee
        type: weapon
        bonus: "$((meta.level >= 5 ? 3 : 2) + Math.floor((stats.wis.score - 10) / 2))"
      target:
        type: single
        range: reach 5 feet
      hit:
        - type: damage
          dice:
            count: "$(meta.level >= 6 ? 2 : 1)"
            sides: 8
            bonus: "$(Math.floor((stats.wis.score - 10) / 2))"
          damageType: slashing
bonusActions:
  - id: eruptingBreach
    name: Erupting Breach
    mechanic:
      pattern: save
      trigger:
        text: You moved at least 10 feet underground and emerged within 5 feet of a creature on this turn
      save:
        ability: str
        dc: "$(attributes.spellcasting.save)"
      target:
        type: single
        range: 5 feet
      failure:
        - type: damage
          dice:
            count: "$(meta.level >= 6 ? 2 : 1)"
            sides: 8
            bonus: "$(Math.floor((stats.wis.score - 10) / 2))"
          damageType: bludgeoning
        - type: condition
          condition: prone
