type: Statblock
name: Excavator
id: wildShapeExcavator
summary: Giant badgers and moles that burrow and rend.
tags: [lunarWildShape, classOption]
repeatable: true
size: "$(meta.level >= 6 ? 'Large' : 'Medium')"
category: wildShape
classification: Beast
ac: "$(13 + Math.floor((stats.wis.score - 10) / 2))"
movement:
  walk: 30
  burrow: 20
stats:
  str: "$(14 + Math.floor(meta.level / 3))"
  dex: "$(14 + Math.floor(meta.level / 3))"
  con: "$(15 + Math.floor(meta.level / 3))"
  int: "$(stats.int.score)"
  wis: "$(stats.wis.score)"
  cha: "$(stats.cha.score)"
senses:
  blindsight: 30
actions:
  - name: Multiattack
    description: "You make two Bestial Strikes."
  - name: Bestial Strike
    description: "_Melee Attack Roll:_ $(formatBonus((meta.level >= 5 ? 3 : 2) + Math.floor((stats.wis.score - 10) / 2))) to hit, reach 5 ft., one target. _Hit:_ $(meta.level >= 6 ? 2 : 1)d6$(formatBonus(Math.floor((stats.wis.score - 10) / 2))) Piercing or Slashing damage."