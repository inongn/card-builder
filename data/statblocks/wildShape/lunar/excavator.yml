type: Statblock
name: Subterranean Excavator
id: wildShapeExcavator
summary: Giant badgers and moles that ambush from below and carve tunnels.
tags: [lunarWildShape, classOption]
repeatable: true
size: "$(meta.level >= 6 ? 'Large' : 'Medium')"
category: wildShape
classification: Beast
ac: "$(13 + Math.floor((stats.wis.score - 10) / 2))"
movement:
  walk: 30
  burrow: 20
stats:
  str: "$(15 + Math.floor(meta.level / 3))"
  dex: "$(14 + Math.floor(meta.level / 3))"
  con: "$(16 + Math.floor(meta.level / 3))"
  int: "$(stats.int.score)"
  wis: "$(stats.wis.score)"
  cha: "$(stats.cha.score)"
senses:
  tremorsense: 60
traits:
  - name: Tunneler
    description: "You can burrow through solid earth and nonmagical, unworked stone. While doing so, you can choose to leave a 5-foot-diameter tunnel in your wake."
actions:
  - name: Bestial Strike
    description: "_Melee Attack Roll:_ $(formatBonus((meta.level >= 5 ? 3 : 2) + Math.floor((stats.wis.score - 10) / 2))) to hit, reach 5 ft., one target. _Hit:_ $(meta.level >= 6 ? 2 : 1)d8$(formatBonus(Math.floor((stats.wis.score - 10) / 2))) Slashing damage."
bonusActions:
  - name: Erupting Breach
    description: "If you moved at least 10 feet underground and emerged within 5 feet of a creature on this turn, you can force that creature to make a DC $(attributes.spellcasting.save) Strength saving throw. _Failure:_ $(meta.level >= 6 ? 2 : 1)d8$(formatBonus(Math.floor((stats.wis.score - 10) / 2))) Bludgeoning damage and the target is knocked prone."
