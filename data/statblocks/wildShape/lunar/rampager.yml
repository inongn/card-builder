type: Statblock
name: Aquatic Rampager Beast
id: aquaticLunarBeastRampager
summary: Sharks and barracudas with blood frenzy against wounded prey.
tags: [lunarWildShape, classOption]
repeatable: true
size: "$(meta.level >= 15 ? 'Gargantuan' : meta.level >= 9 ? 'Huge' : meta.level >= 6 ? 'Large' : 'Medium')"
category: wildShape
classification: Beast
ac: "$(12 + Math.floor((9 + Math.floor(meta.level / 3) - 10) / 2))"
hp: "$(((meta.level >= 18 ? 13 : meta.level >= 15 ? 11 : meta.level >= 12 ? 9 : meta.level >= 9 ? 7 : meta.level >= 6 ? 5 : 3)) * (6 + Math.floor((14 + Math.floor(meta.level / 3) - 10) / 2)))"
movement:
  walk: 0
  swim: 60
stats:
  str: "$(14 + Math.floor(meta.level / 3))"
  dex: "$(9 + Math.floor(meta.level / 3))"
  con: "$(14 + Math.floor(meta.level / 3))"
  int: "$(stats.int.score)"
  wis: "$(stats.wis.score)"
  cha: "$(stats.cha.score)"
senses:
  blindsight: "$(meta.level >= 9 ? 120 : 60)"
traits:
  - name: Aquatic Nature
    description: "You can breathe air and water. You have blindsight to a distance of $(meta.level >= 9 ? '120' : '60') ft."
  - name: Blood Frenzy
    description: "You have advantage on melee attack rolls against any creature that doesn't have all its hit points."
actions:
  - name: Bite
    description: "_Melee Attack Roll:_ $(formatBonus((meta.level >= 15 ? 3 : 2) + Math.floor((14 + Math.floor(meta.level / 3) - 10) / 2))) to hit, reach 5 ft., one target. _Hit:_ $(meta.level >= 6 ? 2 : 1)d8$(formatBonus(Math.floor((14 + Math.floor(meta.level / 3) - 10) / 2) + Math.floor(meta.level / 3) + (meta.level >= 15 ? 4 : meta.level >= 9 ? 2 : 0))) Piercing damage."
