type: Statblock
name: Webber Beast
id: lunarBeastWebber
summary: Giant spiders with web-walking, venomous bites, and webs.
tags: [lunarWildShape, classOption]
repeatable: true
size: "$(meta.level >= 12 ? 'Huge' : meta.level >= 6 ? 'Large' : 'Medium')"
category: wildShape
classification: Beast
ac: "$(12 + Math.floor((15 + Math.floor(meta.level / 6) - 10) / 2))"
hp: "$(((meta.level >= 18 ? 13 : meta.level >= 15 ? 11 : meta.level >= 12 ? 9 : meta.level >= 9 ? 7 : meta.level >= 6 ? 5 : 3)) * (6 + Math.floor((14 + Math.floor(meta.level / 3) - 10) / 2)))"
movement:
  walk: 30
  climb: 30
stats:
  str: "$(10 + Math.floor(meta.level / 3))"
  dex: "$(15 + Math.floor(meta.level / 6))"
  con: "$(14 + Math.floor(meta.level / 3))"
  int: "$(stats.int.score)"
  wis: "$(stats.wis.score)"
  cha: "$(stats.cha.score)"
senses:
  darkvision: 60
traits:
  - name: Keen Sense
    description: "You have advantage on Wisdom (Perception) checks that rely on hearing, sight, or smell (your choice)."
  - name: Web Walk
    description: "You can climb difficult surfaces, including upside down on ceilings, without needing to make an ability check. Additionally, you ignore movement restrictions caused by webbing."
actions:
  - name: Venomous Bite
    description: "_Melee Attack Roll:_ $(formatBonus((meta.level >= 15 ? 3 : 2) + Math.floor((15 + Math.floor(meta.level / 6) - 10) / 2))) to hit, reach 5 ft., one target. _Hit:_ $(meta.level >= 6 ? 2 : 1)d6$(formatBonus(Math.floor((15 + Math.floor(meta.level / 6) - 10) / 2) + Math.floor(meta.level / 3) + (meta.level >= 12 ? 2 : 0))) Piercing damage, and the target must make a DC $(attributes.spellcasting.save) Constitution saving throw, taking $(2 + Math.floor((meta.level - 3) / 3))d6 Poison damage on a failed save, or half as much on a successful one."
  - name: Web (Recharge 5-6)
    description: "_Ranged Attack Roll:_ $(formatBonus((meta.level >= 15 ? 3 : 2) + Math.floor((15 + Math.floor(meta.level / 6) - 10) / 2))) to hit, range 30/60 ft., one creature. _Hit:_ The target is Restrained by webbing. As an action, a creature can make a DC $(attributes.spellcasting.save) Strength saving throw, busting the webbing on a success. The webbing can also be attacked and destroyed (AC 10; hp 5; vulnerability to Fire damage; immunity to Bludgeoning, Poison, and Psychic damage)."
