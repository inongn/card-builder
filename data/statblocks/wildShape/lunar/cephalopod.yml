type: Statblock
name: Cephalopod Beast
id: wildShapeCephalopod
summary: Octopuses and squids that grapple and restrain foes with long arms, then escape in a cloud of ink.
tags: [lunarWildShape, classOption]
repeatable: true
size: "$(meta.level >= 6 ? 'Large' : 'Medium')"
category: wildShape
classification: Beast
ac: "$(13 + Math.floor((stats.wis.score - 10) / 2))"
movement:
  walk: 10
  swim: 60
stats:
  str: "$(15 + Math.floor(meta.level / 3))"
  dex: "$(14 + Math.floor(meta.level / 3))"
  con: "$(13 + Math.floor(meta.level / 3))"
  int: "$(stats.int.score)"
  wis: "$(stats.wis.score)"
  cha: "$(stats.cha.score)"
senses:
  darkvision: 60
traits:
  - name: Water Breathing
    description: "You can breathe only underwater, but can hold your breath for 1 hour."
actions:
  - name: Bestial Strike
    description: "_Melee Attack Roll:_ $(formatBonus((meta.level >= 5 ? 3 : 2) + Math.floor((stats.wis.score - 10) / 2))), reach 10 ft. _Hit:_ $(meta.level >= 6 ? 2 : 1)d8$(formatBonus(Math.floor((stats.wis.score - 10) / 2))) Bludgeoning damage, and if the target is a creature, it has the Grappled condition (escape DC $(attributes.spellcasting.save)) and the Restrained condition."
reactions:
  - name: Ink Cloud (1/Day)
    description: "_Trigger:_ When you take damage while underwater. _Response:_ You release ink that fills a 10-foot Cube, and move up to your Swim Speed without provoking Opportunity Attacks, and the area is Heavily Obscured for 1 minute."