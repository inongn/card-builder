type: Statblock
name: Cephalopod Beast
id: wildShapeCephalopod
summary: Octopuses and squids that grapple and restrain foes with long arms, then escape in a cloud of ink.
tags: [lunarWildShape, classOption]
repeatable: true
size: "$(meta.level >= 6 ? 'Large' : 'Medium')"
category: wildShape
classification: Beast
ac: "$(13 + Math.floor((stats.wis.score - 10) / 2))"
movement:
  walk: 10
  swim: 60
stats:
  str: "$(15 + Math.floor(meta.level / 3))"
  dex: "$(14 + Math.floor(meta.level / 3))"
  con: "$(13 + Math.floor(meta.level / 3))"
  int: "$(stats.int.score)"
  wis: "$(stats.wis.score)"
  cha: "$(stats.cha.score)"
senses:
  darkvision: 60
traits:
  - name: Water Breathing
    description: "You can breathe only underwater, but can hold your breath for 1 hour."
actions:
  - id: bestialStrike
    name: Bestial Strike
    mechanic:
      pattern: attack
      attack:
        classification: melee
        type: weapon
        bonus: "$((meta.level >= 5 ? 3 : 2) + Math.floor((stats.wis.score - 10) / 2))"
      target:
        type: single
        range: reach 10 feet
      hit:
        - type: damage
          dice:
            count: "$(meta.level >= 6 ? 2 : 1)"
            sides: 8
            bonus: "$(Math.floor((stats.wis.score - 10) / 2))"
          damageType: bludgeoning
        - type: condition
          condition:
            - grappled
            - restrained
          end: action_check
reactions:
  - id: inkCloud
    name: Ink Cloud
    limit: 1/Day
    mechanic:
      pattern: automatic
      trigger:
        event: take_damage
        text: You take damage while underwater
      payloads:
        - type: movement
          provokesOpportunityAttacks: false
          text: release ink that fills a 10-foot Cube, and move up to your Swim Speed without provoking Opportunity Attacks
        - type: text
          text: the area is Heavily Obscured for 1 minute
