type: Statblock
name: Cephalopod
id: wildShapeCephalopod
summary: Giant octopuses and squids that grab and ink.
tags: [lunarWildShape, classOption]
repeatable: true
size: "$(meta.level >= 6 ? 'Large' : 'Medium')"
category: wildShape
classification: Beast
ac: "$(13 + Math.floor((stats.wis.score - 10) / 2))"
movement:
  walk: 10
  swim: 60
stats:
  str: "$(15 + Math.floor(meta.level / 3))"
  dex: "$(14 + Math.floor(meta.level / 3))"
  con: "$(13 + Math.floor(meta.level / 3))"
  int: "$(stats.int.score)"
  wis: "$(stats.wis.score)"
  cha: "$(stats.cha.score)"
senses:
  darkvision: 60
traits:
  - name: Water Breathing
    description: "You can breathe only underwater, but can hold your breath for 1 hour."
actions:
  - name: Bestial Strike
    description: "_Melee Attack Roll:_ $(formatBonus((meta.level >= 5 ? 3 : 2) + Math.floor((stats.wis.score - 10) / 2))) to hit, reach 10 ft., one target. _Hit:_ $(meta.level >= 6 ? 2 : 1)d8$(formatBonus(Math.floor((stats.wis.score - 10) / 2))) Bludgeoning damage. If the target is a creature, it is grappled (escape DC $(attributes.spellcasting.save)) and restrained."
reactions:
  - name: Ink Cloud (1/Day)
    description: "_Trigger:_ You take damage while underwater. _Response:_ Release ink that fills a 10-foot Cube, and move up to your Swim Speed without provoking Opportunity Attacks. The area is Heavily Obscured for 1 minute."