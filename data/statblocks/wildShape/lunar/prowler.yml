type: Statblock
name: Ambush Prowler Beast
id: wildShapeAmbushProwler
summary: Panthers, tigers, and lions that climb, pounce from stealth, and slip away after striking.
tags: [lunarWildShape, classOption]
repeatable: true
size: "$(meta.level >= 6 ? 'Large' : 'Medium')"
category: wildShape
classification: Beast
ac: "$(13 + Math.floor((stats.wis.score - 10) / 2))"
movement:
  walk: 40
  climb: 30
stats:
  str: "$(14 + Math.floor(meta.level / 3))"
  dex: "$(16 + Math.floor(meta.level / 3))"
  con: "$(14 + Math.floor(meta.level / 3))"
  int: "$(stats.int.score)"
  wis: "$(stats.wis.score)"
  cha: "$(stats.cha.score)"
senses:
  darkvision: 60
traits:
  - name: Running Leap
    description: "With a 10-foot running start, you can Long Jump up to 25 feet."
actions:
  - id: bestialStrike
    name: Bestial Strike
    mechanic:
      pattern: attack
      attack:
        classification: melee
        type: weapon
        bonus: "$((meta.level >= 5 ? 3 : 2) + Math.floor((stats.wis.score - 10) / 2))"
      target:
        type: single
        range: reach 5 feet
      hit:
        - type: damage
          dice:
            count: "$(meta.level >= 6 ? 2 : 1)"
            sides: 8
            bonus: "$(Math.floor((stats.wis.score - 10) / 2))"
          damageType: slashing
bonusActions:
  - id: nimbleEscape
    name: Nimble Escape
    mechanic:
      pattern: automatic
      target:
        type: self
      payloads:
        - type: action
          text: take the Disengage or Hide action
