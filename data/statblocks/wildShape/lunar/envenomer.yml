type: Statblock
name: Envenomer Beast
id: lunarBeastEnvenomer
summary: Vipers and venomous snakes delivering deadly poison bites.
tags: [lunarWildShape, classOption]
repeatable: true
size: "$(meta.level >= 12 ? 'Huge' : meta.level >= 6 ? 'Large' : 'Medium')"
category: wildShape
classification: Beast
ac: "$(12 + Math.floor((15 + Math.floor(meta.level / 6) - 10) / 2))"
movement:
  walk: 30
  climb: 30
stats:
  str: "$(14 + Math.floor(meta.level / 3))"
  dex: "$(15 + Math.floor(meta.level / 6))"
  con: "$(14 + Math.floor(meta.level / 3))"
  int: "$(stats.int.score)"
  wis: "$(stats.wis.score)"
  cha: "$(stats.cha.score)"
senses:
  darkvision: 60
traits:
  - name: Keen Sense
    description: "You have advantage on Wisdom (Perception) checks that rely on hearing, sight, or smell (your choice)."
actions:
  - name: Venomous Bite
    description: "_Melee Attack Roll:_ $(formatBonus((meta.level >= 15 ? 3 : 2) + Math.floor((14 + Math.floor(meta.level / 3) - 10) / 2))) to hit, reach 5 ft., one target. _Hit:_ $(meta.level >= 6 ? 2 : 1)d6$(formatBonus(Math.floor((14 + Math.floor(meta.level / 3) - 10) / 2) + Math.floor(meta.level / 3) + (meta.level >= 12 ? 2 : 0))) Piercing damage, and the target must make a DC $(attributes.spellcasting.save) Constitution saving throw, taking $(2 + Math.floor((meta.level - 3) / 3))d6 Poison damage on a failed save, or half as much on a successful one."
