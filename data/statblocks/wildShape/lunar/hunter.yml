type: Statblock
name: Pack Hunter Beast
id: wildShapePackHunter
summary: Wolves, hyenas, and jackals that fight alongside allies, bite foes down, and press the attack.
tags: [lunarWildShape, classOption]
repeatable: true
size: "$(meta.level >= 6 ? 'Large' : 'Medium')"
category: wildShape
classification: Beast
ac: "$(13 + Math.floor((stats.wis.score - 10) / 2))"
movement:
  walk: 40
stats:
  str: "$(14 + Math.floor(meta.level / 3))"
  dex: "$(15 + Math.floor(meta.level / 3))"
  con: "$(14 + Math.floor(meta.level / 3))"
  int: "$(stats.int.score)"
  wis: "$(stats.wis.score)"
  cha: "$(stats.cha.score)"
senses:
  darkvision: 60
traits:
  - name: Pack Tactics
    description: "You have advantage on an attack roll against a creature if at least one of your allies is within 5 feet of the creature."
actions:
  - id: bestialStrike
    name: Bestial Strike
    mechanic:
      pattern: attack
      attack:
        classification: melee
        type: weapon
        bonus: "$((meta.level >= 5 ? 3 : 2) + Math.floor((stats.wis.score - 10) / 2))"
      target:
        type: single
        range: reach 5 feet
      hit:
        - type: damage
          dice:
            count: "$(meta.level >= 6 ? 2 : 1)"
            sides: 8
            bonus: "$(Math.floor((stats.wis.score - 10) / 2))"
          damageType: piercing
        - type: condition
          condition: prone
bonusActions:
  - id: rampage
    name: Rampage
    mechanic:
      pattern: automatic
      trigger:
        text: Immediately after you deal damage to a creature that is Bloodied
      payloads:
        - type: movement
          text: move up to half your Speed
        - type: action
          text: make one Bestial Strike
