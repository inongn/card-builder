type: Statblock
name: Pack Hunter
id: wildShapePackHunter
summary: Wolves, hyenas, and pack hounds that knock prey down.
tags: [lunarWildShape, classOption]
repeatable: true
size: "$(meta.level >= 6 ? 'Large' : 'Medium')"
category: wildShape
classification: Beast
ac: "$(13 + Math.floor((stats.wis.score - 10) / 2))"
movement:
  walk: 40
stats:
  str: "$(14 + Math.floor(meta.level / 3))"
  dex: "$(15 + Math.floor(meta.level / 3))"
  con: "$(14 + Math.floor(meta.level / 3))"
  int: "$(stats.int.score)"
  wis: "$(stats.wis.score)"
  cha: "$(stats.cha.score)"
senses:
  darkvision: 60
traits:
  - name: Pack Tactics
    description: "You have advantage on an attack roll against a creature if at least one of your allies is within 5 feet of the creature and the ally isn't incapacitated."
actions:
  - name: Bestial Strike
    description: "_Melee Attack Roll:_ $(formatBonus((meta.level >= 5 ? 3 : 2) + Math.floor((stats.wis.score - 10) / 2))) to hit, reach 5 ft., one target. _Hit:_ $(meta.level >= 6 ? 2 : 1)d8$(formatBonus(Math.floor((stats.wis.score - 10) / 2))) Piercing damage. If the target is a creature, it must succeed on a DC $(attributes.spellcasting.save) Strength saving throw or be knocked prone."
bonusActions:
  - name: Rampage
    description: "Immediately after dealing damage to a creature that is Bloodied, you can move up to half your Speed and make one Bestial Strike."