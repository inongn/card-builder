type: Statblock
name: Pack Hunter Beast
id: wildShapePackHunter
summary: Wolves, hyenas, and jackals that fight alongside allies, bite foes down, and press the attack.
tags: [lunarWildShape, classOption]
repeatable: true
size: "$(meta.level >= 6 ? 'Large' : 'Medium')"
category: wildShape
classification: Beast
ac: "$(13 + Math.floor((stats.wis.score - 10) / 2))"
movement:
  walk: 40
stats:
  str: "$(14 + Math.floor(meta.level / 3))"
  dex: "$(15 + Math.floor(meta.level / 3))"
  con: "$(14 + Math.floor(meta.level / 3))"
  int: "$(stats.int.score)"
  wis: "$(stats.wis.score)"
  cha: "$(stats.cha.score)"
senses:
  darkvision: 60
traits:
  - name: Pack Tactics
    description: "You have advantage on an attack roll against a creature if at least one of your allies is within 5 feet of the creature."
actions:
  - name: Bestial Strike
    description: "_Melee Attack Roll:_ $(formatBonus((meta.level >= 5 ? 3 : 2) + Math.floor((stats.wis.score - 10) / 2))), reach 5 ft. _Hit:_ $(meta.level >= 6 ? 2 : 1)d8$(formatBonus(Math.floor((stats.wis.score - 10) / 2))) Piercing damage, and if the target is a creature of your size or smaller, it has the Prone condition."
bonusActions:
  - name: Rampage
    description: "Immediately after you deal damage to a creature that is Bloodied, you can move up to half your Speed and make one Bestial Strike."