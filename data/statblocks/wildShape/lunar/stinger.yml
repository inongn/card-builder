type: Statblock
name: Aerial Stinger Beast
id: aerialLunarBeastStinger
summary: Giant wasps and hornets with lethal venomous stingers.
tags: [lunarWildShape, classOption]
repeatable: true
size: "$(meta.level >= 12 ? 'Large' : 'Medium')"
category: wildShape
classification: Beast
ac: "$(10 + Math.floor((17 + Math.floor(meta.level / 3) - 10) / 2))"
movement:
  walk: 10
  fly: 60
stats:
  str: "$(12 + Math.floor(meta.level / 3))"
  dex: "$(17 + Math.floor(meta.level / 3))"
  con: "$(11 + Math.floor(meta.level / 3))"
  int: "$(stats.int.score)"
  wis: "$(stats.wis.score)"
  cha: "$(stats.cha.score)"
actions:
  - name: Venomous Sting
    description: "_Melee Attack Roll:_ $(formatBonus((meta.level >= 15 ? 3 : 2) + Math.floor((17 + Math.floor(meta.level / 3) - 10) / 2))) to hit, reach 5 ft., one target. _Hit:_ $(meta.level >= 12 ? 2 : 1)d8$(formatBonus(Math.floor((17 + Math.floor(meta.level / 3) - 10) / 2) + Math.floor(meta.level / 3))) Piercing damage, and the target must succeed on a DC $(attributes.spellcasting.save) Constitution saving throw or take $(1 + Math.floor((meta.level - 3) / 3))d10 Poison damage."
