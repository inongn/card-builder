type: Statblock
name: Armored Bastion Beast
id: wildShapeArmoredBastion
summary: Ankylosaurs, armadillos, and turtles with heavy armor and sturdy saves that bash foes to the ground.
tags: [lunarWildShape, classOption]
repeatable: true
size: "$(meta.level >= 6 ? 'Large' : 'Medium')"
category: wildShape
classification: Beast
ac: "$(15 + Math.floor((stats.wis.score - 10) / 2))"
movement:
  walk: 30
stats:
  str: "$(17 + Math.floor(meta.level / 3))"
  dex: "$(10 + Math.floor(meta.level / 3))"
  con: "$(16 + Math.floor(meta.level / 3))"
  int: "$(stats.int.score)"
  wis: "$(stats.wis.score)"
  cha: "$(stats.cha.score)"
saveBonus:
  str: "$(Math.floor(meta.level / 2))"
  con: "$(Math.floor(meta.level / 2))"
traits:
  - name: Siege Monster
    description: "You deal double damage to objects and structures."
actions:
  - id: bestialStrike
    name: Bestial Strike
    mechanic:
      pattern: attack
      attack:
        classification: melee
        type: weapon
        bonus: "$((meta.level >= 5 ? 3 : 2) + Math.floor((stats.wis.score - 10) / 2))"
      target:
        type: single
        range: reach 10 feet
      hit:
        - type: damage
          dice:
            count: "$(meta.level >= 6 ? 2 : 1)"
            sides: 10
            bonus: "$(Math.floor((stats.wis.score - 10) / 2))"
          damageType: bludgeoning
        - type: condition
          condition: prone
