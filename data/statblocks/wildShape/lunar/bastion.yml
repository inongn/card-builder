type: Statblock
name: Armored Bastion
id: wildShapeArmoredBastion
summary: Ankylosaurs and armadillos with heavy natural armor.
tags: [lunarWildShape, classOption]
repeatable: true
size: "$(meta.level >= 6 ? 'Large' : 'Medium')"
category: wildShape
classification: Beast
ac: "$(15 + Math.floor((stats.wis.score - 10) / 2))"
movement:
  walk: 30
stats:
  str: "$(17 + Math.floor(meta.level / 3))"
  dex: "$(10 + Math.floor(meta.level / 3))"
  con: "$(16 + Math.floor(meta.level / 3))"
  int: "$(stats.int.score)"
  wis: "$(stats.wis.score)"
  cha: "$(stats.cha.score)"
saveBonus:
  str: "$(Math.floor(meta.level / 2))"
  con: "$(Math.floor(meta.level / 2))"
actions:
  - name: Bestial Strike
    description: "_Melee Attack Roll:_ $(formatBonus((meta.level >= 5 ? 3 : 2) + Math.floor((stats.wis.score - 10) / 2))) to hit, reach 10 ft., one target. _Hit:_ $(meta.level >= 6 ? 2 : 1)d10$(formatBonus(Math.floor((stats.wis.score - 10) / 2))) Bludgeoning damage. If the target is a creature of your size or smaller, it has the Prone condition."