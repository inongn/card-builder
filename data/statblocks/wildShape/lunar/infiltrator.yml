type: Statblock
name: Infiltrator Beast
id: lunarBeastInfiltrator
summary: Mice, cats, and stealthy insects that slip through tiny spaces and evade attacks.
tags: [lunarWildShape, classOption]
repeatable: true
size: Tiny
category: wildShape
classification: Beast
ac: "$(12 + Math.floor((18 + Math.floor(meta.level / 6) - 10) / 2))"
hp: "$(((meta.level >= 18 ? 13 : meta.level >= 15 ? 11 : meta.level >= 12 ? 9 : meta.level >= 9 ? 7 : meta.level >= 6 ? 5 : 3)) * (6 + Math.floor((14 + Math.floor(meta.level / 3) - 10) / 2)))"
movement:
  walk: 30
  climb: 30
stats:
  str: "$(2 + Math.floor(meta.level / 3))"
  dex: "$(13 + Math.floor(meta.level / 6))"
  con: "$(8 + Math.floor(meta.level / 3))"
  int: "$(stats.int.score)"
  wis: "$(stats.wis.score)"
  cha: "$(stats.cha.score)"
traits:
  - name: Agile
    description: "You don't provoke Opportunity Attacks when moving out of an enemy's reach."
  - name: Keen Sense
    description: "You have advantage on Wisdom (Perception) checks that rely on hearing, sight, or smell (your choice)."
  - name: Elusive Smallness
    description: "You can pass through spaces as narrow as 1 inch. Attack rolls against you have Disadvantage unless you are Incapacitated."
actions:
  - name: Nip
    description: "_Melee Attack Roll:_ $(formatBonus((meta.level >= 15 ? 3 : 2) + Math.floor((18 + Math.floor(meta.level / 6) - 10) / 2))) to hit, reach 5 ft., one target. _Hit:_ 1 Piercing damage."
bonusActions:
  - name: Nimble Escape
    description: "You take the Disengage or Hide action."