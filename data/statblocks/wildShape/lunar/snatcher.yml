type: Statblock
name: Aerial Snatcher
id: wildShapeAerialSnatcher
summary: Giant eagles and hawks that grapple and drop prey.
tags: [lunarWildShape, classOption]
repeatable: true
size: "$(meta.level >= 6 ? 'Large' : 'Medium')"
category: wildShape
classification: Beast
ac: "$(13 + Math.floor((stats.wis.score - 10) / 2))"
movement:
  walk: 10
  fly: 60
stats:
  str: "$(14 + Math.floor(meta.level / 3))"
  dex: "$(16 + Math.floor(meta.level / 3))"
  con: "$(13 + Math.floor(meta.level / 3))"
  int: "$(stats.int.score)"
  wis: "$(stats.wis.score)"
  cha: "$(stats.cha.score)"
traits:
  - name: Keen Sight
    description: "You have advantage on Wisdom (Perception) checks that rely on sight."
actions:
  - name: Bestial Strike
    description: "_Melee Attack Roll:_ $(formatBonus((meta.level >= 5 ? 3 : 2) + Math.floor((stats.wis.score - 10) / 2))) to hit, reach 5 ft., one target. _Hit:_ $(meta.level >= 6 ? 2 : 1)d6$(formatBonus(Math.floor((stats.wis.score - 10) / 2))) Slashing damage, and the target is grappled (escape DC $(attributes.spellcasting.save)), provided it is no larger than you."
bonusActions:
  - name: Swoop (Recharge 5-6)
    description: "If you have a creature grappled, you fly up to half your Fly Speed without provoking Opportunity Attacks and drop that creature."
