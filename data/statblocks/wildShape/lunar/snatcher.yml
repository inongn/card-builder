type: Statblock
name: Aerial Snatcher Beast
id: wildShapeAerialSnatcher
summary: Giant eagles and vultures that seize foes in their talons, then swoop away and drop them.
tags: [lunarWildShape, classOption]
repeatable: true
size: "$(meta.level >= 6 ? 'Large' : 'Medium')"
category: wildShape
classification: Beast
ac: "$(13 + Math.floor((stats.wis.score - 10) / 2))"
movement:
  walk: 10
  fly: 60
stats:
  str: "$(14 + Math.floor(meta.level / 3))"
  dex: "$(16 + Math.floor(meta.level / 3))"
  con: "$(13 + Math.floor(meta.level / 3))"
  int: "$(stats.int.score)"
  wis: "$(stats.wis.score)"
  cha: "$(stats.cha.score)"
traits:
  - name: Keen Sight
    description: "You have advantage on Wisdom (Perception) checks that rely on sight."
actions:
  - id: bestialStrike
    name: Bestial Strike
    mechanic:
      pattern: attack
      attack:
        classification: melee
        type: weapon
        bonus: "$((meta.level >= 5 ? 3 : 2) + Math.floor((stats.wis.score - 10) / 2))"
      target:
        type: single
        range: reach 5 feet
      hit:
        - type: damage
          dice:
            count: "$(meta.level >= 6 ? 2 : 1)"
            sides: 6
            bonus: "$(Math.floor((stats.wis.score - 10) / 2))"
          damageType: slashing
        - type: condition
          condition: grappled
          end: action_check
bonusActions:
  - id: swoop
    name: Swoop
    recharge: 5-6
    mechanic:
      pattern: automatic
      trigger:
        text: when you have a creature grappled
      payloads:
        - type: movement
          provokesOpportunityAttacks: false
          text: fly up to half your Fly Speed without provoking Opportunity Attacks
        - type: action
          text: drop that creature
