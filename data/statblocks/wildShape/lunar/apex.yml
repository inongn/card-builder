type: Statblock
name: Depth Apex
id: wildShapeDepthApex
summary: Sharks and predatory fish drawn to blood.
tags: [lunarWildShape, classOption]
repeatable: true
size: "$(meta.level >= 6 ? 'Large' : 'Medium')"
category: wildShape
classification: Beast
ac: "$(12 + Math.floor((stats.wis.score - 10) / 2))"
movement:
  walk: 5
  swim: 60
stats:
  str: "$(16 + Math.floor(meta.level / 3))"
  dex: "$(14 + Math.floor(meta.level / 3))"
  con: "$(16 + Math.floor(meta.level / 3))"
  int: "$(stats.int.score)"
  wis: "$(stats.wis.score)"
  cha: "$(stats.cha.score)"
senses:
  blindsight: 60
traits:
  - name: Water Breathing
    description: "You can breathe only underwater."
actions:
  - name: Bestial Strike
    description: "_Melee Attack Roll:_ $(formatBonus((meta.level >= 5 ? 3 : 2) + Math.floor((stats.wis.score - 10) / 2))) to hit (with Advantage if the target doesn't have all its Hit Points), reach 5 ft., one target. _Hit:_ $(meta.level >= 6 ? 2 : 1)d8$(formatBonus(Math.floor((stats.wis.score - 10) / 2))) Piercing damage."