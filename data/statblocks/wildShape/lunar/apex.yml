type: Statblock
name: Depth Apex Beast
id: wildShapeDepthApex
summary: Sharks, barracudas, and orcas that swim fast and sense prey, striking wounded foes with advantage.
tags: [lunarWildShape, classOption]
repeatable: true
size: "$(meta.level >= 6 ? 'Large' : 'Medium')"
category: wildShape
classification: Beast
ac: "$(12 + Math.floor((stats.wis.score - 10) / 2))"
movement:
  walk: 5
  swim: 60
stats:
  str: "$(16 + Math.floor(meta.level / 3))"
  dex: "$(14 + Math.floor(meta.level / 3))"
  con: "$(16 + Math.floor(meta.level / 3))"
  int: "$(stats.int.score)"
  wis: "$(stats.wis.score)"
  cha: "$(stats.cha.score)"
senses:
  blindsight: 60
traits:
  - name: Water Breathing
    description: "You can breathe only underwater."
actions:
  - id: multiattack
    name: Multiattack
    mechanic:
      pattern: automatic
      target:
        type: self
      payloads:
        - type: action
          text: make two Bestial Strikes
  - id: bestialStrike
    name: Bestial Strike
    mechanic:
      pattern: attack
      attack:
        classification: melee
        type: weapon
        bonus: "$((meta.level >= 5 ? 3 : 2) + Math.floor((stats.wis.score - 10) / 2))"
      target:
        type: single
        range: reach 5 feet
      hit:
        - type: damage
          dice:
            count: "$(meta.level >= 6 ? 2 : 1)"
            sides: 8
            bonus: "$(Math.floor((stats.wis.score - 10) / 2))"
          damageType: piercing
      text: "The attack roll has Advantage if the target doesn't have all its Hit Points."
