type: Statblock
name: Pincher Beast
id: lunarBeastPincher
summary: Crabs and scorpions with armored shells and grappling pincers.
tags: [lunarWildShape, classOption]
repeatable: true
size: "$(meta.level >= 12 ? 'Huge' : meta.level >= 6 ? 'Large' : 'Medium')"
category: wildShape
classification: Beast
ac: "$(14 + Math.floor((15 + Math.floor(meta.level / 6) - 10) / 2))"
movement:
  walk: 30
  swim: 30
stats:
  str: "$(14 + Math.floor(meta.level / 3))"
  dex: "$(15 + Math.floor(meta.level / 6))"
  con: "$(14 + Math.floor(meta.level / 3))"
  int: "$(stats.int.score)"
  wis: "$(stats.wis.score)"
  cha: "$(stats.cha.score)"
senses:
  darkvision: 60
traits:
  - name: Keen Sense
    description: "You have advantage on Wisdom (Perception) checks that rely on hearing, sight, or smell (your choice)."
actions:
  - name: Multiattack
    description: "You make two Pincer attacks."
  - name: Pincer
    description: "_Melee Attack Roll:_ $(formatBonus((meta.level >= 15 ? 3 : 2) + Math.floor((14 + Math.floor(meta.level / 3) - 10) / 2))) to hit, reach 5 ft., one target. _Hit:_ $(meta.level >= 6 ? 2 : 1)d4$(formatBonus(Math.floor((14 + Math.floor(meta.level / 3) - 10) / 2) + Math.floor(meta.level / 3) + (meta.level >= 12 ? 2 : 0))) Bludgeoning damage, and the target is grappled (escape DC $(attributes.spellcasting.save)). You have two pincers, each of which can grapple only one target."
