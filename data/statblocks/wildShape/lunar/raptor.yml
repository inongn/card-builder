type: Statblock
name: Flyby Raptor Beast
id: wildShapeFlybyRaptor
summary: Owls, bats, and pteranodons that fly swiftly, strike with keen senses, and dodge away from danger.
tags: [lunarWildShape, classOption]
repeatable: true
size: "$(meta.level >= 6 ? 'Large' : 'Medium')"
category: wildShape
classification: Beast
ac: "$(13 + Math.floor((stats.wis.score - 10) / 2))"
movement:
  walk: 10
  fly: 60
stats:
  str: "$(10 + Math.floor(meta.level / 3))"
  dex: "$(16 + Math.floor(meta.level / 3))"
  con: "$(12 + Math.floor(meta.level / 3))"
  int: "$(stats.int.score)"
  wis: "$(stats.wis.score)"
  cha: "$(stats.cha.score)"
senses:
  darkvision: 120
traits:
  - name: Flyby
    description: "You don't provoke Opportunity Attacks when you fly out of an enemy's reach."
actions:
  - id: multiattack
    name: Multiattack
    mechanic:
      pattern: automatic
      target:
        type: self
      payloads:
        - type: action
          text: make two Bestial Strikes
  - id: bestialStrike
    name: Bestial Strike
    mechanic:
      pattern: attack
      attack:
        classification: melee
        type: weapon
        bonus: "$((meta.level >= 5 ? 3 : 2) + Math.floor((stats.wis.score - 10) / 2))"
      target:
        type: single
        range: reach 5 feet
      hit:
        - type: damage
          dice:
            count: "$(meta.level >= 6 ? 2 : 1)"
            sides: 6
            bonus: "$(Math.floor((stats.wis.score - 10) / 2))"
          damageType: slashing
