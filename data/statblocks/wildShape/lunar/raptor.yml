type: Statblock
name: Flyby Raptor Beast
id: wildShapeFlybyRaptor
summary: Owls, bats, and pteranodons that fly swiftly, strike with keen senses, and dodge away from danger.
tags: [lunarWildShape, classOption]
repeatable: true
size: "$(meta.level >= 6 ? 'Large' : 'Medium')"
category: wildShape
classification: Beast
ac: "$(13 + Math.floor((stats.wis.score - 10) / 2))"
movement:
  walk: 10
  fly: 60
stats:
  str: "$(10 + Math.floor(meta.level / 3))"
  dex: "$(16 + Math.floor(meta.level / 3))"
  con: "$(12 + Math.floor(meta.level / 3))"
  int: "$(stats.int.score)"
  wis: "$(stats.wis.score)"
  cha: "$(stats.cha.score)"
senses:
  darkvision: 120
traits:
  - name: Flyby
    description: "You don't provoke Opportunity Attacks when you fly out of an enemy's reach."
actions:
  - name: Bestial Strike
    description: "_Melee Attack Roll:_ $(formatBonus((meta.level >= 5 ? 3 : 2) + Math.floor((stats.wis.score - 10) / 2))), reach 5 ft. _Hit:_ $(meta.level >= 6 ? 2 : 1)d6$(formatBonus(Math.floor((stats.wis.score - 10) / 2))) Slashing damage."