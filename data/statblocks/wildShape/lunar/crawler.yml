type: Statblock
name: Insectoid Crawler Beast
id: wildShapeInsectoidCrawler
summary: Giant spiders, scorpions, centipedes that climb, strike with poison, and restrain with webs or pollen.
tags: [lunarWildShape, classOption]
repeatable: true
size: "$(meta.level >= 6 ? 'Large' : 'Medium')"
category: wildShape
classification: Beast
ac: "$(13 + Math.floor((stats.wis.score - 10) / 2))"
movement:
  walk: 30
  climb: 30
stats:
  str: "$(12 + Math.floor(meta.level / 3))"
  dex: "$(16 + Math.floor(meta.level / 3))"
  con: "$(14 + Math.floor(meta.level / 3))"
  int: "$(stats.int.score)"
  wis: "$(stats.wis.score)"
  cha: "$(stats.cha.score)"
senses:
  blindsight: 30
  darkvision: 60
traits:
  - name: Spider Climb
    description: "You can climb difficult surfaces, including along ceilings, without needing to make an ability check."
actions:
  - name: Bestial Strike
    description: "_Melee Attack Roll:_ $(formatBonus((meta.level >= 5 ? 3 : 2) + Math.floor((stats.wis.score - 10) / 2))), reach 5 ft. _Hit:_ $(meta.level >= 6 ? 2 : 1)d6$(formatBonus(Math.floor((stats.wis.score - 10) / 2))) Piercing damage plus 1d6 Poison damage."
bonusActions:
  - name: Hazardous Spew (Recharge 5-6)
    description: "_Dexterity Saving Throw:_ DC $(attributes.spellcasting.save), one creature within 30 feet. _Failure:_ The target has the Restrained condition until the start of your next turn."