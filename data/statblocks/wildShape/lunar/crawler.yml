type: Statblock
name: Insectoid Crawler Beast
id: wildShapeInsectoidCrawler
summary: Giant spiders, scorpions, centipedes that climb, strike with poison, and restrain with webs or pollen.
tags: [lunarWildShape, classOption]
repeatable: true
size: "$(meta.level >= 6 ? 'Large' : 'Medium')"
category: wildShape
classification: Beast
ac: "$(13 + Math.floor((stats.wis.score - 10) / 2))"
movement:
  walk: 30
  climb: 30
stats:
  str: "$(12 + Math.floor(meta.level / 3))"
  dex: "$(16 + Math.floor(meta.level / 3))"
  con: "$(14 + Math.floor(meta.level / 3))"
  int: "$(stats.int.score)"
  wis: "$(stats.wis.score)"
  cha: "$(stats.cha.score)"
senses:
  blindsight: 30
  darkvision: 60
traits:
  - name: Spider Climb
    description: "You can climb difficult surfaces, including along ceilings, without needing to make an ability check."
actions:
  - id: bestialStrike
    name: Bestial Strike
    mechanic:
      pattern: attack
      attack:
        classification: melee
        type: weapon
        bonus: "$((meta.level >= 5 ? 3 : 2) + Math.floor((stats.wis.score - 10) / 2))"
      target:
        type: single
        range: reach 5 feet
      hit:
        - type: damage
          dice:
            count: "$(meta.level >= 6 ? 2 : 1)"
            sides: 6
            bonus: "$(Math.floor((stats.wis.score - 10) / 2))"
          damageType: piercing
        - type: damage
          dice:
            count: 1
            sides: 6
          damageType: poison
bonusActions:
  - id: hazardousSpew
    name: Hazardous Spew
    recharge: 5-6
    mechanic:
      pattern: save
      save:
        ability: dex
        dc: "$(attributes.spellcasting.save)"
      target:
        type: single
        range: 30 feet
      failure:
        type: condition
        condition: restrained
        end: end_of_your_next_turn
