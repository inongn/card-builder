type: Statblock
name: Aerial Barger Beast
id: aerialLunarBeastBarger
summary: Armored beetles and heavy flyers with crushing bash attacks.
tags: [lunarWildShape, classOption]
repeatable: true
size: "$(meta.level >= 12 ? 'Large' : 'Medium')"
category: wildShape
classification: Beast
ac: "$(14 + Math.floor((16 + Math.floor(meta.level / 3) - 10) / 2))"
hp: "$(((meta.level >= 18 ? 13 : meta.level >= 15 ? 11 : meta.level >= 12 ? 9 : meta.level >= 9 ? 7 : meta.level >= 6 ? 5 : 3)) * (4 + Math.floor((16 + Math.floor(meta.level / 3) - 10) / 2)))"
movement:
  walk: 30
  fly: 30
stats:
  str: "$(17 + Math.floor(meta.level / 3))"
  dex: "$(16 + Math.floor(meta.level / 3))"
  con: "$(16 + Math.floor(meta.level / 3))"
  int: "$(stats.int.score)"
  wis: "$(stats.wis.score)"
  cha: "$(stats.cha.score)"
actions:
  - name: Bash
    description: "_Melee Attack Roll:_ $(formatBonus((meta.level >= 15 ? 3 : 2) + Math.floor((17 + Math.floor(meta.level / 3) - 10) / 2))) to hit, reach 5 ft., one target. _Hit:_ $(meta.level >= 12 ? 2 : 1)d12$(formatBonus(Math.floor((17 + Math.floor(meta.level / 3) - 10) / 2) + Math.floor(meta.level / 3))) Bludgeoning damage."
