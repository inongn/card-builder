type: Statblock
name: Aquatic Grasper Beast
id: aquaticLunarBeastGrasper
summary: Octopuses and squids with reach and grasping tentacles.
tags: [lunarWildShape, classOption]
repeatable: true
size: "$(meta.level >= 15 ? 'Gargantuan' : meta.level >= 9 ? 'Huge' : meta.level >= 6 ? 'Large' : 'Medium')"
category: wildShape
classification: Beast
ac: "$(12 + Math.floor((12 + Math.floor(meta.level / 3) - 10) / 2))"
hp: "$(((meta.level >= 18 ? 13 : meta.level >= 15 ? 11 : meta.level >= 12 ? 9 : meta.level >= 9 ? 7 : meta.level >= 6 ? 5 : 3)) * (6 + Math.floor((14 + Math.floor(meta.level / 3) - 10) / 2)))"
movement:
  walk: 10
  swim: 60
stats:
  str: "$(15 + Math.floor(meta.level / 3))"
  dex: "$(12 + Math.floor(meta.level / 3))"
  con: "$(14 + Math.floor(meta.level / 3))"
  int: "$(stats.int.score)"
  wis: "$(stats.wis.score)"
  cha: "$(stats.cha.score)"
senses:
  blindsight: "$(meta.level >= 9 ? 120 : 60)"
traits:
  - name: Aquatic Nature
    description: "You can breathe air and water. You have blindsight to a distance of $(meta.level >= 9 ? '120' : '60') ft."
actions:
  - name: Ink Cloud (Recharges after a Short or Long Rest)
    description: "A cloud of ink with a radius equal to your space extends around you if you are underwater. The area is heavily obscured for 1 minute, although a significant current can disperse the ink. After releasing the ink, you can use the Dash action as a bonus action."
  - name: Tentacles
    description: "_Melee Attack Roll:_ $(formatBonus((meta.level >= 15 ? 3 : 2) + Math.floor((15 + Math.floor(meta.level / 3) - 10) / 2))) to hit, reach $(meta.level >= 9 ? '15' : '10') ft., one target. _Hit:_ $(meta.level >= 6 ? 2 : 1)d8$(formatBonus(Math.floor((15 + Math.floor(meta.level / 3) - 10) / 2) + Math.floor(meta.level / 3) + (meta.level >= 15 ? 4 : meta.level >= 9 ? 2 : 0))) Bludgeoning damage. If the target is a creature, it is grappled (escape DC $(attributes.spellcasting.save)). Until this grapple ends, the target is restrained, and you can't use your tentacles on another target."
