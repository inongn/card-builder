name: Wild Shape Templates
id: wildShapeTemplate
children:
  - type: Statblock
    name: Beast of Land
    tags: [wildShapeTemplate]
    id: wildShapeBeastOfLand
    size: Medium
    category: wildShape
    classification: Beast
    ac: $(10 + stats.wis.mod)
    movement:
      walk: 40
      climb: 40
    stats:
      str: $(stats.wis.score)
      dex: $(stats.wis.score)
      con: $(stats.con.score)
      int: $(stats.int.score)
      wis: $(stats.wis.score)
      cha: $(stats.cha.score)
    senses:
      darkvision: 60
    traits:
      - name: Keen Senses
        description: "The beast has advantage on Wisdom (Perception) checks."
    actions:
      - id: bestialStrike
        name: Bestial Strike
        mechanic:
          pattern: attack
          attack:
            classification: melee
            type: weapon
            bonus: "$(attributes.spellcasting.attack)"
          target:
            type: single
            range: reach 5 feet
          hit:
            - type: damage
              dice:
                count: 1
                sides: 8
                bonus: "$(stats.wis.mod)"
              damageType:
                - bludgeoning
                - piercing
                - slashing

  - type: Statblock
    name: Beast of the Sea
    tags: [wildShapeTemplate]
    id: wildShapeBeastOfTheSea
    size: Medium
    category: wildShape
    classification: Beast
    ac: $(10 + stats.wis.mod)
    movement:
      walk: 20
      swim: 40
    stats:
      str: $(stats.wis.score)
      dex: $(stats.wis.score)
      con: $(stats.con.score)
      int: $(stats.int.score)
      wis: $(stats.wis.score)
      cha: $(stats.cha.score)
    senses:
      blindsight: 30
      darkvision: 60
    traits:
      - name: Amphibious
        description: "The beast can breathe air and water."
    actions:
      - id: bestialStrike
        name: Bestial Strike
        mechanic:
          pattern: attack
          attack:
            classification: melee
            type: weapon
            bonus: "$(attributes.spellcasting.attack)"
          target:
            type: single
            range: reach 5 feet
          hit:
            - type: damage
              dice:
                count: 1
                sides: 6
                bonus: "$(stats.wis.mod)"
              damageType:
                - bludgeoning
                - slashing
                - piercing

  - type: Statblock
    name: Beast of the Sky
    tags: [wildShapeTemplate]
    id: wildShapeBeastOfTheSky
    size: Medium
    category: wildShape
    classification: Beast
    ac: $(8 + stats.wis.mod)
    movement:
      walk: 20
      fly: 50
    stats:
      str: $(stats.wis.score)
      dex: $(stats.wis.score)
      con: $(stats.con.score)
      int: $(stats.int.score)
      wis: $(stats.wis.score)
      cha: $(stats.cha.score)
    senses:
      darkvision: 120
    traits:
      - name: Flyby
        description: "The beast doesn't provoke Opportunity Attacks when it flies out of an enemy's reach."
    actions:
      - id: bestialStrike
        name: Bestial Strike
        mechanic:
          pattern: attack
          attack:
            classification: melee
            type: weapon
            bonus: "$(attributes.spellcasting.attack)"
          target:
            type: single
            range: reach 5 feet
          hit:
            - type: damage
              dice:
                count: 1
                sides: 4
                bonus: "$(stats.wis.mod)"
              damageType:
                - bludgeoning
                - piercing
                - slashing
