type: Statblock
name: Steel Defender
id: steelDefender
category: companion
classification: Construct
tags: [steelDefender]
size: Medium
ac: "$(12 + stats.int.mod)"
hp: "$(5 + 5 * meta.level)"
movement:
  walk: 40
stats:
  str: 14
  dex: 12
  con: 14
  int: 4
  wis: 10
  cha: 6
immunities: [Poison, Charmed, Exhaustion, Poisoned]
senses:
  darkvision: 60
challenge: 0
cr: 0
traits:
  - name: Steel Bond
    description: "Add $(attributes.prof) to any ability check or saving throw the Steel Defender makes."
actions:
  - id: forceEmpoweredRend
    name: Force-Empowered Rend
    tags: [strike]
    mechanic:
      pattern: attack
      attack:
        classification: melee
        bonus: $(attributes.spellcasting.attack)
      target:
        type: single
        range: reach 5 feet
      hit:
        type: damage
        dice:
          count: 1
          sides: 8
          bonus: $(2 + stats.int.mod)
        damageType: force
  - id: repair
    name: Repair
    limit: 3/Day
    mechanic:
      pattern: healing
      target:
        text: the defender, or one Construct or object it can see within 5 feet of it
      healing:
        dice:
          count: $(2 + stats.int.mod)
          sides: 8
        type: hitPoints
reactions:
  - id: deflectAttack
    name: Deflect Attack
    mechanic:
      pattern: automatic
      trigger:
        event: custom
        text: a creature the defender can see within 5 feet of it makes an attack roll targeting a different creature
      target:
        inherit: trigger
      payloads:
        type: rollModifier
        targetRolls: attack
        modifierType: disadvantage
