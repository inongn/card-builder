type: Statblock
name: "Undead Vestige"
tags: [vestigeCompanion]
id: undeadVestige
size: Small
category: companion
classification: Undead
ac: $(13 + stats.cha.mod)
hp: $(4 + 4 * meta.level)
movement:
  walk: 5
  fly: 30
stats:
  str: 1
  dex: 14
  con: 10
  int: 15
  wis: 15
  cha: 16
resistances: [Necrotic]
immunities: [Charmed, Frightened, Prone]
senses:
  darkvision: 60
languages: "Speaks the languages that you know"
traits:
  - name: Pact Bond
    description: "Add your Proficiency Bonus to any ability check or saving throw the vestige makes."
actions:
  - name: Vestige's Strike
    description: "_Melee or Ranged Attack Roll:_ $(formatBonus(attributes.spellcasting.attack)) to hit, reach 5 ft. or range 60 ft. _Hit:_ 1d6$(formatBonus(3 + stats.cha.mod)) Necrotic damage."
bonusActions:
  - name: Divine Power (1/Day)
    description: |
      **Cursed Invocation.** The vestige places a curse on a creature you can see within 30 feet of the vestige for 1 minute. While cursed, the target has Disadvantage on attack rolls against you and the vestige.
