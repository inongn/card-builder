type: Statblock
name: "Undead Vestige"
tags: [vestigeCompanion]
id: undeadVestige
size: Small
category: companion
classification: Undead
ac: $(13 + stats.cha.mod)
hp: $(4 + 4 * meta.level)
movement:
  walk: 5
  fly: 30
stats:
  str: 1
  dex: 14
  con: 10
  int: 15
  wis: 15
  cha: 16
resistances: [Necrotic]
immunities: [Charmed, Frightened, Prone]
senses:
  darkvision: 60
languages: "Speaks the languages that you know"
traits:
  - name: Pact Bond
    description: "Add your Proficiency Bonus to any ability check or saving throw the vestige makes."
actions:
  - id: vestigesStrike
    name: Vestige's Strike
    tags: [attack, strike]
    mechanic:
      pattern: attack
      attack:
        classification: melee_or_ranged
        bonus: $(attributes.spellcasting.attack)
      target:
        type: single
        range: reach 5 ft. or range 60 feet
      hit:
        type: damage
        dice:
          count: 1
          sides: 6
          bonus: $(3 + stats.cha.mod)
        damageType: necrotic
bonusActions:
  - id: divinePower
    name: Divine Power
    limit: 1/Day
    mechanic:
      pattern: automatic
      text: the vestige places a curse on a creature you can see within 30 feet of the vestige for 1 minute; while cursed, the target has Disadvantage on attack rolls against you and the vestige
