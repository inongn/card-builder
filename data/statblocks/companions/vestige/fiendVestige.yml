type: Statblock
name: "Fiend Vestige"
tags: [vestigeCompanion]
id: fiendVestige
size: Small
category: companion
classification: Fiend
ac: $(13 + stats.cha.mod)
hp: $(4 + 4 * meta.level)
movement:
  walk: 5
  fly: 30
stats:
  str: 1
  dex: 14
  con: 10
  int: 15
  wis: 15
  cha: 16
resistances: [Fire]
immunities: [Charmed, Frightened, Prone]
senses:
  darkvision: 60
languages: "Speaks the languages that you know"
traits:
  - name: Pact Bond
    description: "Add your Proficiency Bonus to any ability check or saving throw the vestige makes."
actions:
  - id: vestigesStrike
    name: Vestige's Strike
    tags: [attack, strike]
    mechanic:
      pattern: attack
      attack:
        classification: melee_or_ranged
        bonus: $(attributes.spellcasting.attack)
      target:
        type: single
        range: reach 5 ft. or range 60 feet
      hit:
        type: damage
        dice:
          count: 1
          sides: 6
          bonus: $(3 + stats.cha.mod)
        damageType: fire
bonusActions:
  - id: divinePower
    name: Divine Power
    limit: 1/Day
    mechanic:
      pattern: automatic
      text: if you and the vestige are within 60 feet of each other, you both teleport, swapping places