type: Statblock
name: Fey Steed
tags: [steed]
id: otherworldlySteedFey
size: Large
category: companion
classification: Fey
ac: "$(10 + (local.maxLevel || 2))"
hp: "$(5 + 10 * (local.maxLevel || 2))"
movement:
  walk: 60
  fly: "$( (local.maxLevel || 2) >= 4 ? 60 : 0 )"
stats:
  str: 18
  dex: 12
  con: 14
  int: 6
  wis: 12
  cha: 8
senses:
  passivePerception: 11
languages: Telepathy 1 mile (works only with you)
traits:
  - name: Life Bond
    description: When you regain Hit Points from a level 1+ spell, the steed regains the same number of Hit Points if you're within 30 feet of it.
actions:
  - id: otherworldlySlam
    name: Otherworldly Slam
    tags: [attack, strike]
    mechanic:
      pattern: attack
      attack:
        classification: melee
        bonus: $(attributes.spellcasting.attack)
      target:
        type: single
        range: reach 5 feet
      hit:
        type: damage
        dice:
          count: 1
          sides: 8
          bonus: $(local.maxLevel || 2)
        damageType: psychic
  - id: feyStep
    name: Fey Step
    recharge: after a Long Rest
    mechanic:
      pattern: automatic
      payloads:
        type: teleport
        distance: 60
        text: along with your rider, to an unoccupied space of your choice
