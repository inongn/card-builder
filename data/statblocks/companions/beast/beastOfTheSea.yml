type: Statblock
name: Beast of the Sea
tags: [primalCompanion]
id: beastOfTheSea
size: Medium
category: companion
classification: Beast
ac: $(13 + stats.wis.mod)
hp: $(5 + 5 * meta.level)
movement:
  walk: 5
  swim: 60
stats:
  str: 14
  dex: 14
  con: 15
  int: 8
  wis: 14
  cha: 11
senses:
  darkvision: 90
challenge: None
cr: 0
traits:
  - name: Amphibious
    description: "The beast can breathe air and water"
  - name: Primal Bond
    description: "Add $(attributes.prof) to any ability check or saving throw the beast makes."
actions:
  - id: beastsStrike
    name: Beast's Strike
    tags: [attack, strike]
    mechanic:
      pattern: attack
      attack:
        classification: melee
        bonus: $(attributes.spellcasting.attack)
      target:
        type: single
        range: reach 5 feet
      hit:
        - type: damage
          dice:
            count: 1
            sides: 6
            bonus: $(2 + stats.wis.mod)
          damageType:
            - bludgeoning
            - piercing
        - type: condition
          condition: grappled
          end: action_check
