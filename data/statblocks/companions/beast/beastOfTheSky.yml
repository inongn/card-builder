type: Statblock
name: Beast of the Sky
tags: [primalCompanion]
id: beastOfTheSky
size: Small
category: companion
classification: Beast
ac: $(13 + stats.wis.mod)
hp: $(4 + 4 * meta.level)
movement:
  walk: 10
  fly: 60
stats:
  str: 6
  dex: 16
  con: 13
  int: 8
  wis: 14
  cha: 11
senses:
  darkvision: 60
challenge: None
cr: 0
traits:
  - name: Flyby
    description: "The beast doesn't provoke Opportunity Attacks when it flies out of an enemy's reach."
  - name: Primal Bond
    description: "Add $(attributes.prof) to any ability check or saving throw the beast makes."
actions:
  - id: beastsStrike
    name: Beast's Strike
    tags: [attack, strike]
    mechanic:
      pattern: attack
      attack:
        classification: melee
        bonus: $(attributes.spellcasting.attack)
      target:
        type: single
        range: reach 5 feet
      hit:
        type: damage
        dice:
          count: 1
          sides: 4
          bonus: $(3 + stats.wis.mod)
        damageType: slashing
