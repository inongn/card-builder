type: Statblock
name: Astral Spirit (Ectoplasmic)
tags: [summon]
id: astralEntityEctoplasmic
size: Medium
category: summon
classification: Aberration
ac: "$(11 + (local.maxLevel || 3))"
hp: "$(40 + 10 * ((local.maxLevel || 3) - 3))"
movement:
  walk: 30
stats:
  str: 16
  dex: 12
  con: 11
  int: 16
  wis: 12
  cha: 10
immunities: [Psychic]
senses:
  darkvision: 60
languages: "Deep Speech, Telepathy 60 ft."
traits:
  - name: Incorporeal Passage
    description: "The spirit can move through other creatures and objects as if they were Difficult Terrain. If the spirit ends its turn in such a space, it is shunted to the nearest unoccupied space and takes 1d10 Force damage for every 5 feet traveled."
actions:
  - name: Multiattack
    description: "The spirit makes $(Math.floor((local.maxLevel || 3) / 2)) Ectoplasmic Splash attacks."
  - name: Ectoplasmic Splash
    description: "_Ranged Attack Roll:_ $(formatBonus(attributes.spellcasting.attack)) to hit, range 30 ft. _Hit:_ 1d6$(formatBonus(3 + (local.maxLevel || 3))) Psychic damage. _Hit or Miss:_ Each creature in a 5-foot Emanation originating from and including the target has its Speed reduced by 5 feet until the end of its next turn."
