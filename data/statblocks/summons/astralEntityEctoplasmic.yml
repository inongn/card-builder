type: Statblock
name: Psionic Spirit (Ectoplasmic Entity)
tags:
  - summon
id: astralEntityEctoplasmic
size: Medium
category: summon
classification: Aberration
ac: $(11 + (local.maxLevel || 3))
hp: $(40 + 10 * ((local.maxLevel || 3) - 3))
movement:
  walk: 30
stats:
  str: 16
  dex: 12
  con: 11
  int: 16
  wis: 12
  cha: 10
immunities:
  - Psychic
senses:
  darkvision: 60
languages: Deep Speech, Telepathy 60 ft.
traits:
  - name: Incorporeal Passage
    description: The spirit can move through other creatures and objects as if they were Difficult Terrain. If the spirit ends its turn in such a space, it is shunted to the nearest unoccupied space and takes 1d10 Force damage for every 5 feet traveled.
actions:
  - id: multiattack
    name: Multiattack
    mechanic:
      pattern: automatic
      target:
        type: self
      payloads:
        - type: action
          text: make $(Math.floor((local.maxLevel || 3) / 2)) Ectoplasmic Splash attacks
  - id: ectoplasmicSplash
    name: Ectoplasmic Splash
    tags:
      - strike
    mechanic:
      pattern: attack
      attack:
        classification: ranged
        type: spell
        bonus: $(attributes.spellcasting.attack)
      target:
        type: single
        range: range 30 feet
      hit:
        - type: damage
          dice:
            count: 1
            sides: 6
            bonus: $(3 + (local.maxLevel || 3))
          damageType: psychic
      hitOrMiss:
        - type: text
          text: each creature in a 5-foot Emanation originating from and including the target has its Speed reduced by 5 feet until the end of its next turn
