type: Statblock
name: Astral Spirit (Crystal)
tags: [summon]
id: astralEntityCrystal
size: Medium
category: summon
classification: Aberration
ac: "$(11 + (local.maxLevel || 3) + 2)"
hp: "$(40 + 10 * ((local.maxLevel || 3) - 3))"
movement:
  walk: 30
stats:
  str: 16
  dex: 12
  con: 11
  int: 16
  wis: 12
  cha: 10
immunities: [Psychic]
senses:
  darkvision: 60
languages: "Deep Speech, Telepathy 60 ft."
actions:
  - name: Multiattack
    description: "The spirit makes $(Math.floor((local.maxLevel || 3) / 2)) Crystal Strike attacks."
  - name: Crystal Strike
    description: "_Melee Attack Roll:_ $(formatBonus(attributes.spellcasting.attack)) to hit, reach 5 ft. _Hit:_ 1d10$(formatBonus(3 + (local.maxLevel || 3))) Piercing damage."
reactions:
  - name: Shard Swarm
    description: "_Trigger:_ The spirit is hit by a melee attack roll. _Response:_ The spirit halves the damage (round down) it takes from that attack. The spirit can then teleport to an unoccupied space it can see within 30 feet of itself."
