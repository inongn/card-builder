type: Statblock
name: Undead Spirit (Ghostly)
tags:
  - summon
id: undeadSpiritGhostly
size: Medium
category: summon
classification: Undead
ac: $(11 + (local.maxLevel || 3))
hp: $(30 + 10 * ((local.maxLevel || 3) - 3))
movement:
  walk: 30
  fly: 40
stats:
  str: 12
  dex: 16
  con: 15
  int: 4
  wis: 10
  cha: 9
immunities:
  - Necrotic
  - Poison
  - Exhaustion
  - Frightened
  - Paralyzed
  - Poisoned
senses:
  darkvision: 60
traits:
  - name: Incorporeal Passage
    description: The spirit can move through other creatures and objects as if they were Difficult Terrain. If it ends its turn inside an object, it is shunted to the nearest unoccupied space and takes 1d10 Force damage for every 5 feet traveled.
actions:
  - id: multiattack
    name: Multiattack
    mechanic:
      pattern: automatic
      target:
        type: self
      payloads:
        - type: action
          text: make $(Math.floor((local.maxLevel || 3) / 2)) Deathly Touch attacks
  - id: deathlyTouch
    name: Deathly Touch
    tags:
      - strike
    mechanic:
      pattern: attack
      attack:
        classification: melee
        type: spell
        bonus: $(attributes.spellcasting.attack)
      target:
        type: single
        range: reach 5 feet
      hit:
        - type: damage
          dice:
            count: 1
            sides: 8
            bonus: $(3 + (local.maxLevel || 3))
          damageType: necrotic
        - type: condition
          condition: frightened
          end: end_of_its_next_turn
