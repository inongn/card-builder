type: Statblock
name: Aberrant Spirit (Beholderkin)
tags:
  - summon
id: aberrantSpiritBeholderkin
size: Medium
category: summon
classification: Aberration
ac: $(11 + (local.maxLevel || 4))
hp: $(40 + 10 * ((local.maxLevel || 4) - 4))
movement:
  walk: 30
  fly: 30
stats:
  str: 16
  dex: 10
  con: 15
  int: 16
  wis: 10
  cha: 6
senses:
  darkvision: 60
actions:
  - id: multiattack
    name: Multiattack
    mechanic:
      pattern: automatic
      target:
        type: self
      payloads:
        - type: action
          text: make $(Math.floor((local.maxLevel || 4) / 2)) Eye Ray attacks
  - id: eyeRay
    name: Eye Ray
    tags:
      - strike
    mechanic:
      pattern: attack
      attack:
        classification: ranged
        type: spell
        bonus: $(attributes.spellcasting.attack)
      target:
        type: single
        range: range 150 feet
      hit:
        - type: damage
          dice:
            count: 1
            sides: 8
            bonus: $(3 + (local.maxLevel || 4))
          damageType: psychic
