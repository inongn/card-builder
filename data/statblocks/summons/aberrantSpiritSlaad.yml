type: Statblock
name: Aberrant Spirit (Slaad)
tags:
  - summon
id: aberrantSpiritSlaad
size: Medium
category: summon
classification: Aberration
ac: $(11 + (local.maxLevel || 4))
hp: $(40 + 10 * ((local.maxLevel || 4) - 4))
movement:
  walk: 30
stats:
  str: 16
  dex: 10
  con: 15
  int: 16
  wis: 10
  cha: 6
senses:
  darkvision: 60
traits:
  - name: Regeneration
    description: The spirit regains 5 Hit Points at the start of its turn if it has at least 1 Hit Point.
actions:
  - id: multiattack
    name: Multiattack
    mechanic:
      pattern: automatic
      target:
        type: self
      payloads:
        - type: action
          text: make $(Math.floor((local.maxLevel || 4) / 2)) Claw attacks
  - id: claw
    name: Claw
    tags:
      - strike
    mechanic:
      pattern: attack
      attack:
        classification: melee
        type: weapon
        bonus: $(attributes.spellcasting.attack)
      target:
        type: single
        range: reach 5 feet
      hit:
        - type: damage
          dice:
            count: 1
            sides: 10
            bonus: $(3 + (local.maxLevel || 4))
          damageType: slashing
        - type: text
          text: the target can't regain Hit Points until the start of the spirit's next turn
