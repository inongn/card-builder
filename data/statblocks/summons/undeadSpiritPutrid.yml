type: Statblock
name: Undead Spirit (Putrid)
tags:
  - summon
id: undeadSpiritPutrid
size: Medium
category: summon
classification: Undead
ac: $(11 + (local.maxLevel || 3))
hp: $(30 + 10 * ((local.maxLevel || 3) - 3))
movement:
  walk: 30
stats:
  str: 12
  dex: 16
  con: 15
  int: 4
  wis: 10
  cha: 9
immunities:
  - Necrotic
  - Poison
  - Exhaustion
  - Frightened
  - Paralyzed
  - Poisoned
senses:
  darkvision: 60
traits:
  - name: Festering Aura
    description: _Constitution Saving Throw:_ DC $(attributes.spellcasting.save), any creature (other than you) that starts its turn within a 5-foot Emanation originating from the spirit. _Failure:_ The creature has the Poisoned condition until the start of its next turn.
actions:
  - id: multiattack
    name: Multiattack
    mechanic:
      pattern: automatic
      target:
        type: self
      payloads:
        - type: action
          text: make $(Math.floor((local.maxLevel || 3) / 2)) Rotting Claw attacks
  - id: rottingClaw
    name: Rotting Claw
    tags:
      - strike
    mechanic:
      pattern: attack
      attack:
        classification: melee
        type: weapon
        bonus: $(attributes.spellcasting.attack)
      target:
        type: single
        range: reach 5 feet
      hit:
        - type: damage
          dice:
            count: 1
            sides: 6
            bonus: $(3 + (local.maxLevel || 3))
          damageType: slashing
        - type: text
          text: if the target has the Poisoned condition, it has the Paralyzed condition until the end of its next turn
