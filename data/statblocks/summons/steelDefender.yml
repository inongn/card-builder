type: Statblock
name: Steel Defender
id: steelDefender
category: companion
classification: Construct
tags: [steelDefender]
size: Medium
ac: "$(12 + stats.int.mod)"
hp: "$(5 + 5 * meta.level)"
movement:
  walk: 40
stats:
  str: 14
  dex: 12
  con: 14
  int: 4
  wis: 10
  cha: 6
immunities: [Poison, Charmed, Exhaustion, Poisoned]
senses:
  darkvision: 60
challenge: 0
cr: 0
traits:
  - name: Steel Bond
    description: "Add $(attributes.prof) to any ability check or saving throw the Steel Defender makes."
actions:
  - name: Force-Empowered Rend
    id: forceEmpoweredRend
    description: "_Melee Attack Roll:_ $(formatBonus(attributes.spellcasting.attack)) to hit, reach 5 ft. _Hit:_ 1d8 + $(2 + stats.int.mod) Force damage."
  - name: Repair (3/Day)
    id: repair
    description: "The defender, or one Construct or object it can see within 5 feet of it, regains $(2 + stats.int.mod)d8 Hit Points."
reactions:
  - name: Deflect Attack
    id: deflectAttack
    description: "_Trigger:_ A creature the defender can see within 5 feet of it makes an attack roll targeting a different creature. _Response:_ The triggering creature makes the attack roll with Disadvantage."
