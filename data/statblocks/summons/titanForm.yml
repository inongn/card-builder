name: Titan Form Templates
id: titanForm
children:
  - type: Statblock
    name: Behemoth
    tags: [titanFormTemplate]
    id: behemothTitanForm
    size: Large
    category: summon
    classification: Monstrosity
    ac: $(13 + stats.wis.mod)
    hp: $(4 * meta.level)
    movement:
      walk: 40
      climb: 40
    stats:
      str: $(stats.wis.score)
      dex: $(stats.wis.score)
      con: $(stats.con.score)
      int: $(stats.int.score)
      wis: $(stats.wis.score)
      cha: $(stats.cha.score)
    senses:
      darkvision: 60
    traits:
      - name: Siege Monster
        description: "You deal double damage to objects and structures."
    actions:
      - name: Rend
        description: "_Melee Attack Roll:_ $(formatBonus(attributes.spellcasting.attack)) to hit, reach 10 ft. _Hit:_ $(meta.level >= 12 ? 3 : meta.level >= 6 ? 2 : 1)d8$(formatBonus(stats.wis.mod)) Slashing damage."
      - name: Incandescent Breath
        description: "You expend a level 1+ spell slot. DC $(attributes.spellcasting.save) Dexterity saving throw for each creature in a 5-foot-wide, 60-foot-long Line. Failure: 2d10 Radiant damage per level of the spell slot expended. Success: Half damage."

  - type: Statblock
    name: Leviathan
    tags: [titanFormTemplate]
    id: leviathanTitanForm
    size: Large
    category: summon
    classification: Monstrosity
    ac: $(13 + stats.wis.mod)
    hp: $(4 * meta.level)
    movement:
      walk: 40
      swim: 40
    stats:
      str: $(stats.wis.score)
      dex: $(stats.wis.score)
      con: $(stats.con.score)
      int: $(stats.int.score)
      wis: $(stats.wis.score)
      cha: $(stats.cha.score)
    senses:
      darkvision: 60
    traits:
      - name: Amphibious
        description: "You can breathe air and water."
      - name: Siege Monster
        description: "You deal double damage to objects and structures."
    actions:
      - name: Rend
        description: "_Melee Attack Roll:_ $(formatBonus(attributes.spellcasting.attack)) to hit, reach 10 ft. _Hit:_ $(meta.level >= 12 ? 3 : meta.level >= 6 ? 2 : 1)d8$(formatBonus(stats.wis.mod)) Bludgeoning damage."

  - type: Statblock
    name: Insectoid
    tags: [titanFormTemplate]
    id: insectoidTitanForm
    size: Large
    category: summon
    classification: Monstrosity
    ac: $(13 + stats.wis.mod)
    hp: $(4 * meta.level)
    movement:
      walk: 40
      fly: "$(meta.level >= 10 ? 40 : 0)"
    stats:
      str: $(stats.wis.score)
      dex: $(stats.wis.score)
      con: $(stats.con.score)
      int: $(stats.int.score)
      wis: $(stats.wis.score)
      cha: $(stats.cha.score)
    senses:
      darkvision: 60
    traits:
      - name: Siege Monster
        description: "You deal double damage to objects and structures."
      - name: Flyby (Requires Druid Level 10+)
        description: "You don't provoke Opportunity Attacks when you fly out of an enemy's reach."
    actions:
      - name: Rend
        description: "_Melee Attack Roll:_ $(formatBonus(attributes.spellcasting.attack)) to hit, reach 10 ft. _Hit:_ $(meta.level >= 12 ? 3 : meta.level >= 6 ? 2 : 1)d8$(formatBonus(stats.wis.mod)) Piercing damage."
      - name: Energizing Pollen
        description: "You expend a level 1+ spell slot and can move up to $(attributes.movement.walk/2) feet without provoking Opportunity Attacks while emitting a cloud of healing pollen. When you move within 5 feet of another creature during this movement, you can restore a number of Hit Points equal to 2d6 per level of the spell slot expended (once per turn per creature)."
