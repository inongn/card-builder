type: Statblock
name: Bestial Spirit (Water)
tags:
  - summon
id: bestialSpiritWater
size: Medium
category: summon
classification: Beast
ac: $(11 + (local.maxLevel || 2))
hp: $(20 + 10 * ((local.maxLevel || 2) - 2))
movement:
  walk: 30
  swim: 30
stats:
  str: 18
  dex: 11
  con: 16
  int: 4
  wis: 14
  cha: 5
senses:
  darkvision: 60
traits:
  - name: Pack Tactics
    description: The spirit has Advantage on Wisdom (Perception) checks that rely on smell when it is within 30 feet of another creature that it can see.
  - name: Water Breathing
    description: The spirit can breathe only underwater.
actions:
  - id: multiattack
    name: Multiattack
    mechanic:
      pattern: automatic
      target:
        type: self
      payloads:
        - type: action
          text: make $(Math.floor((local.maxLevel || 2) / 2)) Rend attacks
  - id: rend
    name: Rend
    tags:
      - strike
    mechanic:
      pattern: attack
      attack:
        classification: melee
        type: weapon
        bonus: $(attributes.spellcasting.attack)
      target:
        type: single
        range: reach 5 feet
      hit:
        - type: damage
          dice:
            count: 1
            sides: 8
            bonus: $(4 + (local.maxLevel || 2))
          damageType: piercing
