type: Statblock
name: Elemental Spirit (Water)
tags:
  - summon
id: elementalSpiritWater
size: Medium
category: summon
classification: Elemental
ac: $(11 + (local.maxLevel || 4))
hp: $(50 + 10 * ((local.maxLevel || 4) - 4))
movement:
  walk: 40
  swim: 40
stats:
  str: 18
  dex: 15
  con: 17
  int: 4
  wis: 10
  cha: 16
resistances:
  - Acid
immunities:
  - Poison
  - Exhaustion
  - Paralyzed
  - Petrified
  - Poisoned
senses:
  darkvision: 60
traits:
  - name: Amorphous Form
    description: The spirit can move through a space as narrow as 1 inch wide without it counting as Difficult Terrain.
actions:
  - id: multiattack
    name: Multiattack
    mechanic:
      pattern: automatic
      target:
        type: self
      payloads:
        - type: action
          text: make $(Math.floor((local.maxLevel || 4) / 2)) Slam attacks
  - id: slam
    name: Slam
    tags:
      - strike
    mechanic:
      pattern: attack
      attack:
        classification: melee
        type: weapon
        bonus: $(attributes.spellcasting.attack)
      target:
        type: single
        range: reach 5 feet
      hit:
        - type: damage
          dice:
            count: 1
            sides: 10
            bonus: $(4 + (local.maxLevel || 4))
          damageType: cold
