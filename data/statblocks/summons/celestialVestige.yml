type: Statblock
name: "Celestial Vestige"
tags: [vestigeCompanion]
id: celestialVestige
size: Small
category: summon
classification: Celestial
ac: $(13 + stats.cha.mod)
hp: $(4 + 4 * meta.level)
movement:
  walk: 5
  fly: 30
stats:
  str: 1
  dex: 14
  con: 10
  int: 15
  wis: 15
  cha: 16
resistances: [Radiant]
immunities: [Charmed, Frightened, Prone]
senses:
  darkvision: 60
languages: "Speaks the languages that you know"
traits:
  - name: Pact Bond
    description: "Add your Proficiency Bonus to any ability check or saving throw the vestige makes."
actions:
  - name: Vestige's Strike
    description: "_Melee or Ranged Attack Roll:_ $(formatBonus(attributes.spellcasting.attack)) to hit, reach 5 ft. or range 60 ft. _Hit:_ 1d6+3$(formatBonus(stats.cha.mod)) Radiant damage."
bonusActions:
  - name: Divine Power (1/Day)
    description: |
      **Healing Touch.** The vestige touches another creature. The target regains Hit Points equal to 2d8 plus your Charisma modifier and ends one condition on it: Blinded, Deafened, or Poisoned.