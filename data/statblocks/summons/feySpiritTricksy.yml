type: Statblock
name: Fey Spirit (Tricksy)
tags:
  - summon
id: feySpiritTricksy
size: Small
category: summon
classification: Fey
ac: $(12 + (local.maxLevel || 3))
hp: $(30 + 10 * ((local.maxLevel || 3) - 3))
movement:
  walk: 30
  fly: 30
stats:
  str: 13
  dex: 16
  con: 14
  int: 14
  wis: 11
  cha: 16
immunities:
  - Charmed
senses:
  darkvision: 60
actions:
  - id: multiattack
    name: Multiattack
    mechanic:
      pattern: automatic
      target:
        type: self
      payloads:
        - type: action
          text: make $(Math.floor((local.maxLevel || 3) / 2)) Fey Blade attacks
  - id: feyBlade
    name: Fey Blade
    tags:
      - strike
    mechanic:
      pattern: attack
      attack:
        classification: melee
        type: weapon
        bonus: $(attributes.spellcasting.attack)
      target:
        type: single
        range: reach 5 feet
      hit:
        - type: damage
          dice:
            count: 2
            sides: 6
            bonus: $(3 + (local.maxLevel || 3))
          damageType: force
bonusActions:
  - id: feyStep
    name: Fey Step
    mechanic:
      mode: succession
      blocks:
        - pattern: automatic
          target:
            type: self
          payloads:
            - type: teleport
              distance: 30
        - pattern: aura
          target:
            type: area
            range: 5 feet
            aoe:
              shape: cube
              size: 10
          obscured: true
          text: magical darkness
