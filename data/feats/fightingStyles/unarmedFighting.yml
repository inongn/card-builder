tags:
  - fightingStyle
type: Folder
summary: Enhance unarmed strike damage and deal extra damage to grappled targets.
children:
  - type: Reference
    target:
      - unarmed
  - type: Activity
    range: self
    time: free action
    duration: instantaneous
    target: unarmed
    name: Unarmed Fighting
    description: At the start of each of your turns, you can deal 1d4 Bludgeoning damage to one creature grappled by you.
    id: unarmedFightingUnarmedFighting
  - type: Effect
    target: activities[tags=unarmed].mechanic.hit.dice
    operation: set
    value:
      count: 1
      sides: '$(attributes.shieldEquipped == true ? 6 : 8)'
      bonus: $(attributes.melee.bonus)
id: unarmedFighting
name: Unarmed Fighting
