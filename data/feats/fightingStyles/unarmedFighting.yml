tags:
- fightingStyle
type: Folder
summary: "Enhance unarmed strike damage and deal extra damage to grappled targets."
children:
- type: Extra
  target: unarmed
  name: Unarmed Fighting
  description: At the start of each of your turns, you can deal 1d4 Bludgeoning damage
    to one creature grappled by you.
- type: Effect
  target: activities[tags=unarmed].description["$(Math.max(1, 1+attributes.melee.bonus))"]
  operation: replace
  value: "1d$(attributes.shieldEquipped == true ? '6' : '8')$(formatBonus(attributes.melee.bonus))"
id: unarmedFighting
name: Unarmed Fighting
