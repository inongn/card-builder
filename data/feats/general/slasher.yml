id: slasher
summary: Slashing strikes slow enemies and weaken their retaliatory attacks.
name: Slasher
tags:
  - feat
  - generalFeat
type: Folder
children:
  - name: Ability Score Increase
    type: Effect
    target: attributes.asiPoolLimit
    operation: add
    value: 1
  - id: slasherHamstring
    name: Hamstring
    type: Effect
    target: activities[tags=weaponAttack AND tags=slashingDamage].mechanic.hit
    operation: push
    value:
      type: statModifier
      stat: speed
      value: -10
      operation: add
  - id: slasherEnhancedCritical
    name: Enhanced Critical
    type: Effect
    target: activities[tags=weaponAttack AND tags=slashingDamage].mechanic.crit
    operation: push
    value:
      type: rollModifier
      modifierType: disadvantage
      targetRolls: attack
