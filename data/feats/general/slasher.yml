id: slasher
summary: Slashing strikes slow enemies and weaken their retaliatory attacks.
name: Slasher
tags:
  - feat
  - generalFeat
type: Folder
children:
  - name: Ability Score Increase
    type: Effect
    target: attributes.asiPoolLimit
    operation: add
    value: 1
  - id: slasherHamstring
    name: Hamstring
    type: Extra
    target: weaponAttack AND slashingDamage
    description: On a hit, the target's Speed is reduced by 10 feet until the start of your next turn.
  - id: slasherEnhancedCritical
    name: Enhanced Critical
    type: Extra
    target: weaponAttack AND slashingDamage
    description: On a Critical Hit, the target has Disadvantage on all attack rolls until the start of the next turn.
