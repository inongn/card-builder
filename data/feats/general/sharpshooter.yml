id: sharpshooter
summary: Master long-range marksmanship to bypass cover and strike distant targets.
name: Sharpshooter
tags:
  - feat
  - generalFeat
type: Folder
children:
  - name: Ability Score Increase
    type: Effect
    target: attributes.asiPoolLimit
    operation: add
    value: 1
  - name: Bypass Cover
    type: Trait
    description: Your attacks ignore Half Cover and Three-Quarters Cover.
    id: sharpshooterBypassCover
  - name: Firing in Melee
    type: Trait
    description: Being within 5 feet of an enemy doesn't impose Disadvantage on your attacks.
    id: sharpshooterFiringInMelee
  - name: Precision Shot
    type: Effect
    target: activities[tags=weaponAttack and tags=ranged].mechanic.hit.dice.bonus
    operation: add
    value: $(attributes.prof)
    id: sharpshooterPrecisionShot
