id: sharpshooter
summary: Master long-range marksmanship to bypass cover and strike distant targets.
name: Sharpshooter
tags:
  - feat
  - generalFeat
type: Folder
children:
  - name: Ability Score Increase
    type: Effect
    target: attributes.asiPoolLimit
    operation: add
    value: 1
  - name: Bypass Cover
    type: Extra
    target: weaponAttack and ranged
    description: This attack ignores Half Cover and Three-Quarters Cover.
    id: sharpshooterBypassCover
  - name: Firing in Melee
    type: Extra
    target: weaponAttack and ranged
    description: Being within 5 feet of an enemy doesn't impose Disadvantage on this attack.
    id: sharpshooterFiringInMelee
  - name: Precision Shot
    type: Effect
    target: activities[tags=weaponAttack and tags=ranged].mechanic.damage.dice.bonus
    operation: add
    value: $(attributes.prof)
    id: sharpshooterPrecisionShot
