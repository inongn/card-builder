id: durable
summary: Gain rapid recovery and bonus healing when expending hit dice.
name: Durable
tags:
  - feat
  - generalFeat
type: Folder
children:
  - name: Ability Score Increase
    type: Effect
    target: attributes.asiPoolLimit
    operation: add
    value: 1
  - name: Defy Death
    type: Reference
    target: deathSaveAdvantage
  - name: Speedy Recovery
    type: Activity
    duration: instantaneous
    range: self
    resource: hitDice
    time: bonus action
    description: You can expend one of your Hit Dice, roll the die, and regain a number of Hit Points equal to the roll.
    mechanic:
      pattern: healing
      target:
        type: self
      healing:
        dice:
          count: 1
          sides: 8
          bonus: $(stats.con.mod)
        type: hitPoints
        text: expend one Hit Die, roll it, and regain Hit Points equal to the roll
    id: durableSpeedyRecovery
