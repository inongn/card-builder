id: mageSlayer
summary: Punish spellcasters in close proximity and disrupt their concentration.
name: Mage Slayer
tags:
  - feat
  - generalFeat
type: Folder
children:
  - name: Ability Score Increase
    type: Effect
    target: attributes.asiPoolLimit
    operation: add
    value: 1
  - name: Concentration Breaker
    type: Trait
    description: On a hit, the target has Disadvantage on any saving throw it makes to maintain Concentration.
    id: mageSlayerConcentrationBreaker
  - name: Guarded Mind
    type: Activity
    time: free action
    duration: instantaneous
    range: self
    resource: limited
    description: If you fail an Intelligence, a Wisdom, or a Charisma saving throw, you can cause yourself to succeed instead.
    id: mageSlayerGuardedMind
