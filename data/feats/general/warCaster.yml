id: warCaster
summary: Maintain spell concentration effortlessly and cast spells as opportunity attacks.
name: War Caster
tags:
  - feat
  - generalFeat
type: Folder
children:
  - name: Ability Score Increase
    type: Effect
    target: attributes.asiPoolLimit
    operation: add
    value: 1
  - name: Concentration
    type: Reference
    target: concentrationAdvantage
  - id: warCasterReactiveSpell
    name: Reactive Spell
    type: Effect
    target: activities[id=opportunityAttack].mechanic.payloads
    operation: set
    value:
      type: text
      text: "cast a spell with a casting time of 1 action that targets only the triggering creature"
