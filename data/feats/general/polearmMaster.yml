id: polearmMaster
summary: Make bonus reach strikes and opportunity attacks when foes enter reach.
name: Polearm Master
tags:
  - feat
  - generalFeat
type: Folder
children:
  - name: Ability Score Increase
    type: Effect
    target: attributes.asiPoolLimit
    operation: add
    value: 1
  - id: polearmMasterReactiveStrike
    name: Reactive Strike
    type: Effect
    target: activities[id=opportunityAttack].mechanic.trigger
    operation: merge
    value:
      event: move_within_range
  - id: poleStrike
    name: Pole Strike
    type: Activity
    time: bonus action
    range: self
    duration: instantaneous
    description: You make a $(formatBonus(attributes.melee.bonus)) attack with the opposite end of a polearm weapon. On a hit, deal 1d4$(formatBonus(attributes.melee.bonus)) Bludgeoning damage.
    mechanic:
      pattern: attack
      attack:
        classification: melee
        type: weapon
        bonus: $(attributes.melee.bonus)
      target:
        type: single
        range: reach 5 feet
      hit:
        type: damage
        dice:
          count: 1
          sides: 4
          bonus: $(attributes.melee.bonus)
        damageType: bludgeoning
