id: polearmMaster
summary: Make bonus reach strikes and opportunity attacks when foes enter reach.
name: Polearm Master
tags:
  - feat
  - generalFeat
type: Folder
children:
  - name: Ability Score Increase
    type: Effect
    target: attributes.asiPoolLimit
    operation: add
    value: 1
  - name: Reactive Strike
    type: Extra
    target: opportunityAttack
    description: You can make an Opportunity Attack when a creature enters your reach.
    id: polearmMasterReactiveStrike
  - id: poleStrike
    name: Pole Strike
    type: Activity
    time: bonus action
    range: self
    duration: instantaneous
    description: You make a $(formatBonus(attributes.melee.bonus)) attack with the opposite end of a polearm weapon. On a hit, deal 1d4$(formatBonus(attributes.melee.bonus)) Bludgeoning damage.
    mechanic:
      pattern: attack
      attack:
        classification: melee
        type: weapon
        bonus: $(attributes.melee.attack)
      damage:
        dice:
          count: 1
          sides: 4
          bonus: $(attributes.melee.bonus)
        type: bludgeoning
      target:
        type: single
        range: 10 feet
