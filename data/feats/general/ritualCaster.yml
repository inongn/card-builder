id: ritualCaster
summary: Learn and cast utility ritual spells from a ritual book.
name: Ritual Caster
tags:
  - feat
  - generalFeat
type: Folder
children:
  - name: Ability Score Increase
    type: Effect
    target: attributes.asiPoolLimit
    operation: add
    value: 1
  - name: Ritual Caster Spells
    type: Slot
    target: level1Spell and ritual
    id: ritualCasterSpells
    quantity: $(attributes.prof)
  - type: Reference
    target:
      - ritualCasterQuickRitual
