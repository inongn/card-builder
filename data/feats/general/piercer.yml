id: piercer
summary: Reroll piercing damage dice and deal lethal critical piercing damage.
name: Piercer
tags:
  - feat
  - generalFeat
type: Folder
children:
  - name: Ability Score Increase
    type: Effect
    target: attributes.asiPoolLimit
    operation: add
    value: 1
  - id: piercerPuncture
    name: Puncture
    type: Effect
    target: activities[tags=weaponAttack AND tags=piercingDamage].mechanic.hit
    operation: push
    value:
      type: text
      text: you can reroll one of the damage dice
  - id: piercerEnhancedCritical
    name: Enhanced Critical
    type: Effect
    target: activities[tags=weaponAttack AND tags=piercingDamage].mechanic.crit
    operation: push
    value:
      type: damage
      dice:
        count: 1
        sides: $(local.damageDiceSides || 6)
