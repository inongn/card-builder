id: spellSniper
summary: Double spell range, ignore cover, and learn a offensive cantrip.
name: Spell Sniper
tags:
  - feat
  - generalFeat
type: Folder
children:
  - name: Ability Score Increase
    type: Effect
    target: attributes.asiPoolLimit
    operation: add
    value: 1
  - name: Bypass Cover
    type: Trait
    description: Your spell attacks ignore Half Cover and Three-Quarters Cover.
    id: spellSniperBypassCover
  - name: Casting in Melee
    type: Trait
    description: Being within 5 feet of an enemy doesn't impose Disadvantage on your spell attack rolls.
    id: spellSniperCastingInMelee
  - name: Increased Range
    type: Effect
    target: activities[tags=attackSpell].range
    operation: add
    value: 60
