id: sentinel
summary: Halt moving foes in their tracks and punish enemies that attack allies.
name: Sentinel
tags:
  - feat
  - generalFeat
type: Folder
children:
  - name: Ability Score Increase
    type: Effect
    target: attributes.asiPoolLimit
    operation: add
    value: 1
  - id: sentinelHalt
    name: Halt
    type: Effect
    target: activities[id=opportunityAttack].mechanic.hit.payloads
    operation: push
    value:
      type: statModifier
      stat: speed
      operation: set
      value: 0
      text: "target's Speed becomes 0 for the rest of the current turn"
  - id: sentinelGuardian
    name: Guardian
    type: Effect
    target: activities[id=opportunityAttack].mechanic.trigger
    operation: merge
    value:
      text: when a creature takes the Disengage action or hits a target other than you with an attack
