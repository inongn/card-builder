id: sentinel
summary: Halt moving foes in their tracks and punish enemies that attack allies.
name: Sentinel
tags:
  - feat
  - generalFeat
type: Folder
children:
  - name: Ability Score Increase
    type: Effect
    target: attributes.asiPoolLimit
    operation: add
    value: 1
  - id: sentinelHalt
    name: Halt
    type: Effect
    target: activities[id=opportunityAttack].mechanic
    operation: push
    value:
      pattern: automatic
      target:
        inherit: trigger
      payloads:
        - type: statModifier
          stat: speed
          operation: set
          value: 0
  - id: sentinelGuardian
    name: Guardian
    type: Effect
    target: activities[id=opportunityAttack].mechanic.trigger
    operation: set
    value:
      text: When a creature leaves your reach, takes the Disengage action or hits a target other than you with an attack
