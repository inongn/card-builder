id: mediumArmorMaster
summary: "Move stealthily in medium armor and maximize Dexterity defense benefits."
name: Medium Armor Master
tags:
  - feat
  - generalFeat
prerequisite: Medium Armor Training
prerequisiteCondition: $(attributes.proficiencies.mediumArmor)
type: Folder
children:
  - name: Ability Score Increase
    type: Effect
    target: attributes.asiPoolLimit
    operation: add
    value: 1
  - name: Dexterous Wearer
    type: Effect
    target: attributes.ac
    operation: add
    value: 1
    condition: "stats.dex.mod >= 3"