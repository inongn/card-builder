id: greatWeaponMaster
summary: Unleash heavy power attacks and gain bonus strikes on critical hits.
name: Great Weapon Master
tags:
  - feat
  - generalFeat
type: Folder
children:
  - name: Ability Score Increase
    type: Effect
    target: attributes.asiPoolLimit
    operation: add
    value: 1
  - name: Heavy Weapon Mastery
    type: Effect
    target: activities[tags=weaponAttack and tags=heavy].mechanic.damage.dice.bonus
    operation: add
    value: $(attributes.prof)
  - id: hew
    name: Hew
    type: Activity
    time: bonus action
    range: self
    description: Immediately after you score a Critical Hit with a Melee weapon or reduce a creature to 0 Hit Points with one, you can make one attack with the same weapon.
    duration: instantaneous
    mechanic:
      pattern: automatic
      target:
        type: self
      trigger:
        event:
          - land_crit
          - drop_enemy_zero
        attackFilter:
          classification: melee
          type: weapon
      payloads:
        type: action
        actionType: attack
        count: 1