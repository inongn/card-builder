id: greatWeaponMaster
summary: Unleash heavy power attacks and gain bonus strikes on critical hits.
name: Great Weapon Master
tags:
  - feat
  - generalFeat
type: Folder
children:
  - name: Ability Score Increase
    type: Effect
    target: attributes.asiPoolLimit
    operation: add
    value: 1
  - name: Heavy Weapon Mastery
    type: Effect
    target: activities[tags=weaponAttack and tags=melee and tags=twoHanded].description["$(formatBonus(attributes.melee.bonus))"]
    operation: replace
    value: $(formatBonus(attributes.melee.bonus+attributes.prof))
  - type: Reference
    target:
      - hew
