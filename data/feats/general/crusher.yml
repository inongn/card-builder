id: crusher
summary: Bludgeoning strikes knock targets back and empower critical hits.
name: Crusher
tags:
  - feat
  - generalFeat
type: Folder
children:
  - name: Ability Score Increase
    type: Effect
    target: attributes.asiPoolLimit
    operation: add
    value: 1
  - id: crusherPush
    name: Push
    type: Effect
    target: activities[tags=weaponAttack AND tags=bludgeoningDamage].mechanic.hit
    operation: push
    value:
      type: movement
      movementType: forced
      direction: push
      distance: 5
  - id: crusherEnhancedCritical
    name: Enhanced Critical
    type: Effect
    target: activities[tags=weaponAttack AND tags=bludgeoningDamage].mechanic.crit
    operation: push
    value:
      type: rollModifier
      modifierType: attacksAgainstAdvantage
      targetRolls: attack
