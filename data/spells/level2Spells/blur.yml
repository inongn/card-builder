id: blur
type: Activity
name: Blur
resource: level2SpellSlot
tags:
  - level2Spell
  - illusion
  - artificer
  - sorcerer
  - wizard
time: action
range: self
duration: concentration, up to 1 minute
summary: Your body becomes blurred, imposing disadvantage on attack rolls against you.
description: |
  Your body becomes blurred. For the duration, any creature has Disadvantage on attack rolls against you. An attacker is immune to this effect if it perceives you with Blindsight or Truesight.
mechanic:
  pattern: automatic
  target:
    type: self
    range: $(range)
  payloads:
    type: rollModifier
    modifierType: attacksAgainstDisadvantage
    targetRolls: attack
