id: blindnessdeafness
type: Activity
name: Blindness/Deafness
resource: level2SpellSlot
tags:
  - level2Spell
  - transmutation
  - bard
  - cleric
  - sorcerer
  - wizard
  - saveSpell
  - psion
time: action
range: 120 feet
duration: 1 minute
summary: You blind or deafen a target with a dark curse.
description: |
  One creature that you can see within range must succeed on a DC $(attributes.spellcasting.save) Constitution saving throw, or it has the Blinded or Deafened condition (your choice) for the duration. At the end of each of its turns, the target repeats the save, ending the spell on itself on a success.
extra:
  - name: Using a Higher-Level Spell Slot
    description: You can target one additional creature for each spell slot level above 2.
mechanic:
  pattern: save
  save:
    ability: con
    dc: $(attributes.spellcasting.save)
  target:
    type: single
    range: $(range)
  failure:
    - type: condition
      condition:
        - blinded
        - deafened
      end: turn_repeat_save
    - type: text
      text: the target repeats the save at the end of each of its turns
  upcast:
    resourceStep: 1
    modifications:
      - path: target.count
        add: 1
