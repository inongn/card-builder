id: egoWhip
type: Activity
name: Ego Whip
resource: level2SpellSlot
tags:
  - level2Spell
  - enchantment
  - psion
  - saveSpell
time: reaction
range: 120 feet
duration: instantaneous
summary: You lash a creature's mind as a reaction when it makes a Charisma check or save.
description: |
  Reaction, which you take when a creature you can see within 30 feet of yourself makes a Charisma-based ability check or saving throw.

  The creature makes a DC $(attributes.spellcasting.save) Charisma saving throw. On a failed save, the target must subtract 1d8 from the ability check or saving throw.
mechanic:
  pattern: save
  trigger:
    text: When a creature you can see within 30 feet of yourself makes a Charisma-based ability check or saving throw
  save:
    ability: int
    dc: $(attributes.spellcasting.save)
  target:
    type: single
    range: $(range)
  failure:
    - type: damage
      dice:
        count: 3
        sides: 8
      damageType: psychic
    - type: text
      text: the target can't make Opportunity Attacks until the end of its next turn, and on its next turn it gets only a move, action, or Bonus Action
  success:
    halfDamage: true
  upcast:
    resourceStep: 1
    modifications:
      - path: failure[0].dice.count
        add: 1
