id: passWithoutTrace
type: Activity
name: Pass without Trace
resource: level2SpellSlot
tags:
  - level2Spell
  - abjuration
  - druid
  - ranger
time: action
range: self
duration: concentration, up to 1 hour
summary: A veil of shadows and silence grants +10 to Stealth checks for your party.
description: |
  You radiate a concealing aura in a 30-foot Emanation for the duration. While in the aura, you and each creature you choose have a +10 bonus to Dexterity (Stealth) checks and leave no tracks.
mechanic:
  mode: succession
  blocks:
    - pattern: aura
      target:
        type: area
        aoe:
          shape: emanation
          size: 30
        range: $(range)
      text: shadows and silence
    - pattern: automatic
      trigger:
        text: while in the aura
      target:
        inherit: prev_step
      payloads:
        - type: text
          text: you and each creature you choose gain a +10 bonus to Dexterity (Stealth) checks and leave no tracks
