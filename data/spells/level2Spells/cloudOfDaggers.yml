id: cloudOfDaggers
type: Activity
name: Cloud Of Daggers
resource: level2SpellSlot
tags:
  - level2Spell
  - conjuration
  - bard
  - sorcerer
  - warlock
  - wizard
time: action
range: 60 feet
duration: concentration, up to 1 minute
summary: You conjure a swirling cloud of razor-sharp daggers in an area.
description: |
  You conjure spinning daggers in a 5-foot Cube centered on a point within range. Each creature in that area takes 4d4 Slashing damage. A creature also takes this damage if it enters the Cube or ends its turn there or if the Cube moves into its space. A creature takes this damage only once per turn.

  On your later turns, you can take a Magic action to teleport the Cube up to 30 feet.
extra:
  - name: Using a Higher-Level Spell Slot
    description: The damage increases by 2d4 for each spell slot level above 2.
mechanic:
  mode: succession
  blocks:
    - pattern: aura
      target:
        type: area
        aoe:
          shape: cube
          size: 5
        range: $(range)
      text: spinning daggers
    - pattern: automatic
      trigger:
        event:
          - on_cast
          - enter_area
          - start_turn
      target:
        inherit: prev_step
      payloads:
        type: damage
        dice:
          count: 4
          sides: 4
        damageType: slashing
  upcast:
    resourceStep: 1
    modifications:
      - path: blocks[1].payloads.dice.count
        add: 2
