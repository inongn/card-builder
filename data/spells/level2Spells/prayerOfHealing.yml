id: prayerOfHealing
type: Activity
name: Prayer of Healing
resource: level2SpellSlot
tags:
  - level2Spell
  - abjuration
  - cleric
  - paladin
  - healingSpell
time: 10 minutes
range: 30 feet
duration: instantaneous
summary: A moment of quiet prayer restores hit points to your party.
description: |
  Up to five creatures of your choice who remain within range for the spell's entire casting gain the benefits of a Short Rest and also regain 2d8 Hit Points. A creature can't be affected by this spell again until that creature finishes a Long Rest.
extra:
  - name: Using a Higher-Level Spell Slot
    description: The healing increases by 1d8 for each spell slot level above 2.
mechanic:
  pattern: healing
  healing:
    dice:
      count: 2
      sides: 8
      bonus: $(attributes.spellcasting.bonus)
    type: hitPoints
  target:
    type: multiple
    count: 5
    range: $(range)
  text: targets gain the benefits of a Short Rest; you can't cast this spell again until you finish a Long Rest
  upcast:
    resourceStep: 1
    modifications:
      - path: healing.dice.count
        add: 1
