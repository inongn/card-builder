id: moonbeam
type: Activity
name: Moonbeam
resource: level2SpellSlot
tags:
  - level2Spell
  - evocation
  - druid
  - saveSpell
  - damageSpell
  - radiantDamage
time: action
range: 120 feet
duration: concentration, up to 1 minute
summary: A silvery beam of pale light shines down, searing foes in radiance.
description: |
  A silvery beam of pale light shines down in a 5-foot-radius, 40-foot-high Cylinder centered on a point within range. Until the spell ends, Dim Light fills the Cylinder, and you can take a Magic action on later turns to move the Cylinder up to 60 feet.

  When the Cylinder appears, each creature in it makes a DC $(attributes.spellcasting.save) Constitution saving throw. On a failed save, a creature takes 2d10 Radiant damage, and if the creature is shape-shifted (as a result of the Polymorph spell, for example), it reverts to its true form and can't shape-shift until it leaves the Cylinder. On a successful save, a creature takes half as much damage only. A creature also makes this save when the spell's area moves into its space and when it enters the spell's area or ends its turn there. A creature makes this save only once per turn.
extra:
  - name: Using a Higher-Level Spell Slot
    description: The damage increases by 1d10 for each spell slot level above 2.
mechanic:
  mode: succession
  blocks:
    - pattern: aura
      target:
        type: area
        aoe:
          shape: cylinder
          size: 5
        range: $(range)
      move:
        action: action
        distance: 60
      text: silvery pale light
    - pattern: save
      trigger:
        event:
          - on_cast
          - area_moves_into_space
          - enter_area
          - end_turn
      save:
        ability: con
        dc: $(attributes.spellcasting.save)
      target:
        inherit: prev_step
      failure:
        type: damage
        dice:
          count: 2
          sides: 10
        damageType: radiant
      success:
        halfDamage: true
  upcast:
    resourceStep: 1
    modifications:
      - path: blocks[1].failure.dice.count
        add: 1
