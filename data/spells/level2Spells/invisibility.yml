id: invisibility
type: Activity
name: Invisibility
resource: level2SpellSlot
tags:
  - level2Spell
  - illusion
  - artificer
  - bard
  - sorcerer
  - warlock
  - wizard
  - psion
time: action
range: touch
duration: concentration, up to 1 hour
summary: A creature you touch becomes invisible until it attacks or casts.
description: >
  A creature you touch has the Invisible condition until the spell ends. The
  spell ends early immediately after the target makes an attack roll, deals
  damage, or casts a spell.
extra:
  - name: Using a Higher-Level Spell Slot
    description: You can target one additional creature for each spell slot level above 2.
mechanic:
  pattern: utility
  text: Target becomes Invisible until it attacks or casts a spell.
  target:
    type: touch
