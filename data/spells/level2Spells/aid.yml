id: aid
type: Activity
name: Aid
resource: level2SpellSlot
tags:
  - level2Spell
  - abjuration
  - artificer
  - bard
  - cleric
  - druid
  - paladin
  - ranger
time: action
range: 30 feet
duration: 8 hours
summary: You bolster your allies with toughness and extra hit points.
description: |
  Choose up to three creatures within range. Each target's Hit Point maximum and current Hit Points increase by 5 for the duration.
extra:
  - name: Using a Higher-Level Spell Slot
    description: Each target's Hit Points increase by 5 for each spell slot level above 2.
mechanic:
  pattern: automatic
  target:
    type: multiple
    count: 3
    range: $(range)
  text: increase their hit point maximum and current hit points by 5
  upcast:
    resourceStep: 1
    modifications:
      - path: target.count
        add: 0
