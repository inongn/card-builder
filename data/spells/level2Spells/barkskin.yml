id: barkskin
type: Activity
name: Barkskin
resource: level2SpellSlot
tags:
  - level2Spell
  - transmutation
  - druid
  - ranger
time: bonus action
range: touch
duration: 1 hour
summary: Your skin turns bark-like, granting armor protection.
description: >
  You touch a willing creature. Until the spell ends, the target's skin assumes
  a bark-like appearance, and the target has an Armor Class of 17 if its AC is
  lower than that.
mechanic:
  pattern: utility
  text: Target AC cannot be less than 16.
  target:
    type: touch
