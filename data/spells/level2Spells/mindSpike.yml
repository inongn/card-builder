id: mindSpike
type: Activity
name: Mind Spike
resource: level2SpellSlot
tags:
  - level2Spell
  - divination
  - sorcerer
  - warlock
  - wizard
  - saveSpell
  - damageSpell
  - psychicDamage
  - psion
time: action
range: 120 feet
duration: concentration, up to 1 hour
summary: You drive a spike of psychic energy into a mind, tracking its movements.
description: >
  You drive a spike of psionic energy into the mind of one creature you can see
  within range. The target makes a DC $(attributes.spellcasting.save) Wisdom
  saving throw, taking 3d8 Psychic damage on a failed save or half as much
  damage on a successful one. On a failed save, you also always know the
  target's location until the spell ends, but only while the two of you are on
  the same plane of existence. While you have this knowledge, the target can't
  become hidden from you, and if it has the Invisible condition, it gains no
  benefit from that condition against you.
extra:
  - name: Using a Higher-Level Spell Slot
    description: The damage increases by 1d8 for each spell slot level above 2.
mechanic:
  pattern: save
  save:
    ability: wis
    dc: $(attributes.spellcasting.save)
    failure:
      damage:
        dice:
          count: 3
          sides: 8
          bonus: 0
        type: psychic
      text: You know target location at all times while spell lasts.
    success:
      text: Takes half damage
  target:
    type: single
    range: 60 feet
