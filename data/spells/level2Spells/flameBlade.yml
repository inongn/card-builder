id: flameBlade
type: Activity
name: Flame Blade
resource: level2SpellSlot
tags:
  - level2Spell
  - evocation
  - druid
  - sorcerer
time: action
range: self
duration: concentration, up to 10 minutes
summary: You evoke a fiery blade of light in your hand.
description: |
  You evoke a fiery blade in your free hand. The blade is similar in size and shape to a scimitar, and it lasts for the duration. If you let go of the blade, it disappears, but you can evoke it again as a Bonus Action.

  As a Magic action, you can make a melee spell attack with the fiery blade. On a hit, the target takes Fire damage equal to 3d6$(formatBonus(attributes.spellcasting.bonus)).

  The flaming blade sheds Bright Light in a 10-foot radius and Dim Light for an additional 10 feet.
extra:
  - name: Using a Higher-Level Spell Slot
    description: The damage increases by 1d6 for each spell slot level above 2.
mechanic:
  mode: succession
  blocks:
    - pattern: automatic
      target:
        type: self
        range: $(range)
      text: you evoke a fiery blade in your free hand that lasts for the duration. You can take the following Action while the blade persists
    - pattern: attack
      name: Flame Blade Strike
      attack:
        classification: melee
        type: spell
        bonus: $(attributes.spellcasting.attack)
      target:
        type: single
        range: 5 feet
      hit:
        type: damage
        dice:
          count: 3
          sides: 6
          bonus: $(attributes.spellcasting.bonus)
        damageType: fire
  upcast:
    resourceStep: 1
    modifications:
      - path: blocks[1].hit.dice.count
        add: 1
