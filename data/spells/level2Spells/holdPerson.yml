id: holdPerson
type: Activity
name: Hold Person
resource: level2SpellSlot
tags:
  - level2Spell
  - enchantment
  - bard
  - cleric
  - druid
  - sorcerer
  - warlock
  - wizard
  - saveSpell
  - psion
time: action
range: 60 feet
duration: concentration, up to 1 minute
summary: You paralyze a humanoid target with binding magic.
description: >
  Choose a Humanoid that you can see within range. The target must succeed on a
  DC $(attributes.spellcasting.save) Wisdom saving throw or have the Paralyzed
  condition for the duration. At the end of each of its turns, the target
  repeats the save, ending the spell on itself on a success.
extra:
  - name: Using a Higher-Level Spell Slot
    description: You can target one additional Humanoid for each spell slot level above 2.
mechanic:
  pattern: save
  save:
    ability: wis
    dc: $(attributes.spellcasting.save)
    failure:
      text: Target has the Paralyzed condition.
  target:
    type: single
    range: 60 feet
