id: poisonSpray
type: Activity
name: Poison Spray
tags:
  - necromancy
  - cantrip
  - artificer
  - druid
  - sorcerer
  - warlock
  - wizard
  - attackSpell
  - damageSpell
  - poisonDamage
time: action
range: 30 feet
duration: instantaneous
summary: You project a puff of noxious gas at a nearby creature.
description: |
  You spray toxic mist at a creature within range. Make a $(formatBonus(attributes.spellcasting.attack)) ranged spell attack against the target. On a hit, the target takes $(meta.level >= 17 ? 4 : meta.level >= 11 ? 3 : meta.level >= 5 ? 2 : 1)d12 Poison damage.
mechanic:
  pattern: attack
  attack:
    classification: ranged
    type: spell
    bonus: $(attributes.spellcasting.attack)
  target:
    type: single
    range: $(range)
  hit:
    type: damage
    dice:
      count: '$(meta.level >= 17 ? 4 : meta.level >= 11 ? 3 : meta.level >= 5 ? 2 : 1)'
      sides: 12
    damageType: poison
