id: bladeWard
type: Activity
name: Blade Ward
tags:
  - abjuration
  - cantrip
  - bard
  - sorcerer
  - warlock
  - wizard
  - psion
time: action
range: self
duration: concentration, up to 1 minute
summary: You ward yourself against weapon attacks.
description: |
