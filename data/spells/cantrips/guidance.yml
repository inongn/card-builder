id: guidance
type: Activity
name: Guidance
tags:
  - divination
  - cantrip
  - artificer
  - cleric
  - druid
time: action
range: touch
duration: concentration, up to 1 minute
summary: You touch a creature to grant a minor boost to its next skill check.
description: >
  You touch a willing creature and choose a skill. Until the spell ends, the
  creature adds 1d4 to any ability check using the chosen skill.
mechanic:
  pattern: utility
  text: Target adds 1d4 to any ability check using a chosen skill.
  target:
    type: touch
