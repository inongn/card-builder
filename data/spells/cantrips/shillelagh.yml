id: shillelagh
type: Activity
name: Shillelagh
tags:
  - transmutation
  - cantrip
  - druid
time: bonus action
range: self
duration: 1 minute
summary: Nature magic imbues your wooden weapon with force.
description: |
  A Club or Quarterstaff you are holding is imbued with nature's power. For the duration, you make attack rolls with it with a $(formatBonus(attributes.spellcasting.attack)) modifier and deal 1d8$(formatBonus(attributes.spellcasting.bonus)) Force damage.

  The spell ends early if you cast it again or if you let go of the weapon.
mechanic:
  pattern: automatic
  target:
    type: touch
  text: Imbue a Club or Quarterstaff you are holding. For the duration, you make attack rolls with it with a $(formatBonus(attributes.spellcasting.attack)) modifier and deal 1d8$(formatBonus(attributes.spellcasting.bonus)) Force damage.
