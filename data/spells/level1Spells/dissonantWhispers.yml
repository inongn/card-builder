id: dissonantWhispers
type: Activity
name: Dissonant Whispers
resource: level1SpellSlot
tags:
  - level1Spell
  - enchantment
  - bard
  - saveSpell
  - damageSpell
  - psychicDamage
  - psion
time: action
range: 60 feet
duration: instantaneous
summary: You whisper a discordant melody that causes psychic agony and forces retreat.
description: |
  One creature of your choice that you can see within range hears a discordant melody in its mind. The target makes a DC $(attributes.spellcasting.save) Wisdom saving throw. On a failed save, it takes 3d6 Psychic damage and must immediately use its Reaction, if available, to move as far away from you as it can, using the safest route. On a successful save, the target takes half as much damage only.
extra:
  - name: Using a Higher-Level Spell Slot
    description: The damage increases by 1d6 for each spell slot level above 1.
mechanic:
  pattern: save
  save:
    ability: wis
    dc: $(attributes.spellcasting.save)
  target:
    type: single
    range: $(range)
  failure:
    - type: damage
      dice:
        count: 3
        sides: 6
      damageType: psychic
    - type: text
      text: the target must immediately use its reaction, if available, to move as far away from you as its speed allows
  success:
    halfDamage: true
  upcast:
    resourceStep: 1
    modifications:
      - path: failure[0].dice.count
        add: 1
