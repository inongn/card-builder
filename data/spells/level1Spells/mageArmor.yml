id: mageArmor
type: Activity
name: Mage Armor
resource: level1SpellSlot
tags:
  - level1Spell
  - abjuration
  - sorcerer
  - wizard
  - psion
time: action
range: touch
duration: 8 hours
summary: You touch an unarmored creature to grant a protective magical forcefield.
description: |
  You touch a willing creature who isn't wearing armor. Until the spell ends, the target's base AC becomes 13 plus its Dexterity modifier. The spell ends early if the target dons armor.
mechanic:
  pattern: automatic
  target:
    type: touch
  payloads:
    type: statModifier
    stat: ac
    value: 13 plus its Dexterity modifier
    operation: set
