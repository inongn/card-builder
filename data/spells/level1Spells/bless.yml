id: bless
type: Activity
name: Bless
resource: level1SpellSlot
tags:
  - level1Spell
  - enchantment
  - cleric
  - paladin
time: action
range: 30 feet
duration: concentration, up to 1 minute
summary: You bless up to three allies, boosting their attacks and saves.
description: >
  You bless up to three creatures within range. Whenever a target makes an
  attack roll or a saving throw before the spell ends, the target adds 1d4 to
  the attack roll or save.
extra:
  - name: Using a Higher-Level Spell Slot
    description: You can target one additional creature for each spell slot level above 1.
mechanic:
  pattern: utility
  text: Targets add 1d4 to attack rolls and saving throws.
  target:
    type: single
    range: 30 feet
