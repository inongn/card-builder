id: wrathfulSmite
type: Activity
name: Wrathful Smite
resource: level1SpellSlot
tags:
  - level1Spell
  - necromancy
  - paladin
  - saveSpell
  - damageSpell
  - necroticDamage
time: bonus action
range: self
duration: 1 minute
summary: Your strike inflicts necrotic damage and frightens the target.
description: |
  Immediately after hitting a creature with a Melee weapon or an Unarmed Strike, the target takes an extra 1d6 Necrotic damage from the attack, and it must succeed on a DC $(attributes.spellcasting.save) Wisdom saving throw or have the Frightened condition until the spell ends. At the end of each of its turns, the Frightened target repeats the save, ending the spell on itself on a success.
extra:
  - name: Using a Higher-Level Spell Slot
    description: The damage increases by 1d6 for each spell slot level above 1.
mechanic:
  pattern: save
  trigger:
    event: hit_with_attack
  save:
    ability: wis
    dc: $(attributes.spellcasting.save)
  target:
    inherit: trigger
  failureOrSuccess:
    type: damage
    dice:
      count: 1
      sides: 6
    damageType: necrotic
  failure:
    - type: condition
      condition: frightened
      end: turn_repeat_save
    - type: text
      text: the target can take an Action to make a Wisdom check against your spell save DC to end the condition
  upcast:
    resourceStep: 1
    modifications:
      - path: failureOrSuccess.dice.count
        add: 1
