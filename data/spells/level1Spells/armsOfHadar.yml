id: armsOfHadar
type: Activity
name: Eldritch Arms
resource: level1SpellSlot
tags:
  - level1Spell
  - conjuration
  - warlock
  - saveSpell
  - damageSpell
  - necroticDamage
time: action
range: self
duration: instantaneous
summary: Dark tendrils erupt around you to strike nearby foes.
description: |
  Invoking Hadar, you cause tendrils to erupt from yourself. Each creature in a 10-foot Emanation originating from you makes a DC $(attributes.spellcasting.save) Strength saving throw. On a failed save, a target takes 2d6 Necrotic damage and can't take Reactions until the start of its next turn. On a successful save, a target takes half as much damage only.
extra:
  - name: Using a Higher-Level Spell Slot
    description: The damage increases by 1d6 for each spell slot level above 1.
mechanic:
  pattern: save
  save:
    ability: str
    dc: $(attributes.spellcasting.save)
  target:
    type: area
    aoe:
      shape: emanation
      size: 10
    range: $(range)
  failure:
    - type: damage
      dice:
        count: 2
        sides: 6
      damageType: necrotic
    - type: text
      text: the target can't take reactions until the start of its next turn
  success:
    halfDamage: true
  upcast:
    resourceStep: 1
    modifications:
      - path: failure[0].dice.count
        add: 1
