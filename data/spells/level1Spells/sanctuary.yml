id: sanctuary
type: Activity
name: Sanctuary
resource: level1SpellSlot
tags:
  - level1Spell
  - abjuration
  - artificer
  - cleric
  - saveSpell
  - psion
time: bonus action
range: 30 feet
duration: 1 minute
summary: You ward a creature, causing attackers to hesitate before striking it.
description: |
  You ward a creature within range. Until the spell ends, any creature who targets the warded creature with an attack roll or a damaging spell must succeed on a DC $(attributes.spellcasting.save) Wisdom saving throw or either choose a new target or lose the attack or spell. This spell doesn't protect the warded creature from areas of effect.

  The spell ends if the warded creature makes an attack roll, casts a spell, or deals damage.
mechanic:
  mode: succession
  blocks:
    - pattern: automatic
      target:
        type: single
        range: $(range)
      text: any creature who targets the target with an attack or harmful spell must first succeed on the following save
    - pattern: save
      save:
        ability: wis
        dc: $(attributes.spellcasting.save)
      failure:
        type: text
        text: the attacker must either choose a new target or lose the attack or spell
