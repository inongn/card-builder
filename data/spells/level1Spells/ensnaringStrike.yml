id: ensnaringStrike
type: Activity
name: Ensnaring Strike
resource: level1SpellSlot
tags:
  - level1Spell
  - conjuration
  - ranger
  - saveSpell
  - damageSpell
  - piercingDamage
time: bonus action
range: self
duration: concentration, up to 1 minute
summary: Your weapon strike summons grasping vines to restrain a target.
description: |
  Immediately after hitting a creature with a weapon, grasping vines appear on it, and it makes a DC $(attributes.spellcasting.save) Strength saving throw. A Large or larger creature has Advantage on this save. On a failed save, the target has the Restrained condition until the spell ends. On a successful save, the vines shrivel away, and the spell ends.

  While Restrained, the target takes 1d6 Piercing damage at the start of each of its turns. The target or a creature within reach of it can take an action to make a Strength (Athletics) check against DC $(attributes.spellcasting.save). On a success, the spell ends.
extra:
  - name: Using a Higher-Level Spell Slot
    description: The damage increases by 1d6 for each spell slot level above 1.
mechanic:
  pattern: save
  trigger:
    event: hit_with_attack
  save:
    ability: str
    dc: $(attributes.spellcasting.save)
  target:
    inherit: trigger
  failure:
    - type: condition
      condition: restrained
      end: action_check
    - type: text
      text: target takes 1d6 Piercing damage at start of its turn; a creature can take an Action to make a Strength check against your spell save DC to free the target
  upcast:
    resourceStep: 1
    modifications:
      - path: failure[0].dice.count
        add: 1
