id: tashasHideousLaughter
type: Activity
name: Hideous Laughter
resource: level1SpellSlot
tags:
  - level1Spell
  - enchantment
  - bard
  - warlock
  - wizard
  - saveSpell
  - psion
time: action
range: 30 feet
duration: concentration, up to 1 minute
summary: You cause a target to collapse into fits of uncontrollable laughter.
description: >
  One creature of your choice that you can see within range makes a DC
  $(attributes.spellcasting.save) Wisdom saving throw. On a failed save, it has
  the Prone and Incapacitated conditions for the duration. During that time, it
  laughs uncontrollably if it's capable of laughter, and it can't end the Prone
  condition on itself.


  At the end of each of its turns and each time it takes damage, it makes
  another DC $(attributes.spellcasting.save) Wisdom saving throw. The target has
  Advantage on the save if the save is triggered by damage. On a successful
  save, the spell ends.
extra:
  - name: Using a Higher-Level Spell Slot
    description: You can target one additional creature for each spell slot level about 1.
mechanic:
  pattern: save
  save:
    ability: wis
    dc: $(attributes.spellcasting.save)
    failure:
      text: Target falls Prone and has Incapacitated condition from laughter.
  target:
    type: single
    range: 30 feet
