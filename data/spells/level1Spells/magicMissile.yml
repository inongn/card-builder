id: magicMissile
type: Activity
name: Magic Missile
resource: level1SpellSlot
tags:
  - level1Spell
  - evocation
  - sorcerer
  - wizard
time: action
range: 120 feet
duration: instantaneous
summary: You create darts of magical force that automatically strike their targets.
description: |
  You create three glowing darts of magical force. Each dart strikes a creature of your choice that you can see within range. A dart deals 1d4+1 Force damage to its target. The darts all strike simultaneously, and you can direct them to hit one creature or several.
extra:
  - name: Using a Higher-Level Spell Slot
    description: The spell creates one more dart for each spell slot level above 1.
mechanic:
  pattern: automatic
  target:
    type: multiple
    count: 3
    range: $(range)
  payloads:
    type: damage
    dice:
      count: 1
      sides: 4
      bonus: 1
    damageType: force
  upcast:
    resourceStep: 1
    modifications:
      - path: target.count
        add: 1
