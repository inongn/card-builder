id: shield
type: Activity
name: Shield
resource: level1SpellSlot
tags:
  - level1Spell
  - abjuration
  - sorcerer
  - wizard
  - psion
time: reaction
range: self
duration: 1 round
summary: An imperceptible barrier of force raises your AC to block attacks.
description: |
  Immediately after being hit by an attack roll or targeted by the Magic Missile spell, an imperceptible barrier of magical force protects you. Until the start of your next turn, you have a +5 bonus to AC, including against the triggering attack, and you take no damage from Magic Missile.
mechanic:
  pattern: automatic
  trigger:
    event: be_hit
  target:
    type: self
    range: $(range)
  text: gains +5 bonus to your AC until start of your next turn, including against the triggering attack, and you take no damage from Magic Missile
