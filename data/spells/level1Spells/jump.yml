id: jump
type: Activity
name: Jump
resource: level1SpellSlot
tags:
  - level1Spell
  - transmutation
  - artificer
  - druid
  - ranger
  - sorcerer
  - wizard
  - psion
time: bonus action
range: touch
duration: 1 minute
summary: You touch a creature to triple its jump distance.
description: |
  You touch a willing creature. Once on each of its turns until the spell ends, that creature can jump up to 30 feet by spending 10 feet of movement.
extra:
  - name: Using a Higher-Level Spell Slot
    description: You can target one additional creature for each spell slot level above 1.
mechanic:
  pattern: automatic
  target:
    type: touch
  text: $(summary)
