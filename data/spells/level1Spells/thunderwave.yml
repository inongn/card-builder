id: thunderwave
type: Activity
name: Thunderwave
resource: level1SpellSlot
tags:
  - level1Spell
  - evocation
  - bard
  - druid
  - sorcerer
  - wizard
  - saveSpell
  - damageSpell
  - thunderDamage
  - psion
time: action
range: self
duration: instantaneous
summary: You unleash a wave of thunderous energy that pushes nearby objects and foes.
description: >
  You unleash a wave of thunderous energy. Each creature in a 15-foot Cube
  originating from you makes a DC $(attributes.spellcasting.save) Constitution
  saving throw. On a failed save, a creature takes 2d8 Thunder damage and is
  pushed 10 feet away from you. On a successful save, a creature takes half as
  much damage only.


  In addition, unsecured objects that are entirely within the Cube are pushed 10
  feet away from you, and a thunderous boom is audible within 300 feet.
extra:
  - name: Using a Higher-Level Spell Slot
    description: The damage increases by 1d8 for each spell slot level above 1.
mechanic:
  pattern: save
  save:
    ability: con
    dc: $(attributes.spellcasting.save)
    failure:
      damage:
        dice:
          count: 2
          sides: 8
          bonus: 0
        type: thunder
      text: Pushed 10 feet away.
    success:
      text: Takes half damage
  target:
    type: aoe
    aoe:
      shape: cube
      size: 15
    range: $(range)
