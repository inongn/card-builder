id: chromaticOrb
type: Activity
name: Chromatic Orb
resource: level1SpellSlot
tags:
  - level1Spell
  - evocation
  - sorcerer
  - wizard
  - attackSpell
  - damageSpell
  - fireDamage
  - coldDamage
  - acidDamage
  - poisonDamage
  - lightningDamage
  - thunderDamage
time: action
range: 90 feet
duration: instantaneous
summary: You hurl an orb of elemental energy at a target.
description: |
  You hurl an orb of energy at a target within range. Choose Acid, Cold, Fire, Lightning, Poison, or Thunder for the type of orb you create, and then make a $(formatBonus(attributes.spellcasting.attack)) ranged spell attack against the target. On a hit, the target takes 3d8 damage of the chosen type.

  If you roll the same number on two or more of the d8s, the orb leaps to a different target of your choice within 30 feet of the target. Make an attack roll against the new target, and make a new damage roll. The orb can't leap again unless you cast the spell with a level 2+ spell slot.
extra:
  - name: Using a Higher-Level Spell Slot
    description: The damage increases by 1d8 for each spell slot level above 1. The orb can leap a maximum number of times equal to the level of the slot expended, and a creature can be targeted only once by each casting of this spell.
mechanic:
  pattern: attack
  attack:
    classification: ranged
    type: spell
    bonus: $(attributes.spellcasting.attack)
  target:
    type: single
    range: $(range)
  hit:
    - type: damage
      dice:
        count: 3
        sides: 8
      damageType:
        - acid
        - cold
        - fire
        - lightning
        - poison
        - thunder
    - type: text
      text: if you roll the same number on two or more d8s, the energy leaps to a different target within 30 feet
  upcast:
    resourceStep: 1
    modifications:
      - path: hit[0].dice.count
        add: 1
