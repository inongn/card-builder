id: inflictWounds
type: Activity
name: Inflict Wounds
resource: level1SpellSlot
tags:
  - level1Spell
  - necromancy
  - cleric
  - saveSpell
  - damageSpell
  - necroticDamage
time: action
range: touch
duration: instantaneous
summary: Your touch inflicts heavy necrotic damage.
description: |
  A creature you touch makes a DC $(attributes.spellcasting.save) Constitution saving throw, taking 2d10 Necrotic damage on a failed save or half as much damage on a successful one.
extra:
  - name: Using a Higher-Level Spell Slot
    description: The damage increases by 1d10 for each spell slot level above 1.
mechanic:
  pattern: save
  save:
    ability: con
    dc: $(attributes.spellcasting.save)
  target:
    type: touch
  failure:
    type: damage
    dice:
      count: 2
      sides: 10
    damageType: necrotic
  success:
    halfDamage: true
  upcast:
    resourceStep: 1
    modifications:
      - path: failure.dice.count
        add: 1
