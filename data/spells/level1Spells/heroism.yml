id: heroism
type: Activity
name: Heroism
resource: level1SpellSlot
tags:
  - level1Spell
  - enchantment
  - bard
  - paladin
time: action
range: touch
duration: concentration, up to 1 minute
summary: A willing creature is imbued with bravery and temporary hit points.
description: |
  A willing creature you touch is imbued with bravery. Until the spell ends, the creature is immune to the Frightened condition and gains Temporary Hit Points equal to $(attributes.spellcasting.bonus) at the start of each of its turns.
extra:
  - name: Using a Higher-Level Spell Slot
    description: You can target one additional creature for each spell slot level above 1.
mechanic:
  pattern: automatic
  target:
    type: single
    range: $(range)
  text: target is immune to Frightened condition and gains $(attributes.spellcasting.bonus) Temporary Hit Points at start of each of its turns
