id: cureWounds
type: Activity
name: Cure Wounds
resource: level1SpellSlot
tags:
  - level1Spell
  - abjuration
  - artificer
  - bard
  - cleric
  - druid
  - paladin
  - ranger
  - healingSpell
time: action
range: touch
duration: instantaneous
summary: A creature you touch regains hit points.
description: |
  A creature you touch regains a number of Hit Points equal to 2d8$(formatBonus(attributes.spellcasting.bonus)).
extra:
  - name: Using a Higher-Level Spell Slot
    description: The healing increases by 2d8 for each spell slot level above 1.
mechanic:
  pattern: healing
  healing:
    dice:
      count: 2
      sides: 8
      bonus: $(attributes.spellcasting.bonus)
    type: hitPoints
  target:
    type: touch
  upcast:
    resourceStep: 1
    modifications:
      - path: healing.dice.count
        add: 2
