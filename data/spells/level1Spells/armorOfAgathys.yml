id: armorOfAgathys
type: Activity
name: Eldritch Armor
resource: level1SpellSlot
tags:
  - level1Spell
  - abjuration
  - warlock
time: bonus action
range: self
duration: 1 hour
summary: Protective frost surrounds you, granting temporary hit points and cold retaliatory damage.
description: |
  Protective magical frost surrounds you. You gain 5 Temporary Hit Points. If a creature hits you with a melee attack roll before the spell ends, the creature takes 5 Cold damage. The spell ends early if you have no Temporary Hit Points.
extra:
  - name: Using a Higher-Level Spell Slot
    description: The Temporary Hit Points and the Cold damage both increase by 5 for each spell slot level above 1.
mechanic:
  mode: succession
  blocks:
    - pattern: healing
      healing:
        dice:
          count: 0
          sides: 0
          bonus: 5
        type: tempHitPoints
      target:
        type: self
        range: $(range)
    - pattern: automatic
      text: while you have these temp hit points, a creature that hits you with a melee attack takes 5 Cold damage
  upcast:
    resourceStep: 1
    modifications:
      - path: blocks[0].healing.dice.bonus
        add: 5
