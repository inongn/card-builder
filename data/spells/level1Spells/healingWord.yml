id: healingWord
type: Activity
name: Healing Word
resource: level1SpellSlot
tags:
  - level1Spell
  - abjuration
  - bard
  - cleric
  - druid
  - healingSpell
time: bonus action
range: 60 feet
duration: instantaneous
summary: A quick word of magic heals a target at a distance.
description: |
  A creature of your choice that you can see within range regains Hit Points equal to 2d4$(formatBonus(attributes.spellcasting.bonus)).
extra:
  - name: Using a Higher-Level Spell Slot
    description: The healing increases by 2d4 for each spell slot level above 1.
mechanic:
  pattern: healing
  healing:
    dice:
      count: 2
      sides: 4
      bonus: $(attributes.spellcasting.bonus)
    type: hitPoints
  target:
    type: single
    range: $(range)
  upcast:
    resourceStep: 1
    modifications:
      - path: healing.dice.count
        add: 2
