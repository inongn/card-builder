id: raulothimsPsychicLance
type: Activity
name: Psychic Lance
resource: level4SpellSlot
tags:
  - level4Spell
  - enchantment
  - bard
  - psion
  - sorcerer
  - warlock
  - wizard
  - saveSpell
  - damageSpell
  - psychicDamage
time: action
range: 120 feet
duration: instantaneous
summary: You unleash a shimmering lance of psychic power at a creature or named target.
description: |
  You unleash a shimmering lance of psychic power from your forehead at a creature that you can see within range. Alternatively, you can utter a creature's name (a pseudonym, title, or nickname doesn't work). If the named target is within range, it becomes the spell's target even if you can't see it. If the named target isn't within range or you use an invalid name, the lance dissipates without effect.

  The target must make a DC $(attributes.spellcasting.save) Intelligence saving throw. On a failed save, the target takes 7d6 Psychic damage and has the Incapacitated condition until the start of your next turn. On a successful save, the target takes half as much damage only.
extra:
  - name: Using a Higher-Level Spell Slot
    description: The damage increases by 1d6 for each spell slot level above 4.
mechanic:
  pattern: save
  save:
    ability: int
    dc: $(attributes.spellcasting.save)
  target:
    type: single
    range: $(range)
  failure:
    - type: damage
      dice:
        count: 7
        sides: 6
      damageType: psychic
    - type: condition
      condition: incapacitated
      end: end_of_your_next_turn
  upcast:
    resourceStep: 1
    modifications:
      - path: failure[0].dice.count
        add: 1
