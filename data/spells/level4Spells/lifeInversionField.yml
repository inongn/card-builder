id: lifeInversionField
type: Activity
name: Life Inversion Field
resource: level4SpellSlot
tags:
  - level4Spell
  - abjuration
  - cleric
  - psion
  - sorcerer
  - saveSpell
  - damageSpell
  - necroticDamage
time: action
range: self
duration: concentration, up to 1 minute
summary: You create an aura that heals you and converts your healing into necrotic damage to foes.
description: |
  An aura radiates from you in a 30-foot Emanation for the duration. When you create the aura, you regain 4d8 Hit Points. Whenever you regain Hit Points, you can choose a creature you can see in the aura and force it to make a DC $(attributes.spellcasting.save) Constitution saving throw. On a failed save, the creature takes Necrotic damage equal to half the amount of Hit Points you regained (round up). A creature makes this save only once per turn.
extra:
  - name: Using a Higher-Level Spell Slot
    description: The healing increases by 1d8 for each spell slot level above 4.
mechanic:
  pattern: automatic
  target:
    type: area
    aoe:
      shape: emanation
      size: 30
    range: $(range)
  text: when you regain Hit Points, foes in aura take Necrotic damage equal to half the HP restored
