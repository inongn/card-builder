id: vitriolicSphere
type: Activity
name: Vitriolic Sphere
resource: level4SpellSlot
tags:
  - level4Spell
  - evocation
  - sorcerer
  - wizard
  - saveSpell
  - damageSpell
  - acidDamage
time: action
range: 150 feet
duration: instantaneous
summary: A ball of acid streaks to a location and explodes into a corrosive splash.
description: |
  You point at a location within range, and a glowing, 1-foot-diameter ball of acid streaks there and explodes in a 20-foot-radius Sphere. Each creature in that area makes a DC $(attributes.spellcasting.save) Dexterity saving throw. On a failed save, a creature takes 10d4 Acid damage and another 5d4 Acid damage at the end of its next turn. On a successful save, a creature takes half the initial damage only.
extra:
  - name: Using a Higher-Level Spell Slot
    description: The initial damage increases by 2d4 for each spell slot level above 4.
mechanic:
  pattern: save
  save:
    ability: dex
    dc: $(attributes.spellcasting.save)
  target:
    type: area
    aoe:
      shape: sphere
      size: 20
    range: $(range)
  failure:
    - type: damage
      dice:
        count: 10
        sides: 4
      damageType: acid
    - type: text
      text: the target takes an additional 5d4 Acid damage at the end of its next turn
  success:
    halfDamage: true
  upcast:
    resourceStep: 1
    modifications:
      - path: failure[0].dice.count
        add: 2
