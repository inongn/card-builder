id: auraOfPurity
type: Activity
name: Aura of Purity
resource: level4SpellSlot
tags:
  - level4Spell
  - abjuration
  - cleric
  - paladin
time: action
range: self
duration: concentration, up to 10 minutes
summary: An aura radiates from you, protecting allies against conditions and disease.
description: |
  An aura radiates from you in a 30-foot Emanation for the duration. While in the aura, you and your allies have Resistance to Poison damage and Advantage on saving throws to avoid or end effects that include the Blinded, Charmed, Deafened, Frightened, Paralyzed, Poisoned, or Stunned condition.
mechanic:
  pattern: automatic
  target:
    type: area
    aoe:
      shape: emanation
      size: 30
    range: $(range)
  text: allies in aura can't become Diseased, gain Resistance to Poison damage, and gain Advantage on saving throws against the Blinded, Charmed, Deafened, Frightened, Paralyzed, Poisoned, and Stunned conditions
