id: iceStorm
type: Activity
name: Ice Storm
resource: level4SpellSlot
tags:
  - level4Spell
  - evocation
  - druid
  - sorcerer
  - wizard
  - saveSpell
  - damageSpell
  - bludgeoningDamage
  - coldDamage
time: action
range: 300 feet
duration: instantaneous
summary: Hail and cold rain fall in a cylinder, damaging and creating difficult terrain.
description: |
  Hail falls in a 20-foot-radius, 40-foot-high Cylinder centered on a point within range. Each creature in the Cylinder makes a DC $(attributes.spellcasting.save) Dexterity saving throw. A creature takes 2d10 Bludgeoning damage and 4d6 Cold damage on a failed save or half as much damage on a successful one.

  Hailstones turn ground in the Cylinder into Difficult Terrain until the end of your next turn.
extra:
  - name: Using a Higher-Level Spell Slot
    description: The Bludgeoning damage increases by 1d10 for each spell slot level above 4.
mechanic:
  pattern: save
  save:
    ability: dex
    dc: $(attributes.spellcasting.save)
  target:
    type: area
    aoe:
      shape: cylinder
      size: 20
    range: $(range)
  failure:
    - type: damage
      dice:
        count: 2
        sides: 10
      damageType: bludgeoning
    - type: damage
      dice:
        count: 4
        sides: 6
      damageType: cold
  success:
    halfDamage: true
  text: area becomes Difficult Terrain until end of your next turn
  upcast:
    resourceStep: 1
    modifications:
      - path: failure[0].dice.count
        add: 1
