id: freedomOfMovement
type: Activity
name: Freedom of Movement
resource: level4SpellSlot
tags:
  - level4Spell
  - abjuration
  - artificer
  - bard
  - cleric
  - druid
  - ranger
  - psion
time: action
range: touch
duration: 1 hour
summary: You touch a creature to make it immune to movement restrictions and paralysis.
description: |
  You touch a willing creature. For the duration, the target's movement is unaffected by Difficult Terrain, and spells and other magical effects can neither reduce the target's Speed nor cause the target to have the Paralyzed or Restrained conditions. The target also has a Swim Speed equal to its Speed.

  In addition, the target can spend 5 feet of movement to automatically escape from nonmagical restraints, such as manacles or a creature imposing the Grappled condition on it.
extra:
  - name: Using a Higher-Level Spell Slot
    description: You can target one additional creature for each spell slot level above 4.
mechanic:
  pattern: automatic
  target:
    type: touch
  text: gain the ability to ignore movement restrictions, paralysis, and nonmagical restraints
  upcast:
    resourceStep: 1
    modifications:
      - path: target.count
        add: 1
