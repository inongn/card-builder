id: blight
type: Activity
name: Blight
resource: level4SpellSlot
tags:
  - level4Spell
  - necromancy
  - druid
  - sorcerer
  - warlock
  - wizard
  - saveSpell
  - damageSpell
  - necroticDamage
time: action
range: 30 feet
duration: instantaneous
summary: You drain the moisture and life force from a target, dealing necrotic damage.
description: |
  A creature that you can see within range makes a DC $(attributes.spellcasting.save) Constitution saving throw, taking 8d8 Necrotic damage on a failed save or half as much damage on a successful one. A Plant creature automatically fails the save.

  Alternatively, target a nonmagical plant that isn't a creature, such as a tree or shrub. It doesn't make a save; it simply withers and dies.
extra:
  - name: Using a Higher-Level Spell Slot
    description: The damage increases by 1d8 for each spell slot level above 4.
mechanic:
  pattern: save
  save:
    ability: con
    dc: $(attributes.spellcasting.save)
  target:
    type: single
    range: $(range)
  failure:
    type: damage
    dice:
      count: 8
      sides: 8
    damageType: necrotic
  success:
    halfDamage: true
  upcast:
    resourceStep: 1
    modifications:
      - path: failure.dice.count
        add: 1
