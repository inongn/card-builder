id: slow
type: Activity
name: Slow
resource: level3SpellSlot
tags:
  - level3Spell
  - transmutation
  - bard
  - sorcerer
  - wizard
  - saveSpell
time: action
range: 120 feet
duration: concentration, up to 1 minute
summary: You alter time around foes to slow their movement and limit actions.
description: |
  You alter time around up to six creatures of your choice in a 40-foot Cube within range. Each target must succeed on a DC $(attributes.spellcasting.save) Wisdom saving throw or be affected by this spell for the duration.

  An affected target's Speed is halved, it takes a −2 penalty to AC and Dexterity saving throws, and it can't take Reactions. On its turns, it can take either an action or a Bonus Action, not both, and it can make only one attack if it takes the Attack action. If it casts a spell with a Somatic component, there is a 25 percent chance the spell fails as a result of the target making the spell's gestures too slowly.

  An affected target repeats the save at the end of each of its turns, ending the spell on itself on a success.
mechanic:
  pattern: save
  save:
    ability: wis
    dc: $(attributes.spellcasting.save)
  target:
    type: multiple
    count: 6
    range: $(range)
  failure:
    - type: statModifier
      stat: ac
      value: 2
      operation: subtract
    - type: text
      text: Speed is halved, has -2 to Dex saves, and can't use reactions or take both action and Bonus Action on a turn
