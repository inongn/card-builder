id: enemiesAbound
type: Activity
name: Enemies Abound
resource: level3SpellSlot
tags:
  - level3Spell
  - enchantment
  - bard
  - psion
  - sorcerer
  - warlock
  - wizard
  - saveSpell
time: action
range: 120 feet
duration: concentration, up to 1 minute
summary: You reach into a creature's mind and force it to see all creatures as foes.
description: |
  Choose a creature you can see within range. The target must succeed on a DC $(attributes.spellcasting.save) Intelligence saving throw or have the Frightened condition for the duration. While Frightened, the target loses the ability to distinguish friend from foe and is affected in the following ways:

  - The target regards all creatures it can see as enemies.
  - Whenever the target chooses a creature other than itself for an attack, spell, or other ability, it must choose at random from among the creatures it can see within range of that attack, spell, or other ability.
  - The target must make an Opportunity Attack each time it is able to.

  Each time the target takes damage, it makes another DC $(attributes.spellcasting.save) Intelligence saving throw. On a successful save, the spell ends.
mechanic:
  pattern: save
  save:
    ability: int
    dc: $(attributes.spellcasting.save)
  target:
    type: single
    range: $(range)
  failure:
    - type: condition
      condition: charmed
      end: repeat_save_on_damage
    - type: text
      text: the target regards all creatures as enemies and repeats the save whenever it takes damage
