id: intellectFortress
type: Activity
name: Intellect Fortress
resource: level3SpellSlot
tags:
  - level3Spell
  - abjuration
  - artificer
  - bard
  - psion
  - sorcerer
  - warlock
  - wizard
time: action
range: 30 feet
duration: concentration, up to 1 hour
summary: You shield a willing creature's mind, granting Psychic Resistance and mental save Advantage.
description: |
  For the duration, one willing creature you can see within range has Resistance to Psychic damage as well as Advantage on Intelligence, Wisdom, and Charisma saving throws.
extra:
  - name: Using a Higher-Level Spell Slot
    description: You can target one additional creature for each spell slot level above 3.
mechanic:
  pattern: automatic
  target:
    type: single
    range: $(range)
  text: target gains Resistance to Psychic damage and Advantage on Intelligence, Wisdom, and Charisma saving throws
  upcast:
    resourceStep: 1
    modifications:
      - path: target.count
        add: 1
