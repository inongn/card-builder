id: lightningBolt
type: Activity
name: Lightning Bolt
resource: level3SpellSlot
tags:
  - level3Spell
  - evocation
  - sorcerer
  - wizard
  - saveSpell
  - damageSpell
  - lightningDamage
time: action
range: self
duration: instantaneous
summary: A stroke of lightning blasts out in a long line.
description: |
  A stroke of lightning forming a 100-foot-long, 5-foot-wide Line blasts out from you in a direction you choose. Each creature in the Line makes a DC $(attributes.spellcasting.save) Dexterity saving throw, taking 8d6 Lightning damage on a failed save or half as much damage on a successful one.
extra:
  - name: Using a Higher-Level Spell Slot
    description: The damage increases by 1d6 for each spell slot level above 3.
mechanic:
  pattern: save
  save:
    ability: dex
    dc: $(attributes.spellcasting.save)
  target:
    type: area
    aoe:
      shape: line
      size: 100
    range: $(range)
  failure:
    type: damage
    dice:
      count: 8
      sides: 6
    damageType: lightning
  success:
    halfDamage: true
  upcast:
    resourceStep: 1
    modifications:
      - path: failure.dice.count
        add: 1
