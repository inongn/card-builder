id: massHealingWord
type: Activity
name: Mass Healing Word
resource: level3SpellSlot
tags:
  - level3Spell
  - abjuration
  - bard
  - cleric
  - healingSpell
time: bonus action
range: 60 feet
duration: instantaneous
summary: A quick burst of magic heals up to six targets at a distance.
description: |
  Up to six creatures of your choice that you can see within range regain Hit Points equal to 2d4$(formatBonus(attributes.spellcasting.bonus)).
extra:
  - name: Using a Higher-Level Spell Slot
    description: The healing increases by 1d4 for each spell slot level above 3.
mechanic:
  pattern: healing
  healing:
    dice:
      count: 2
      sides: 4
      bonus: $(attributes.spellcasting.bonus)
    type: hitPoints
  target:
    type: multiple
    count: 6
    range: $(range)
  upcast:
    resourceStep: 1
    modifications:
      - path: healing.dice.count
        add: 1
