id: crusadersMantle
type: Activity
name: Crusader's Mantle
resource: level3SpellSlot
tags:
  - level3Spell
  - evocation
  - paladin
time: action
range: self
duration: concentration, up to 1 minute
summary: Holy power radiates from you, boosting allies weapon damage with radiance.
description: |
  You radiate a magical aura in a 30-foot Emanation. While in the aura, you and your allies each deal an extra 1d4 Radiant damage when hitting with a weapon or an Unarmed Strike.
mechanic:
  pattern: automatic
  target:
    type: area
    aoe:
      shape: emanation
      size: 30
    range: $(range)
  text: weapon attacks by you and your allies deal an extra 1d4 Radiant damage
