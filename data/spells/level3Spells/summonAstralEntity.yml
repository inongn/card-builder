tags: [level3Spell, conjuration, psion]
id: summonAstralEntity
type: Activity
name: Summon Astral Entity
time: action
range: 90 feet
resource: level3SpellSlot
duration: concentration, up to 1 hour
summary: "You call forth an astral entity from the Astral Plane to fight alongside you."
description: |
  You call forth a psionic spirit. It manifests in an unoccupied space that you can see within range and uses the Psionic Spirit stat block. When you cast the spell, choose an Astral Form: Crystal Entity, Ectoplasmic Entity, or Ghostly Entity. The creature disappears when it drops to 0 Hit Points or when the spell ends.

  The creature is an ally to you and your allies. In combat, the creature shares your Initiative count, taking its turn immediately after yours. It obeys your verbal commands (no action required). If you don't issue any, it takes the Dodge action and uses its movement to avoid danger.
extra:
  - name: Using a Higher-Level Spell Slot
    description: Use the spell slot's level for the spell's level in the stat block.
children:
  - type: Reference
    target: [astralEntityCrystal, astralEntityEctoplasmic, astralEntityGhostly]
