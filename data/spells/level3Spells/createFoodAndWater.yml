id: createFoodAndWater
type: Activity
name: Create Food And Water
resource: level3SpellSlot
tags:
  - level3Spell
  - conjuration
  - artificer
  - cleric
  - paladin
time: action
range: 30 feet
duration: instantaneous
summary: You create food and clean water to sustain a party.
description: >
  You create 45 pounds of food and 30 gallons of fresh water on the ground or in
  containers within range - both useful in fending off the hazards of
  malnutrition and dehydration. The food is bland but nourishing and looks like
  a food of your choice, and the water is clean. The food spoils after 24 hours
  if uneaten.
mechanic:
  pattern: utility
  target:
    type: single
    range: 30 feet
