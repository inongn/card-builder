id: telekineticCrush
name: Telekinetic Crush
summary: Crush a target with massive telekinetic force.
tags:
  - level3Spell
  - transmutation
  - psion
  - sorcerer
  - warlock
  - saveSpell
  - damageSpell
  - forceDamage
type: Activity
time: action
range: 120 feet
resource: level3SpellSlot
duration: Instantaneous
description: |
  You create a field of crushing telekinetic force in a 30-foot Cube within range. Each creature in the area makes a DC $(attributes.spellcasting.save) Strength saving throw. On a failed save, a target takes 5d6 Force damage and has the Prone condition. On a successful save, a target takes half as much damage only.
mechanic:
  pattern: save
  save:
    ability: str
    dc: $(attributes.spellcasting.save)
  target:
    type: single
    range: $(range)
  failure:
    - type: damage
      dice:
        count: 5
        sides: 6
      damageType: force
    - type: condition
      condition: prone
  success:
    halfDamage: true
  upcast:
    resourceStep: 1
    modifications:
      - path: failure[0].dice.count
        add: 1
