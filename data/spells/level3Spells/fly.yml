id: fly
type: Activity
name: Fly
resource: level3SpellSlot
tags:
  - level3Spell
  - transmutation
  - artificer
  - sorcerer
  - warlock
  - wizard
  - psion
time: action
range: touch
duration: concentration, up to 10 minutes
summary: You touch a creature to grant it a flying speed.
description: |
  You touch a willing creature. For the duration, the target gains a Fly Speed of 60 feet and can hover. When the spell ends, the target falls if it is still aloft unless it can stop the fall.
extra:
  - name: Using a Higher-Level Spell Slot
    description: You can target one additional creature for each spell slot level above 3.
mechanic:
  pattern: utility
  target:
    type: touch
