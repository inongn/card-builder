id: beaconOfHope
type: Activity
name: Beacon Of Hope
resource: level3SpellSlot
tags:
  - level3Spell
  - abjuration
  - cleric
  - healingSpell
time: action
range: 30 feet
duration: concentration, up to 1 minute
summary: You grant hope and maximum healing to allies in an area.
description: |
  Choose any number of creatures within range. For the duration, each target has Advantage on Wisdom saving throws and Death Saving Throws and regains the maximum number of Hit Points possible from any healing.
mechanic:
  pattern: automatic
  target:
    type: area
    aoe:
      shape: emanation
      size: 30
    range: $(range)
  text: allies gain Advantage on Wisdom saves and death saves, and regain maximum HP from any healing
