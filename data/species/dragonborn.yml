id: dragonborn
name: Dragonborn
tags:
  - species
description: Descendants of metallic and chromatic dragons with scaly skin and elemental breath weapons.
type: Folder
children:
  - type: Reference
    target:
      - breathWeapon
  - id: breathWeapon
    type: Resource
    name: Breath Weapon
    quantity: $(attributes.prof)
    sr: 0
  - id: dragonbornDarkvision
    type: Effect
    target: attributes.senses.darkvision
    operation: set
    value: 60
  - type: Reference
    target:
      - draconicFlight
    condition: $(meta.level >= 5)
  - id: draconicAncestry
    name: Draconic Ancestry
    type: Slot
    target: draconicAncestry
    quantity: 1
