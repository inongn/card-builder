  id: dauntingRoar
- type: Resource
  name: Daunting Roar
  id: dauntingRoar
  quantity: $(attributes.prof)
- type: Slot
  name: Leonin Prowess Skill Proficiency
  id: leoninSkillProficiency
  target: survivalProficiency, perceptionProficiency, stealthProficiency
- id: leoninDarkvision
  type: Effect
  target: attributes.senses.darkvision
  operation: set
  value: 60
- id: feralPounce
  type: Extra
  target: unarmed
  name: Pounce
  description: "Once per turn, you can use both the Damage and Shove options."
- type: Effect
  target: activities[tags=unarmed].description["Bludgeoning"]
  operation: replace
  value: "Slashing"
