id: leonin
name: Leonin
tags:
  - species
description: Fierce, golden-furred hunters who value pride, martial prowess, and fierce independence.
type: Folder
children:
  - type: Effect
    target: attributes.movement.walk
    operation: set
    value: 30
  - type: Activity
    range: 10 feet
    time: bonus action
    name: Daunting Roar
    description: You let out a terrifying roar. Each creature of your choice within range must succeed on a DC $(attributes.prof + 8 + stats.con.mod) Wisdom saving throw or have Disadvantage on attack rolls and saving throws until the end of your next turn.
    mechanic:
      pattern: save
      save:
        ability: wis
        dc: $(attributes.prof + 8 + stats.con.mod)
      target:
        type: multiple
        filter: creature
        range: $(range)
      failure:
        - type: rollModifier
          modifierType: disadvantage
          targetRolls: [attack, save]
          end: end_of_your_next_turn
    resource: dauntingRoar
    id: dauntingRoar
  - type: Resource
    name: Daunting Roar
    id: dauntingRoar
    quantity: $(attributes.prof)
  - type: Slot
    name: Leonin Prowess Skill Proficiency
    id: leoninSkillProficiency
    target: survivalProficiency, perceptionProficiency, stealthProficiency
  - id: leoninDarkvision
    type: Effect
    target: attributes.senses.darkvision
    operation: set
    value: 60
  - type: Effect
    target: activities[tags=unarmed].mechanic.hit.dice
    operation: set
    value:
      count: 1
      sides: 4
      bonus: $(attributes.melee.bonus)
  - type: Effect
    target: activities[tags=unarmed].mechanic.hit.damageType
    operation: set
    value: slashing