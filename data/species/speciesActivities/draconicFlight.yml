id: draconicFlight
type: Activity
range: self
name: Draconic Flight
time: bonus action
duration: 10 minutes
resource: limited
description: |
  You sprout spectral wings on your back for 10 minutes or until you retract them (no action required) or have the Incapacitated condition. During that time, you have a Fly Speed of $(attributes.movement.walk) feet.
mechanic:
  pattern: utility
  text: "You gain a Fly Speed of $(attributes.movement.walk) feet."
