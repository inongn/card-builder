id: healingHands
type: Activity
name: Healing Hands
time: action
range: touch
duration: Instantaneous
resource: limited
description: |
  You touch a creature and roll $(attributes.prof)d4. The creature regains Hit Points equal to the total rolled.
mechanic:
  pattern: healing
  healing:
    dice:
      count: $(attributes.prof)
      sides: 4
    type: hitPoints
  target:
    type: touch
