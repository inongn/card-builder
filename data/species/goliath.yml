id: goliath
name: Goliath
tags:
  - species
description: Towering descendants of giants who command supernatural martial boons and sudden growth.
type: Folder
children:
  - id: goliathSpeed
    type: Effect
    target: attributes.movement.walk
    operation: set
    value: 35
  - id: giantAncestry
    name: Giant Ancestry
    type: Slot
    target: giantAncestry
    quantity: 1
  - id: largeForm
    type: Activity
    range: self
    name: Large Form
    time: bonus action
    duration: 10 minutes
    resource: limited
    description: |
      You change your size to Large if you're in a big enough space. This transformation lasts for 10 minutes or until you end it (no action required). For that duration, you have Advantage on Strength checks, and your Speed increases by 10 feet.
    mechanic:
      pattern: automatic
      target:
        type: self
      payloads:
        - type: rollModifier
          modifierType: advantage
          targetRolls: check
          text: gain Advantage on Strength checks, your size becomes Large, and your Speed increases by 10 feet
    condition: $(meta.level >= 5)
  - id: powerfulBuildGrappled
    type: Reference
    target: grappledAdvantage
