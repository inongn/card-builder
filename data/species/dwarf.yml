id: dwarf
name: Dwarf
tags:
  - species
description: Resilient folk forged from stone and metal, enduring as the mountains with an affinity for craft.
type: Folder
children:
  - id: dwarfDarkvision
    type: Effect
    target: attributes.senses.darkvision
    operation: set
    value: 120
  - type: Reference
    target: poisonResistance
  - type: Reference
    target: poisonedAdvantage
  - id: dwarvenToughness
    type: Effect
    target: attributes.hp
    name: Dwarven Toughness
    operation: add
    value: 1
  - id: stonecunning
    type: Activity
    name: Stonecunning
    time: bonus action
    range: self
    duration: 10 minutes
    resource: stonecunning
    description: |
      You gain Tremorsense with a range of 60 feet for 10 minutes. You must be on a stone surface or touching a stone surface to use this Tremorsense. The stone can be natural or worked.
  - id: stonecunning
    type: Resource
    name: Stonecunning
    quantity: $(attributes.prof)
    sr: 0
