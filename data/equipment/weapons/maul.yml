id: maul
name: Maul
type: Activity
time: action
range: 5 feet
duration: instantaneous
tags:
  - martial
  - melee
  - topple
  - twoHanded
  - weaponAttack
  - bludgeoningDamage
  - maul
description: >-
  You strike with your Maul. Make a $(formatBonus(attributes.melee.attack))
  attack against the target. On a hit, the target takes damage.
mechanic:
  pattern: attack
  attack:
    classification: melee
    type: weapon
    bonus: $(attributes.melee.attack)
  damage:
    dice:
      count: 2
      sides: 6
      bonus: $(attributes.melee.bonus)
    type: bludgeoning
  target:
    type: single
    range: 5 feet
