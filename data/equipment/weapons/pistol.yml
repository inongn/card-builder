id: pistol
name: Pistol
type: Activity
time: action
range: 30 feet
duration: instantaneous
tags:
  - martial
  - ranged
  - vex
  - weaponAttack
  - piercingDamage
  - pistol
description: >-
  You strike with your Pistol. Make a $(formatBonus(attributes.ranged.attack))
  attack against the target. On a hit, the target takes damage.
mechanic:
  pattern: attack
  attack:
    classification: ranged
    type: weapon
    bonus: $(attributes.ranged.attack)
  damage:
    dice:
      count: 1
      sides: 10
      bonus: $(attributes.ranged.bonus)
    type: piercing
  target:
    type: single
    range: 30 feet
