id: sling
name: Sling
type: Activity
time: action
range: 30 feet
duration: instantaneous
tags:
  - simple
  - ranged
  - slow
  - weaponAttack
  - bludgeoningDamage
  - sling
description: >-
  You strike with your Sling. Make a $(formatBonus(attributes.ranged.attack))
  attack against the target. On a hit, the target takes damage.
mechanic:
  pattern: attack
  attack:
    classification: ranged
    type: weapon
    bonus: $(attributes.ranged.attack)
  damage:
    dice:
      count: 1
      sides: 4
      bonus: $(attributes.ranged.bonus)
    type: bludgeoning
  target:
    type: single
    range: 30 feet
