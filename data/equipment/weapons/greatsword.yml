id: greatsword
name: Greatsword
type: Activity
time: action
range: 5 feet
duration: instantaneous
tags:
  - martial
  - melee
  - graze
  - twoHanded
  - weaponAttack
  - slashingDamage
  - greatsword
description: >-
  You strike with your Greatsword. Make a
  $(formatBonus(attributes.melee.attack)) attack against the target. On a hit,
  the target takes damage.
mechanic:
  pattern: attack
  attack:
    classification: melee
    type: weapon
    bonus: $(attributes.melee.attack)
  damage:
    dice:
      count: 2
      sides: 6
      bonus: $(attributes.melee.bonus)
    type: slashing
  target:
    type: single
    range: 5 feet
