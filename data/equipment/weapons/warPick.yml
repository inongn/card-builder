id: warPick
name: War Pick
type: Activity
time: action
range: 5 feet
duration: instantaneous
tags:
  - martial
  - melee
  - sap
  - weaponAttack
  - piercingDamage
  - warPick
description: >-
  You strike with your War Pick. Make a $(formatBonus(attributes.melee.attack))
  attack against the target. On a hit, the target takes damage.
mechanic:
  pattern: attack
  attack:
    classification: melee
    type: weapon
    bonus: $(attributes.melee.attack)
  damage:
    dice:
      count: 1
      sides: '$(attributes.shieldEquipped == true ? 8 : 10)'
      bonus: $(attributes.melee.bonus)
    type: piercing
  target:
    type: single
    range: 5 feet
