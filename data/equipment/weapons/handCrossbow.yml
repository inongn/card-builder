id: handCrossbow
name: Hand Crossbow
type: Activity
time: action
range: 30 feet
duration: instantaneous
tags:
  - martial
  - ranged
  - vex
  - light
  - weaponAttack
  - piercingDamage
  - handCrossbow
description: You strike with your $(name). Make a $(formatBonus(mechanic.attack.bonus)) attack against the target. On a hit, the target takes $(formatDice(mechanic.hit.dice)) $(capitalize(mechanic.hit.damageType)) damage.
mechanic:
  pattern: attack
  attack:
    classification: ranged
    type: weapon
    bonus: $(attributes.ranged.attack)
  target:
    type: single
    range: 30 feet
  hit:
    type: damage
    dice:
      count: 1
      sides: 6
      bonus: $(attributes.ranged.bonus)
    damageType: piercing
