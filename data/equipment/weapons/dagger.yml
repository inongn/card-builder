id: dagger
name: Dagger
type: Activity
time: action
range: 20 feet
duration: instantaneous
tags:
  - simple
  - finesse
  - nick
  - light
  - weaponAttack
  - piercingDamage
  - dagger
description: >-
  You strike with your $(name). Make a $(formatBonus(mechanic.attack.bonus))
  attack against the target. On a hit, the target takes $(formatDice(mechanic.damage.dice))
  $(capitalize(mechanic.damage.type)) damage.
mechanic:
  pattern: attack
  attack:
    classification: finesse
    type: weapon
    bonus: $(attributes.finesse.attack)
  damage:
    dice:
      count: 1
      sides: 4
      bonus: $(attributes.finesse.bonus)
    type: piercing
  target:
    type: single
    range: 20 feet
