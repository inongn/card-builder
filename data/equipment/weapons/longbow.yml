id: longbow
name: Longbow
type: Activity
time: action
range: 150 feet
duration: instantaneous
tags:
  - martial
  - ranged
  - slow
  - twoHanded
  - weaponAttack
  - piercingDamage
  - longbow
description: >-
  You strike with your Longbow. Make a $(formatBonus(attributes.ranged.attack))
  attack against the target. On a hit, the target takes damage.
mechanic:
  pattern: attack
  attack:
    classification: ranged
    type: weapon
    bonus: $(attributes.ranged.attack)
  damage:
    dice:
      count: 1
      sides: 8
      bonus: $(attributes.ranged.bonus)
    type: piercing
  target:
    type: single
    range: 150 feet
