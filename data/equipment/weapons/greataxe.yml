id: greataxe
name: Greataxe
type: Activity
time: action
range: 5 feet
duration: instantaneous
tags:
  - martial
  - melee
  - cleave
  - twoHanded
  - weaponAttack
  - slashingDamage
  - greataxe
description: >-
  You strike with your Greataxe. Make a $(formatBonus(attributes.melee.attack))
  attack against the target. On a hit, the target takes damage.
mechanic:
  pattern: attack
  attack:
    classification: melee
    type: weapon
    bonus: $(attributes.melee.attack)
  damage:
    dice:
      count: 1
      sides: 12
      bonus: $(attributes.melee.bonus)
    type: slashing
  target:
    type: single
    range: 5 feet
