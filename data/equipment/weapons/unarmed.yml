id: unarmed
name: Unarmed Strike
type: Activity
time: action
range: 5 feet
duration: instantaneous
tags:
  - simple
  - melee
  - weaponAttack
  - slashingDamage
  - unarmed
  - bludgeoningDamage
description: >-
  You strike with your $(name). Make a $(formatBonus(mechanic.attack.bonus))
  attack against the target. On a hit, the target takes $(formatDice(mechanic.damage.dice))
  $(capitalize(mechanic.damage.type)) damage.
mechanic:
  pattern: attack
  attack:
    classification: melee
    type: weapon
    bonus: $(attributes.melee.attack)
  damage:
    dice:
      count: 0
      sides: 0
      bonus: $(Math.max(1,attributes.melee.bonus))
    type: Bludgeoning
  target:
    type: single
    range: 5 feet