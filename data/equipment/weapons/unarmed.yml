id: unarmed
name: Unarmed Strike
type: Activity
time: action
range: 5 feet
duration: instantaneous
tags:
  - simple
  - melee
  - weaponAttack
  - slashingDamage
  - unarmed
  - bludgeoningDamage
description: >-
  You strike with your Unarmed Strike. Make a
  $(formatBonus(attributes.melee.attack)) attack against the target. On a hit,
  the target takes damage.
mechanic:
  pattern: attack
  attack:
    classification: melee
    type: weapon
    bonus: $(attributes.melee.attack)
  damage:
    dice:
      count: 1
      sides: 6
      bonus: $(attributes.melee.bonus)
    type: slashing
  target:
    type: single
    range: 5 feet
