id: lightCrossbow
name: Light Crossbow
type: Activity
time: action
range: 80 feet
duration: instantaneous
tags:
  - simple
  - ranged
  - slow
  - twoHanded
  - weaponAttack
  - piercingDamage
  - lightCrossbow
description: You strike with your $(name). Make a $(formatBonus(mechanic.attack.bonus)) attack against the target. On a hit, the target takes $(formatDice(mechanic.hit.dice)) $(capitalize(mechanic.hit.damageType)) damage.
mechanic:
  pattern: attack
  attack:
    classification: ranged
    type: weapon
    bonus: $(attributes.ranged.attack)
  target:
    type: single
    range: 80 feet
  hit:
    type: damage
    dice:
      count: 1
      sides: 8
      bonus: $(attributes.ranged.bonus)
    damageType: piercing
