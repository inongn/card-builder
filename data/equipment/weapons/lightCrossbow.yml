id: lightCrossbow
name: Light Crossbow
type: Activity
time: action
range: 80 feet
duration: instantaneous
tags:
  - simple
  - ranged
  - slow
  - twoHanded
  - weaponAttack
  - piercingDamage
  - lightCrossbow
description: >-
  You strike with your Light Crossbow. Make a
  $(formatBonus(attributes.ranged.attack)) attack against the target. On a hit,
  the target takes damage.
mechanic:
  pattern: attack
  attack:
    classification: ranged
    type: weapon
    bonus: $(attributes.ranged.attack)
  damage:
    dice:
      count: 1
      sides: 8
      bonus: $(attributes.ranged.bonus)
    type: piercing
  target:
    type: single
    range: 80 feet
