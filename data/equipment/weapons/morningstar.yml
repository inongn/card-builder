id: morningstar
name: Morningstar
type: Activity
time: action
range: 5 feet
duration: instantaneous
tags:
  - martial
  - melee
  - sap
  - weaponAttack
  - piercingDamage
  - morningstar
description: >-
  You strike with your Morningstar. Make a
  $(formatBonus(attributes.melee.attack)) attack against the target. On a hit,
  the target takes damage.
mechanic:
  pattern: attack
  attack:
    classification: melee
    type: weapon
    bonus: $(attributes.melee.attack)
  damage:
    dice:
      count: 1
      sides: 8
      bonus: $(attributes.melee.bonus)
    type: piercing
  target:
    type: single
    range: 5 feet
