id: spear
name: Spear
type: Activity
time: action
range: 20 feet
duration: instantaneous
tags:
  - simple
  - melee
  - sap
  - weaponAttack
  - piercingDamage
  - spear
description: >-
  You strike with your $(name). Make a $(formatBonus(mechanic.attack.bonus))
  attack against the target. On a hit, the target takes $(formatDice(mechanic.damage.dice))
  $(capitalize(mechanic.damage.type)) damage.
mechanic:
  pattern: attack
  attack:
    classification: melee
    type: weapon
    bonus: $(attributes.melee.attack)
  damage:
    dice:
      count: 1
      sides: '$(attributes.shieldEquipped == true ? 6 : 8)'
      bonus: $(attributes.melee.bonus)
    type: piercing
  target:
    type: single
    range: 20 feet
