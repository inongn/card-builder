id: sickle
name: Sickle
type: Activity
time: action
range: 5 feet
duration: instantaneous
tags:
  - simple
  - melee
  - nick
  - light
  - weaponAttack
  - slashingDamage
  - sickle
description: >-
  You strike with your Sickle. Make a $(formatBonus(attributes.melee.attack))
  attack against the target. On a hit, the target takes damage.
mechanic:
  pattern: attack
  attack:
    classification: melee
    type: weapon
    bonus: $(attributes.melee.attack)
  damage:
    dice:
      count: 1
      sides: 4
      bonus: $(attributes.melee.bonus)
    type: slashing
  target:
    type: single
    range: 5 feet
