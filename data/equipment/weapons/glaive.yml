id: glaive
name: Glaive
type: Activity
time: action
range: 5 feet
duration: instantaneous
tags:
  - martial
  - melee
  - graze
  - twoHanded
  - weaponAttack
  - slashingDamage
  - glaive
description: >-
  You strike with your Glaive. Make a $(formatBonus(attributes.melee.attack))
  attack against the target. On a hit, the target takes damage.
mechanic:
  pattern: attack
  attack:
    classification: melee
    type: weapon
    bonus: $(attributes.melee.attack)
  damage:
    dice:
      count: 1
      sides: 10
      bonus: $(attributes.melee.bonus)
    type: slashing
  target:
    type: single
    range: 5 feet
