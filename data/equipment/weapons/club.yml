id: club
name: Club
type: Activity
time: action
range: 5 feet
duration: instantaneous
tags:
  - simple
  - melee
  - slow
  - light
  - weaponAttack
  - bludgeoningDamage
  - club
description: >-
  You strike with your Club. Make a $(formatBonus(attributes.melee.attack))
  attack against the target. On a hit, the target takes damage.
mechanic:
  pattern: attack
  attack:
    classification: melee
    type: weapon
    bonus: $(attributes.melee.attack)
  damage:
    dice:
      count: 1
      sides: 4
      bonus: $(attributes.melee.bonus)
    type: bludgeoning
  target:
    type: single
    range: 5 feet
