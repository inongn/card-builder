id: masteryProperties
name: Mastery Properties
type: Folder
children:
  - type: Effect
    target: activities[tags=weaponAttack AND tags=graze ].mechanic.miss
    operation: push
    value:
      type: damage
      dice: $(attributes.prof)
    id: graze
    name: Graze
  - type: Effect
    target: activities[tags=weaponAttack AND tags=slow ].mechanic.hit
    operation: push
    value:
      type: statModifier
      stat: speed
      value: -10
      operation: add
    id: slow
    name: Slow
  - type: Effect
    target: activities[tags=weaponAttack AND tags=nick ].mechanic.hit
    operation: push
    value:
      type: action
      actionType: attack
      attackFilter:
        classification: light
    id: nick
    name: Nick
  - type: Effect
    target: activities[tags=weaponAttack AND tags=cleave].mechanic.hit
    operation: push
    value:
      type: action
      actionType: attack
      count: 1
    id: cleave
    name: Cleave
  - type: Effect
    target: activities[tags=weaponAttack AND tags=push ].mechanic.hit
    operation: push
    value:
      type: movement
      movementType: forced
      direction: push
      distance: 10
    id: push
    name: Push
  - type: Effect
    target: activities[tags=weaponAttack AND tags=topple ].mechanic
    operation: push
    value:
      pattern: save
      name: Topple
      save:
        ability: con
        dc: '$(Math.max(8 + attributes.prof + stats.str.mod, 8 + attributes.prof + stats.dex.mod))'
      target:
        inherit: trigger
      failure:
        type: condition
        condition: prone
    id: topple
    name: Topple
  - type: Effect
    target: activities[tags=weaponAttack AND tags=sap ].mechanic.hit
    operation: push
    value:
      type: rollModifier
      modifierType: disadvantage
      targetRolls: attack
    id: sap
    name: Sap
  - type: Effect
    target: activities[tags=weaponAttack AND tags=vex ].mechanic.hit
    operation: push
    value:
      type: rollModifier
      modifierType: advantage
      targetRolls: attack
    id: vex
    name: Vex