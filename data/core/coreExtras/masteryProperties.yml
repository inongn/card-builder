id: masteryProperties
name: Mastery Properties
type: Folder
children:
  - type: Extra
    target: weaponAttack AND graze AND (pactWeapon OR weaponMastery)
    id: graze
    name: Graze
    description: "On a miss, deal $(attributes.prof) Damage."
  - type: Extra
    target: weaponAttack AND slow AND (pactWeapon OR weaponMastery)
    id: slow
    name: Slow
    description: "The target's speed is reduced by 10 feet."
  - type: Extra
    target: weaponAttack AND nick AND (pactWeapon OR weaponMastery)
    id: nick
    name: Nick
    description: "You can make the additional attack of the Light property as part of the Attack action instead of as a Bonus Action."
  - type: Extra
    target: weaponAttack AND cleave AND (pactWeapon OR weaponMastery)
    id: cleave
    name: Cleave
    description: "You can make another attack against a second creature within 5 feet of the first that is also within your reach."
  - type: Extra
    target: weaponAttack AND push AND (pactWeapon OR weaponMastery)
    id: push
    name: Push
    description: "Push the target up to 10 feet straight away from yourself."
  - type: Extra
    target: weaponAttack AND topple AND (pactWeapon OR weaponMastery)
    id: topple
    name: Topple
    description: "The target has the Prone condition."
  - type: Extra
    target: weaponAttack AND sap AND (pactWeapon OR weaponMastery)
    id: sap
    name: Sap
    description: "The target has Disadvantage on its next attack roll before the start of your next turn."
  - type: Extra
    target: weaponAttack AND vex AND (pactWeapon OR weaponMastery)
    id: vex
    name: Vex
    description: "You have Advantage on your next attack roll against the target before the end of your next turn."