id: spirits
name: College of Spirits
description: |
  Bards of the College of Spirits commune with the spirits of the past, channeling their stories and wisdom to perform wondrous magic.
type: Folder
tags:
  - bardSubclass
children:
  - id: subclassName
    type: Effect
    target: meta.sub
    operation: set
    value: "Spirits"

  # Level 3: Channeler
  - type: Reference
    target: guidance
    condition: $(meta.level >= 3)
    overwrite:
      range: 60 feet

  # Level 3: Spirits from Beyond
  - id: spiritsFromBeyond
    type: Extra
    target: bardicInspiration
    condition: $(meta.level >= 3)
    name: "Spirits from Beyond"
    description: "You call forth the powers of a random spirit. To determine the spirit you channel, roll the Bardic Inspiration die and refer to the Spirits from Beyond table. The spirit remains channeled until you unleash it or until you finish a Short or Long Rest."

  - id: spiritChanneling
    type: Activity
    name: Spirit Channeling
    time: bonus action
    range: self
    resource: bardicInspiration
    condition: $(meta.level >= 3)
    description: |
      You channel a specific spirit. Choose a spirit from the Spirits from Beyond table rather than rolling. The chosen spirit's corresponding number must be less than or equal to the highest number on your Bardic Inspiration die. You can unleash the spirit as a Magic Action.

      **Spirits from Beyond Table:**
      * **1. Beloved.** The target regains Hit Points equal to 1d$(attributes.bardicDie) + $(stats.cha.mod).
      * **2. Sharpshooter.** The target takes Force damage equal to 1d$(attributes.bardicDie) + $(stats.cha.mod).
      * **3. Avenger.** Until the end of your next turn, any creature that hits the target with a melee attack roll takes Force damage equal to 1d$(attributes.bardicDie).
      * **4. Renegade.** The target can immediately take a Reaction to teleport up to 30 feet to an unoccupied space it can see.
      * **5. Fortune Teller.** The target has Advantage on D20 Tests until the start of your next turn.
      * **6. Wayfarer.** The target gains Temporary Hit Points equal to 1d$(attributes.bardicDie) + $(meta.level). While it has these, its Speed increases by 10 feet.
      * **7. Trickster.** The target makes a DC $(attributes.spellcasting.save) Wisdom saving throw. On a failure, it takes Psychic damage equal to 2d$(attributes.bardicDie) and is Charmed until the start of your next turn. On a success, it takes half damage only.
      * **8. Shade.** The target has the Invisible condition until the end of its next turn or until it attacks, deals damage, or casts a spell. When the invisibility ends, each creature in a 5-foot Emanation must succeed on a DC $(attributes.spellcasting.save) Constitution saving throw or take Necrotic damage equal to 2d$(attributes.bardicDie).
      * **9. Arsonist.** The target makes a DC $(attributes.spellcasting.save) Dexterity saving throw, taking Fire damage equal to 4d$(attributes.bardicDie) on a failure, or half damage on a success.
      * **10. Coward.** The target and each creature of your choice in a 30-foot Emanation must succeed on a DC $(attributes.spellcasting.save) Wisdom saving throw or have the Frightened condition until the start of your next turn. While Frightened, its Speed is halved and it can only take either an action or a Bonus Action on its turn, not both.
      * **11. Brute.** Each creature of your choice in a 30-foot Emanation makes a DC $(attributes.spellcasting.save) Strength saving throw. On a failure, it takes Thunder damage equal to 3d$(attributes.bardicDie) and is Prone. On a success, it takes half damage only.
      * **12. Priest.** The target regains Hit Points equal to 2d$(attributes.bardicDie), and one of these conditions of your choice ends on it: Blinded, Charmed, Deafened, Paralyzed, Poisoned, or Stunned.

  # Level 6: Empowered Channeling
  - id: powerFromBeyondDamage
    type: Extra
    target: damageSpell
    condition: $(meta.level >= 6)
    name: "Power from Beyond"
    description: "Once per turn, you gain a 1d6 bonus to the spell's damage roll."

  - id: powerFromBeyondHealing
    type: Extra
    target: healingSpell
    condition: $(meta.level >= 6)
    name: "Power from Beyond"
    description: "Once per turn, you gain a 1d6 bonus to the spell's healing roll."

  # Level 6: Spiritual Manifestation
  - type: Reference
    target: [spiritGuardians]
    condition: $(meta.level >= 6)
