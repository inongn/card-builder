id: valor
name: College of Valor
description: Sing tales of the mighty in combat, preserving the memories of great heroes as a daring storyteller.
type: Folder
tags:
  - bardSubclass
children:
  - id: combatInspirationExtra
    type: Effect
    name: Combat Inspiration
    target: activities[id=bardicInspiration].mechanic
    operation: push
    value:
      pattern: automatic
      text: "Defense: when hit by an attack roll, the target can use a Reaction to roll the die and add the result to AC. Offense: when hitting with an attack roll, the target can use a Reaction to roll the die and add the result to the damage roll."
    condition: $(meta.level >= 3)
  - type: Reference
    condition: $(meta.level >= 3)
    target:
      - martialWeaponProficiency
      - mediumArmorTraining
      - shieldTraining
  - type: Reference
    target:
      - extraAttack
    condition: $(meta.level >= 5)
