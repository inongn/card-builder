id: circleOfTheLand
name: Circle of the Land
description: Safeguard ancient knowledge and rites as a mystic and sage, whispering primal secrets in Druidic.
tags:
  - druidSubclass
type: Folder
children:
  - id: circleOfTheLandType
    type: Slot
    name: Land Type
    quantity: 1
    target: circleLand OR classOption
  - id: landsAid
    type: Activity
    duration: instantaneous
    name: Land's Aid
    time: action
    range: 60 feet
    resource: wildShape
    mechanic:
      mode: succession
      blocks:
        - pattern: save
          save:
            ability: con
            dc: $(attributes.spellcasting.save)
          target:
            type: area
            aoe:
              shape: sphere
              size: 10
            range: $(range)
          failure:
            type: damage
            dice:
              count: '$(meta.level >= 14 ? 4 : meta.level >= 10 ? 3 : 2)'
              sides: 6
            damageType: necrotic
          success:
            halfDamage: true
        - pattern: healing
          healing:
            dice:
              count: '$(meta.level >= 14 ? 4 : meta.level >= 10 ? 3 : 2)'
              sides: 6
              bonus: 0
            type: hitPoints
          target:
            type: single
            filter: creature of your choice in the area
