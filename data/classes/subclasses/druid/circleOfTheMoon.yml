id: circleOfTheMoon
name: Circle of the Moon
description: Draw on lunar magic to transform yourself into various beasts, changeable and powerful as the moon.
type: Folder
tags:
  - druidSubclass
children:
  - type: Reference
    target:
      - cureWounds
      - moonbeam
      - starryWisp
    condition: $(meta.level >= 3)
  - type: Reference
    target:
      - conjureAnimals
    condition: $(meta.level >= 5)
  - type: Reference
    target:
      - fountOfMoonlight
    condition: $(meta.level >= 7)
  - id: lunarWildShape
    type: Slot
    name: Lunar Wild Shape
    quantity: '$(meta.level >= 8 ? 8 : meta.level >= 4 ? 6 : 4)'
    target: classOption OR lunarWildShape
    condition: $(meta.level >= 3)
  - id: moonCircleFormsTHP
    type: Effect
    target: activities[id=wildShapeActivity].mechanic.healing.dice.bonus
    operation: set
    value: $(meta.level * 3)
    condition: $(meta.level >= 3)
  - id: lunarRadianceBPS
    type: Effect
    target: statblocks[tags=lunarWildShape OR tags=wildShapeTemplate].actions["Bludgeoning, Piercing, or Slashing damage"]
    operation: replace
    value: Radiant damage
    condition: $(meta.level >= 6)
  - id: lunarRadianceBPSNoOxford
    type: Effect
    target: statblocks[tags=lunarWildShape OR tags=wildShapeTemplate].actions["Bludgeoning, Piercing or Slashing damage"]
