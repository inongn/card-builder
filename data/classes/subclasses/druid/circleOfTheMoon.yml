id: circleOfTheMoon
name: Circle of the Moon
description: Draw on lunar magic to transform yourself into various beasts, changeable and powerful as the moon.
type: Folder
tags:
  - druidSubclass
children:
  - type: Reference
    target:
      - cureWounds
      - moonbeam
      - starryWisp
    condition: $(meta.level >= 3)
  - type: Reference
    target:
      - conjureAnimals
    condition: $(meta.level >= 5)
  - type: Reference
    target:
      - fountOfMoonlight
    condition: $(meta.level >= 7)
  - id: lunarWildShape
    type: Slot
    name: Lunar Wild Shape
    quantity: '$(meta.level >= 8 ? 8 : meta.level >= 4 ? 6 : 4)'
    target: classOption OR lunarWildShape
    condition: $(meta.level >= 3)
  - id: moonCircleFormsTHP
    type: Effect
    target: activities[id=wildShapeActivity].mechanic.healing.dice.bonus
    operation: set
    value: $(meta.level * 3)
    condition: $(meta.level >= 3)
  # Structured beast forms: only Bludgeoning/Piercing/Slashing hit payloads change to Radiant
  # (e.g. the Crawler's Poison payload is untouched).
  - id: lunarRadianceStrike
    type: Effect
    target: statblocks[tags=lunarWildShape OR tags=wildShapeTemplate].actions[id=bestialStrike].mechanic.hit[damageType=bludgeoning OR damageType=piercing OR damageType=slashing].damageType
    operation: set
    value: radiant
    condition: $(meta.level >= 6)
