id: circleOfTheStars
name: Circle of the Stars
description: Track heavenly patterns to discover cosmic secrets, harnessing the power of constellations.
type: Folder
tags:
  - druidSubclass
children:
  - type: Reference
    target:
      - guidance
    condition: $(meta.level >= 3)
  - id: starMap
    type: Reference
    target:
      - guidingBolt
    condition: $(meta.level >= 3)
    overwrite:
      resource: starMap
  - id: starMap
    type: Resource
    name: Star Map
    quantity: $(Math.max(1, stats.wis.mod))
    condition: $(meta.level >= 3)
  - id: starryForm
    type: Activity
    range: self
    name: Starry Form
    time: bonus action
    duration: 10 minutes
    resource: wildShape
    description: |
      You take on a starry form. While in your starry form, you retain your game statistics, but your body becomes luminous, your joints glimmer like stars, and glowing lines connect them as on a star chart. This form sheds Bright Light in a 10-foot radius and Dim Light for an additional 10 feet.

      Whenever you assume your starry form, choose which of the following constellations glimmers on your body; your choice gives you certain benefits while in the form.

      **Archer.** You hurl a mote of light at a creature or object within range. Make a $(formatBonus(attributes.spellcasting.attack)) attack against the target. On a hit, the target takes $(meta.level >= 10 ? 2 : 1)d8$(formatBonus(stats.wis.mod)) Radiant damage. You can repeat this attack as a Bonus Action while the form lasts.

      **Chalice.** When you cast a healing spell with a slot, you or creature within 30 feet regains $(meta.level >= 10 ? 2 : 1)d8$(formatBonus(stats.wis.mod)) HP.

      **Dragon.** When you make an Intelligence or a Wisdom check or a Constitution saving throw to maintain Concentration, you can treat a roll of 9 or lower on the d20 as a 10. $(meta.level >= 10 ? "You have a Fly Speed of 20 feet and can hover." : "")
    mechanic:
      mode: choice
      text: "You take on one of the following forms. This form sheds Bright Light in a 10-foot radius and Dim Light for an additional 10 feet."
      blocks:
        - pattern: attack
          name: Archer
          attack:
            classification: ranged
            type: spell
            bonus: $(attributes.spellcasting.attack)
          target:
            type: single
            range: 60 feet
          hit:
            type: damage
            dice:
              count: '$(meta.level >= 10 ? 2 : 1)'
              sides: 8
              bonus: $(stats.wis.mod)
            damageType: radiant
          repeat: bonus_action
        - pattern: healing
          name: Chalice
          trigger:
            event: cast_spell
            text: When you cast a healing spell with a spell slot
          target:
            type: single
            range: 30 feet
          healing:
            dice:
              count: '$(meta.level >= 10 ? 2 : 1)'
              sides: 8
              bonus: $(stats.wis.mod)
            type: hitPoints
        - pattern: automatic
          name: Dragon
          text: When making an Intelligence or Wisdom check or a Constitution saving throw for Concentration, treat a roll of 9 or lower on the d20 as a 10
    condition: $(meta.level >= 3)
  - id: cosmicOmen
    type: Activity
    duration: instantaneous
    name: Cosmic Omen
    time: reaction
    range: 30 feet
    resource: cosmicOmen
    description: |
      When you finish a Long Rest, you consult your Star Map for omens and roll a die. Until you finish your next Long Rest, you gain access to a special Reaction based on whether you rolled an even or an odd number on the die:

      **Weal (Even).** When a creature is about to make a D20 Test, roll 1d6 and add it to the total.

      **Woe (Odd).** When a creature is about to make a D20 Test, roll 1d6 and subtract it from the total.
    mechanic:
      mode: choice
      text: When you finish a Long Rest, you consult your Star Map for omens and roll a die. Until you finish your next Long Rest, you gain access to a special Reaction based on whether you rolled an even or an odd number on the die.
      blocks:
        - pattern: automatic
          name: Weal (Even)
          target:
            inherit: trigger
          payloads:
            - type: rollModifier
              modifierType: add
              dice:
                count: 1
                sides: 6
              targetRolls:
                - attack
                - check
                - save
        - pattern: automatic
          name: Woe (Odd)
          target:
            inherit: trigger
          payloads:
            - type: rollModifier
              modifierType: subtract
              dice:
                count: 1
                sides: 6
              targetRolls:
                - attack
                - check
                - save
    condition: $(meta.level >= 6)
  - id: cosmicOmen
    type: Resource
    name: Cosmic Omen
    quantity: $(Math.max(1, stats.wis.mod))
    condition: $(meta.level >= 6)
