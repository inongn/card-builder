id: champion
name: Champion
description: Focus on martial prowess and relentless pursuit of victory to deal devastating blows and garner glory.
tags:
  - fighterSubclass
type: Folder
children:
  - id: improvedCritical
    name: Improved Critical
    type: Trait
    description: You score a Critical Hit on a roll of 19 or 20. Then, you can move $(Math.floor(attributes.movement.walk / 2 / 5) * 5) feet.
    condition: $(meta.level >= 3)
  - type: Reference
    target:
      - initiativeAdvantage
      - athleticsAdvantage
    condition: $(meta.level >= 3)
  - id: additionalFightingStyle
    name: Additional Fighting Style
    type: Slot
    target: fightingStyle
    condition: $(meta.level >= 7)
    quantity: 1
