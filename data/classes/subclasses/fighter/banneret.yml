id: banneret
name: Banneret
description: Rally allies to fight against evil as a paragon of valor, utilizing inspiring presence and diplomacy.
type: Folder
tags:
  - fighterSubclass
children:
  - type: Reference
    target:
      - comprehendLanguages
      - chaCaster
    condition: $(meta.level >= 3)
    overwrite:
      time: 10 minutes
  - id: wellSpokenSkill
    name: Well Spoken Skill Proficiency
    type: Slot
    target: insightProficiency OR intimidationProficiency OR persuasionProficiency OR performanceProficiency
    quantity: 1
    condition: $(meta.level >= 3)
  - id: groupRecoveryEffect
    type: Effect
    name: Group Recovery
    target: activities[id=secondWind].mechanic
    operation: push
    value:
      pattern: healing
      target:
        type: multiple
        count: $(Math.max(1, stats.cha.mod))
        range: 30 feet
        filter: allies
      healing:
        dice:
          count: 1
          sides: 4
          bonus: $(meta.level)
        type: hitPoints
    condition: $(meta.level >= 3)
  - id: teamTacticsEffect
    type: Effect
    name: Team Tactics
    target: activities[id=secondWind].mechanic
    operation: push
    value:
      pattern: automatic
      text: Each chosen ally has Advantage on D20 Tests until the start of your next turn
    condition: $(meta.level >= 7)
