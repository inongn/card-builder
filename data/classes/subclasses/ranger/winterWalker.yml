id: winterWalker
name: Winter Walker
description: Thrive in frozen tundras, channeling frost and rime to shield yourself and paralyze your prey.
tags:
  - rangerSubclass
type: Folder
children:
  - type: Reference
    target:
      - iceKnife
  - type: Reference
    condition: $(meta.level >= 5)
    target:
      - holdPerson
  - id: bitingCold
    type: Trait
    name: Biting Cold
    description: Your Cold damage ignores Resistance to Cold damage.
  - id: frostResistance
    type: Reference
    target: coldResistance
  - id: polarStrikes
    type: Effect
    name: Polar Strikes
    target: activities[tags=weaponAttack].mechanic.hit
    operation: push
    value:
      type: damage
      dice:
        count: 1
        sides: '$(meta.level >= 11 ? 6 : 4)'
      damageType: cold
  - id: huntersRimeHeal
    type: Effect
    name: Hunter's Rime
    target: activities[id=huntersMark].mechanic
    operation: push
    value:
      pattern: healing
      healing:
        dice:
          count: 1
          sides: 10
          bonus: $(meta.level)
        type: tempHitPoints
      target:
        type: self
  - id: huntersRimeDisengage
    type: Effect
    target: activities[id=huntersMark].mechanic.payloads
    operation: push
    value:
      type: text
      text: the marked creature can't take the Disengage action
  - id: fortifyingSoul
    type: Activity
    duration: instantaneous
    name: Fortifying Soul
    time: action
    range: self
    uses: 1
    description: You bolster your allies in addition to yourself. Choose up to $(Math.max(1, stats.wis.mod)) creatures you can see. Each chosen creature regains 1d10+$(meta.level) Hit Points and has Advantage on saving throws to avoid or end the Frightened condition for 1 hour.
    mechanic:
      pattern: healing
      healing:
        dice:
          count: 1
          sides: 10
          bonus: $(meta.level)
        type: hitPoints
      target:
        type: multiple
        range: self
    condition: $(meta.level >= 7)
