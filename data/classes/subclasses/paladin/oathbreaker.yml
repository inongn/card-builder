id: oathbreaker
name: Oathbreaker
description: Break your sacred vows to pursue dark ambitions, extinguishing the light in your heart for demonic power.
tags:
  - paladinSubclass
type: Folder
children:
  - type: Reference
    target:
      - hellishRebuke
      - witchBolt
  - type: Reference
    condition: $(meta.level >= 5)
    target:
      - crownOfMadness
      - darkness
  - type: Reference
    condition: $(meta.level >= 9)
    target:
      - fear
      - summonUndead
  - type: Reference
    condition: $(meta.level >= 13)
    target:
      - blight
      - phantasmalKiller
  - type: Reference
    condition: $(meta.level >= 17)
    target:
      - contagion
      - steelWindStrike
  - id: conjureUndead
    type: Activity
    duration: instantaneous
    range: self
    name: Conjure Undead
    time: bonus action
    resource: channelDivinity
    description: You summon $(Math.max(1, Math.ceil(stats.cha.mod / 2))) Undead (Skeleton or Zombie). They appear within 30 feet, share your Initiative count taking their turn immediately after yours, obey your verbal commands, and last for 1 minute or until dissolved.
    mechanic:
      pattern: automatic
      target:
        type: self
      payloads:
        type: text
        text: summon $(Math.max(1, Math.ceil(stats.cha.mod / 2))) Undead (Skeleton or Zombie) within 30 feet that obey your verbal commands for 1 minute
  - type: Reference
    target:
      - skeleton
      - zombie
    condition: $(meta.level >= 3)
  - id: dreadfulAspect
    type: Activity
    time: free action
    range: self
    name: Dreadful Aspect
    resource: channelDivinity
    duration: 1 minute
    description: Immediately after you cast Divine Smite, you cause each chosen creature in a 30-foot Emanation to make a DC $(attributes.spellcasting.save) Wisdom saving throw or have the Frightened condition for the duration (repeating save at end of each of its turns).
    mechanic:
      pattern: save
      trigger:
        text: Immediately after you cast Divine Smite
      save:
        ability: wis
        dc: $(attributes.spellcasting.save)
      target:
        type: area
        aoe:
          shape: emanation
          size: 30
        range: $(range)
      failure:
        type: condition
        condition: frightened
        end: turn_repeat_save
  - id: auraOfHate
    type: Effect
    name: Aura of Hate
    target: activities[id=auraOfProtection].mechanic.payloads
    operation: push
    condition: $(meta.level >= 7)
    value:
      type: text
      text: deal an extra $(stats.cha.mod) Necrotic damage on melee attack hits (you and friendly Fiends and Undead in the aura)
