id: oathOfGenies
name: Oath of the Noble Genies
description: Pledge to noble Genies, channeling ancient elemental magic and wielding divine, elementally-infused armor.
tags:
  - paladinSubclass
type: Folder
children:
  - type: Reference
    target:
      - chromaticOrb
      - elementalism
      - thunderousSmite
  - type: Reference
    condition: $(meta.level >= 5)
    target:
      - mirrorImage
      - phantasmalForce
  - type: Reference
    condition: $(meta.level >= 9)
    target:
      - fly
      - gaseousForm
  - type: Reference
    condition: $(meta.level >= 13)
    target:
      - conjureMinorElementals
      - summonElemental
  - type: Reference
    condition: $(meta.level >= 17)
    target:
      - banishingSmite
      - contactOtherPlane
  - id: elementalSmite
    type: Activity
    time: free action
    duration: instantaneous
    range: self
    name: Elemental Smite
    resource: channelDivinity
    description: |
      Immediately after you cast Divine Smite, you invoke one of the following effects:
      * **Dao's Crush:** Earth rises up around the target of your Divine Smite. The target has the Grappled condition (escape DC $(attributes.spellcasting.save)). While Grappled, the target has the Restrained condition.
      * **Djinni's Escape:** You teleport to an unoccupied space within 30 feet and take on a semi-incorporeal form until the end of your next turn (Resistance to Bludgeoning, Piercing, Slashing damage; Immunity to Grappled, Prone, Restrained).
      * **Efreeti's Fury:** Target takes an extra 2d4 Fire damage, and fire jumps to another creature within 30 feet, dealing 2d4 Fire damage to it.
      * **Marid's Surge:** Target and each creature in a 10-foot Emanation make a DC $(attributes.spellcasting.save) Strength save or be pushed 15 feet away and have the Prone condition.
    mechanic:
      mode: choice
      trigger:
        text: Immediately after you cast Divine Smite
      blocks:
        - pattern: save
          name: "Dao's Crush"
          save:
            ability: str
            dc: $(attributes.spellcasting.save)
          target:
            inherit: trigger
          failure:
            - type: condition
              condition: grappled
              end: action_check

            - type: condition
              condition: restrained
              end: action_check

        - pattern: automatic
          name: "Djinni's Escape"
          target:
            type: self
          payloads:
            - type: text
              text: teleport to an unoccupied space within 30 feet and gain Resistance to Bludgeoning, Piercing, and Slashing damage, and Immunity to the Grappled, Prone, and Restrained conditions until the end of your next turn
        - pattern: automatic
          name: "Efreeti's Fury"
          target:
            inherit: trigger
          payloads:
            - type: damage
              dice:
                count: 2
                sides: 4
              damageType: fire
            - type: text
              text: fire jumps to another creature within 30 feet, dealing 2d4 Fire damage to it
        - pattern: save
          name: "Marid's Surge"
          save:
            ability: str
            dc: $(attributes.spellcasting.save)
          target:
            type: area
            aoe:
              shape: emanation
              size: 10
            range: $(range)
          failure:
            - type: movement
              movementType: forced
              direction: push
              distance: 15
            - type: condition
              condition: prone
  - id: geniesSplendorAC
    type: Effect
    target: attributes.ac.base
    operation: override
    condition: $(attributes.armor.type == 'none')
    value: $(10 + stats.dex.mod + stats.cha.mod)
  - id: geniesSplendorSkill
    type: Slot
    name: Genie's Splendor Skill
    quantity: 1
    target: skill AND (id == 'acrobatics' OR id == 'intimidation' OR id == 'performance' OR id == 'persuasion')
  - id: auraOfElementalShielding
    type: Effect
    name: Aura of Elemental Shielding
    target: activities[id=auraOfProtection].mechanic.payloads
    operation: push
    condition: $(meta.level >= 7)
    value:
      type: text
      text: have Resistance to one damage type of your choice (Acid, Cold, Fire, Lightning, or Thunder); you can change the type at the start of each of your turns
