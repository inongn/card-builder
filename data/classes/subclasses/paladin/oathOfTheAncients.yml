id: oathOfTheAncients
name: Oath of the Ancients
description: Cherish the light, loving the beautiful and life-giving things of the world above all other principles.
tags:
  - paladinSubclass
type: Folder
children:
  - id: naturesWrath
    type: Activity
    name: Nature's Wrath
    time: action
    range: 15 feet
    duration: 1 minute
    resource: channelDivinity
    description: You conjure spectral vines around nearby creatures. Each creature of your choice that you can see within range must succeed on a DC $(attributes.spellcasting.save) Strength saving throw or have the Restrained condition for 1 minute. A Restrained creature repeats the save at the end of each of its turns, ending the effect on a success.
    mechanic:
      pattern: save
      save:
        ability: str
        dc: $(attributes.spellcasting.save)
      target:
        type: multiple
        range: $(range)
      failure:
        type: condition
        condition: restrained
        end: turn_repeat_save
  - type: Reference
    target:
      - ensnaringStrike
      - speakWithAnimals
  - type: Reference
    target:
      - mistyStep
      - moonbeam
    condition: $(meta.level >= 5)
  - type: Reference
    target:
      - plantGrowth
      - protectionFromEnergy
    condition: $(meta.level >= 9)
  - type: Reference
    target:
      - iceStorm
      - stoneskin
    condition: $(meta.level >= 13)
  - type: Reference
    target:
      - communeWithNature
      - treeStride
    condition: $(meta.level >= 17)
  - id: auraOfWarding
    type: Effect
    name: Aura of Warding
    target: activities[id=auraOfProtection].mechanic.payloads
    operation: push
    condition: $(meta.level >= 7)
    value:
      type: text
      text: have Resistance to Necrotic, Psychic, and Radiant damage
