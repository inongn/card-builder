id: scion
name: Scion
description: |
  Scions channel the power of the Dead Three—Bane, Bhaal, and Myrkul—through their blades, becoming ruthless killers who thrive on bloodshed. Their allegiance shifts with their needs, drawing on whichever dark patron's gifts suit the moment.
tags:
  - rogueSubclass
type: Folder
children:
  - id: subclassName
    type: Effect
    target: meta.sub
    operation: set
    value: "Scion"

  # Level 3: Bloodthirst — Resource
  - id: bloodthirst
    name: Bloodthirst
    type: Resource
    quantity: "$(Math.max(1, stats.int.mod))"

  # Level 3: Bloodthirst — Activity
  - id: bloodthirst
    type: Activity
    name: Bloodthirst
    time: reaction
    range: 30 feet
    duration: Instantaneous
    resource: bloodthirst
    description: |
      When an enemy you can see within range takes damage and is Bloodied (at or below half its Hit Point maximum) after taking that damage but is not killed, you teleport to an unoccupied space you can see within 5 feet of that enemy. You can then make one melee attack against it.

  # Level 3: Dread Allegiance — Slot (choose Bane, Bhaal, or Myrkul)
  - id: dreadAllegiance
    name: Dread Allegiance
    type: Slot
    target: dreadAllegiance