id: thief
name: Thief
description: Mix burglary and exploration, gaining abilities to delve into ruins and maximize magic item benefits.
tags:
  - rogueSubclass
type: Folder
children:
  - id: fastHands
    type: Activity
    name: Fast Hands
    time: bonus action
    range: self
    duration: Instantaneous
    mechanic:
      mode: choice
      text: "You do one of the following:"
      blocks:
        - pattern: automatic
          name: Sleight of Hand
          target:
            type: self
          payloads:
            text: "make a Dexterity (Sleight of Hand) check to pick a lock or disarm a trap with Thieves' Tools or to pick a pocket"
        - pattern: automatic
          name: Use an Object
          target:
            type: self
          payloads:
            text: "take the Utilize action, or take the Magic action to use a magic item that requires an action"
  - id: secondStoryWorkClimber
    type: Effect
    name: Climber
    target: attributes.movement.climb
    operation: set
    value: $(attributes.movement.walk)
