id: fiendPatron
name: Fiend Patron
description: Draw power from the Lower Planes, forging a dark bargain with a demon lord or archdevil.
tags:
  - warlockSubclass
type: Folder
children:
  - type: Reference
    target:
      - burningHands
      - command
      - scorchingRay
      - suggestion
    condition: $(meta.level >= 3)
  - type: Reference
    target:
      - fireball
      - stinkingCloud
    condition: $(meta.level >= 5)
  - type: Reference
    target:
      - fireShield
      - wallOfFire
    condition: $(meta.level >= 7)
  - type: Reference
    target:
      - geas
      - insectPlague
    condition: $(meta.level >= 9)
  - id: darkOnesBlessing
    type: Activity
    range: self
    name: Dark One's Blessing
    time: free action
    duration: instantaneous
    description: When you reduce an enemy to 0 Hit Points, you gain $(meta.level + stats.cha.mod) Temporary Hit Points. You also gain this benefit if someone else reduces an enemy within 10 feet of you to 0 Hit Points.
    mechanic:
      pattern: healing
      trigger:
        event: drop_enemy_zero
      target:
        type: self
      healing:
        type: tempHitPoints
        dice:
          count: 0
          sides: 0
          bonus: $(meta.level + stats.cha.mod)
    condition: $(meta.level >= 3)
  - id: darkOnesOwnLuck
    type: Activity
    duration: instantaneous
    range: self
    name: Dark One's Own Luck
    time: free action
    resource: darkOnesOwnLuck
    description: You call on your fiendish patron to alter fate in your favor. When you make an ability check or a saving throw, you can use this feature to add 1d10 to your roll. You can do so after seeing the roll but before any of the roll's effects occur.
    mechanic:
      pattern: automatic
      trigger:
        event: [make_check, make_save]
      target:
        type: self
      payloads:
        - type: text
          text: add 1d10 to your roll (you can do so after seeing the roll but before any of the roll's effects occur)
    condition: $(meta.level >= 6)
  - id: darkOnesOwnLuck
    type: Resource
    name: Dark One's Own Luck
    quantity: $(Math.max(1, stats.cha.mod))
    condition: $(meta.level >= 6)
    sr: 0
