id: celestialPatron
name: Celestial Patron
description: Draw power from the Upper Planes, forging a pact with heavenly entities to wield light and healing.
tags:
  - warlockSubclass
type: Folder
children:
  - type: Reference
    target:
      - aid
      - cureWounds
      - guidingBolt
      - lesserRestoration
      - light
      - sacredFlame
    condition: $(meta.level >= 3)
  - type: Reference
    target:
      - daylight
      - revivify
    condition: $(meta.level >= 5)
  - type: Reference
    target:
      - guardianOfFaith
      - wallOfFire
    condition: $(meta.level >= 7)
  - type: Reference
    target:
      - greaterRestoration
      - summonCelestial
    condition: $(meta.level >= 9)
  - id: healingLight
    type: Activity
    duration: instantaneous
    name: Healing Light
    time: bonus action
    range: 60 feet
    resource: healingLight
    description: Heal yourself or a creature you can see. The target regains 1d6 Hit Points per charge expeded, up to a maximum of $(Math.min(1, stats.cha.mod))d6 Hit Points.
    mechanic:
      pattern: healing
      target:
        type: single
        range: 60 feet
      healing:
        dice:
          count: $(Math.min(1, stats.cha.mod))
          sides: 6
        type: hitPoints
      text: per charge expended
    condition: $(meta.level >= 3)
  - id: healingLight
    type: Resource
    name: Healing Light
    quantity: $(1 + meta.level)
    condition: $(meta.level >= 3)
    sr: 0
  - id: radiantSoulRes
    type: Reference
    target: radiantResistance
    condition: $(meta.level >= 6)
  - id: radiantSoulDamage
    type: Effect
    target: activities[tags=damageSpell AND (tags=radiantDamage OR tags=fireDamage)].mechanic.hit.dice.bonus
    operation: add
    value: $(stats.cha.mod)
    condition: $(meta.level >= 6)
