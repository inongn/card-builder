id: elements
name: Warrior of the Elements
description: Harness elemental power to shape strikes, manifest reaching tendrils, and unleash devastating bursts.
tags:
  - monkSubclass
type: Folder
children:
  - type: Reference
    target:
      - elementalism
      - wisCaster
  - id: elementalBurst
    type: Activity
    name: Elemental Burst
    time: action
    range: 120 feet
    duration: Instantaneous
    resource: 2 focusPoints
    description: You cause elemental energy to burst in a 20-foot-radius Sphere. Choose Acid, Cold, Fire, Lightning, or Thunder. Each creature in the Sphere must make a DC $(attributes.monkSaveDC) Dexterity saving throw, taking 3d$(attributes.martialArtsDie) damage of the chosen type on a failure or half as much on a success.
    mechanic:
      pattern: save
      save:
        ability: dex
        dc: $(attributes.monkSaveDC)
      target:
        type: area
        aoe:
          shape: sphere
          size: 20
        range: $(range)
      failure:
        type: damage
        dice:
          count: 3
          sides: $(attributes.martialArtsDie)
        damageType:
          - acid
          - cold
          - fire
          - lightning
          - thunder
      success:
        halfDamage: true
    condition: $(meta.level >= 6)
  - id: elementalAttunement
    type: Activity
    name: Elemental Attunement
    time: free action
    range: self
    duration: 10 minutes
    resource: 1 focusPoints
    description: |
      You imbue yourself with elemental energy. While active, gain the following benefits:

      **Reach**. Your Unarmed Strike reach is 5 feet greater than normal, as elemental energy extends from you.

      **Elemental Strikes**. You can cause Unarmed Strikes to deal your choice of Acid, Cold, Fire, Lightning, or Thunder damage. When you deal one of these types, force the target to make a DC $(attributes.monkSaveDC) Strength saving throw. On a failure, move the target up to 5 feet toward or away from you.
    mechanic:
      mode: sequence
      blocks:
        - pattern: automatic
          target:
            type: self
          payloads:
            - type: text
              text: Your Unarmed Strike reach is 5 feet greater than normal
            - type: text
              text: Unarmed Strikes can deal your choice of Acid, Cold, Fire, Lightning, or Thunder damage, and when you deal one of these damage types, the target is subject to the following saving throw
        - pattern: save
          save:
            ability: str
            dc: $(attributes.monkSaveDC)
          failure:
            type: movement
            movementType: forced
            distance: 5
            direction: push
          