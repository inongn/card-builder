id: openHand
name: Warrior of the Open Hand
description: Master unarmed combat with techniques to push, trip, and manipulate energy to protect against harm.
tags:
  - monkSubclass
type: Folder
children:
  - id: openHandTechnique
    type: Activity
    name: Open Hand Technique
    time: free action
    range: self
    duration: Instantaneous
    description: |
      Whenever you hit a creature with an attack granted by your Flurry of Blows, you can impose one of the following effects on that target.
    mechanic:
      mode: choice
      text: "Whenever you hit a creature with an attack granted by your Flurry of Blows, you can impose one of the following effects on that target:"
      blocks:
        - pattern: automatic
          name: Addle
          target:
            inherit: trigger
          payloads:
            type: text
            text: "can't make Opportunity Attacks until the start of its next turn"
        - pattern: save
          name: Push
          save:
            ability: str
            dc: $(attributes.monkSaveDC)
          target:
            inherit: trigger
          failure:
            type: movement
            movementType: forced
            direction: push
            distance: 15
        - pattern: save
          name: Topple
          save:
            ability: dex
            dc: $(attributes.monkSaveDC)
          target:
            inherit: trigger
          failure:
            type: condition
            condition: prone
  - id: wholenessOfBody
    type: Activity
    name: Wholeness of Body
    time: bonus action
    range: self
    duration: Instantaneous
    resource: wholenessOfBody
    description: You channel your inner healing energy. Regain 1d$(attributes.martialArtsDie)+$(stats.wis.mod) Hit Points.
    mechanic:
      pattern: healing
      healing:
        dice:
          count: 1
          sides: $(attributes.martialArtsDie)
          bonus: $(stats.wis.mod)
        type: hitPoints
      target:
        type: self
    condition: $(meta.level >= 6)
  - id: wholenessOfBody
    type: Resource
    name: Wholeness of Body
    quantity: $(Math.max(1, stats.wis.mod))
