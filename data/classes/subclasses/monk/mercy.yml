id: mercy
name: Warrior of Mercy
description: Manipulate life force as a masked wandering physician, acting as a faceless bringer of life and death.
tags:
  - monkSubclass
type: Folder
children:
  - type: Reference
    target:
      - insightProficiency
      - medicineProficiency
      - herbalismKit
  - id: handOfHarm
    type: Activity
    time: free action
    duration: instantaneous
    range: self
    name: Hand of Harm
    resource: 1 focusPoints
    description: 'Once per turn when you hit a creature with an Unarmed Strike and deal damage, you deal 1d$(attributes.martialArtsDie)+$(stats.wis.mod) extra Necrotic damage.$(meta.level >= 6 ? '' You can also give the target the Poisoned condition until the end of your next turn.'' : '''')'
    mechanic:
      pattern: automatic
      trigger:
        text: Once per turn when you hit a creature with an Unarmed Strike and deal damage
      target:
        inherit: trigger
      payloads:
        - type: damage
          dice:
            count: 1
            sides: $(attributes.martialArtsDie)
            bonus: $(stats.wis.mod)
          damageType: necrotic
        - type: condition
          condition: poisoned
          end: end_of_your_next_turn
  - id: handOfHealing
    type: Activity
    name: Hand of Healing
    time: action
    range: touch
    duration: Instantaneous
    resource: 1 focusPoints
    description: 'You touch a creature and restore 1d$(attributes.martialArtsDie)+$(stats.wis.mod) Hit Points to it.$(meta.level >= 6 ? '' You can also end one condition on the creature: Blinded, Deafened, Paralyzed, Poisoned, or Stunned.'' : '''')'
    mechanic:
      pattern: healing
      target:
        type: touch
      healing:
        dice:
          count: 1
          sides: $(attributes.martialArtsDie)
          bonus: $(stats.wis.mod)
        type: hitPoints
      payloads:
        - type: text
          text: "end one condition on the creature: Blinded, Deafened, Paralyzed, Poisoned, or Stunned"
