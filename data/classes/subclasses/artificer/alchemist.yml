id: alchemist
name: Alchemist
description: Combine reagents to produce magical effects, using creations to give life and to leech it away.
type: Folder
tags:
  - artificerSubclass
children:
  - type: Reference
    target:
      - alchemistsTools
      - herbalismKit
  - type: Reference
    target:
      - healingWord
      - rayOfSickness
    condition: $(meta.level >= 3)
  - type: Reference
    target:
      - flamingSphere
      - melfsAcidArrow
    condition: $(meta.level >= 5)
  - type: Reference
    target:
      - gaseousForm
      - massHealingWord
    condition: $(meta.level >= 9)
  - type: Reference
    target:
      - deathWard
      - vitriolicSphere
    condition: $(meta.level >= 13)
  - type: Reference
    target:
      - cloudkill
      - raiseDead
    condition: $(meta.level >= 17)
  - id: experimentalElixirResource
    name: Experimental Elixir
    type: Resource
    quantity: '$(meta.level >= 15 ? 5 : meta.level >= 9 ? 4 : meta.level >= 5 ? 3 : 2)'
  - type: Reference
    target:
      - experimentalElixir
  - type: Effect
    target: activities[(tags=damageSpell AND (tags=acidDamage OR tags=fireDamage OR tags=poisonDamage)) OR tags=healingSpell].description["d12"]
    operation: replace
    value: d12$(formatBonus(stats.int.mod))
    condition: $(meta.level >= 5)
  - type: Effect
    target: activities[(tags=damageSpell AND (tags=acidDamage OR tags=fireDamage OR tags=poisonDamage)) OR tags=healingSpell].description["d10"]
    operation: replace
    value: d10$(formatBonus(stats.int.mod))
    condition: $(meta.level >= 5)
  - type: Effect
    target: activities[(tags=damageSpell AND (tags=acidDamage OR tags=fireDamage OR tags=poisonDamage)) OR tags=healingSpell].description["d8"]
    operation: replace
    value: d8$(formatBonus(stats.int.mod))
    condition: $(meta.level >= 5)
  - type: Effect
    target: activities[(tags=damageSpell AND (tags=acidDamage OR tags=fireDamage OR tags=poisonDamage)) OR tags=healingSpell].description["d6"]
    operation: replace
    value: d6$(formatBonus(stats.int.mod))
    condition: $(meta.level >= 5)
  - type: Effect
    target: activities[(tags=damageSpell AND (tags=acidDamage OR tags=fireDamage OR tags=poisonDamage)) OR tags=healingSpell].description["d4"]
    operation: replace
    value: d4$(formatBonus(stats.int.mod))
    condition: $(meta.level >= 5)
