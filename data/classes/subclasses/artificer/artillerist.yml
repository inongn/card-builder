id: artillerist
name: Artillerist
description: Specialize in using magic to hurl energy, projectiles, and deadly explosions on the battlefield.
type: Folder
tags:
  - artificerSubclass
children:
  - type: Reference
    target:
      - woodcarversTools
      - martialWeaponProficiency
  - type: Reference
    target:
      - shield
      - thunderwave
    condition: $(meta.level >= 3)
  - type: Reference
    target:
      - scorchingRay
      - shatter
    condition: $(meta.level >= 5)
  - type: Reference
    target:
      - fireball
      - windWall
    condition: $(meta.level >= 9)
  - type: Reference
    target:
      - iceStorm
      - wallOfFire
    condition: $(meta.level >= 13)
  - type: Reference
    target:
      - coneOfCold
      - wallOfForce
    condition: $(meta.level >= 17)
  - type: Reference
    target:
      - eldritchCannonFlamethrower
    condition: $(meta.level >= 3)
  - type: Reference
    target:
      - eldritchCannonForceBallista
    condition: $(meta.level >= 3)
  - type: Reference
    target:
      - eldritchCannonProtector
    condition: $(meta.level >= 3)
  - type: Effect
    target: activities[(tags=artificer AND tags=damageSpell) OR thunderwave OR shatter OR scorchingRay].mechanic.damage.extraDice
    operation: push
    value:
      count: 1
      sides: 8
      bonus: 0
    condition: $(meta.level >= 5)
