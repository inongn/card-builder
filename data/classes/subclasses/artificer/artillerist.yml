id: artillerist
name: Artillerist
description: Specialize in using magic to hurl energy, projectiles, and deadly explosions on the battlefield.
type: Folder
tags:
  - artificerSubclass
children:
  - type: Reference
    target:
      - woodcarversTools
      - martialWeaponProficiency
  - type: Reference
    target:
      - shield
      - thunderwave
    condition: $(meta.level >= 3)
  - type: Reference
    target:
      - scorchingRay
      - shatter
    condition: $(meta.level >= 5)
  - type: Reference
    target:
      - fireball
      - windWall
    condition: $(meta.level >= 9)
  - type: Reference
    target:
      - iceStorm
      - wallOfFire
    condition: $(meta.level >= 13)
  - type: Reference
    target:
      - coneOfCold
      - wallOfForce
    condition: $(meta.level >= 17)
  - id: eldritchCannonFlamethrower
    type: Activity
    duration: instantaneous
    name: Flamethrower
    time: bonus action
    range: self
    description: |
      Your cannon exhales fire in a 15-foot Cone. Each creature in that area makes a DC $(attributes.spellcasting.save) Dexterity saving throw, taking $(meta.level >= 9 ? '3d8' : '2d8') Fire damage on a failed save or half as much on a successful one. Flammable objects in the Cone start burning.
    mechanic:
      pattern: save
      save:
        ability: dex
        dc: $(attributes.spellcasting.save)
        failure:
          damage:
            dice:
              count: '$(meta.level >= 9 ? 3 : 2)'
              sides: 8
            type: fire
        success:
          text: Half damage
      target:
        type: aoe
        aoe:
          shape: cone
          size: 15
    condition: $(meta.level >= 3)
  - id: eldritchCannonForceBallista
    type: Activity
    duration: instantaneous
    name: Force Ballista
    time: bonus action
    range: 120 feet
    description: |
      Make a $(formatBonus(stats.int.mod + attributes.prof)) attack originating from the cannon at one creature or object within range. On a hit, the target takes $(meta.level >= 9 ? '3d8' : '2d8') Force damage, and if the target is a creature, it is pushed up to 5 feet away from the cannon.
    mechanic:
      pattern: attack
      attack:
        classification: ranged
        type: spell
        bonus: $(attributes.spellcasting.attack)
      damage:
        dice:
          count: '$(meta.level >= 9 ? 3 : 2)'
          sides: 8
          bonus: 0
        type: force
      text: On hit, push target 5 feet away.
      target:
        type: single
        range: 120 feet
    condition: $(meta.level >= 3)
  - id: eldritchCannonProtector
    type: Activity
    duration: instantaneous
    name: Protector
    time: bonus action
    range: 10 feet
    description: |
      Your cannon emits a burst of positive energy that grants itself and each creature of your choice within range gains $(meta.level >= 9 ? '2d8' : '1d8')$(formatBonus(stats.int.mod)) Temporary Hit Points.
    mechanic:
      pattern: healing
      healing:
        dice:
          count: '$(meta.level >= 9 ? 2 : 1)'
          sides: 8
          bonus: $(stats.int.mod)
        type: tempHitPoints
      target:
        type: aoe
        aoe:
          shape: emanation
          size: 10
    condition: $(meta.level >= 3)
  - type: Effect
    target: activities[(tags=artificer AND tags=damageSpell) OR thunderwave OR shatter OR scorchingRay].mechanic.damage.extraDice
    operation: push
    value:
      count: 1
      sides: 8
      bonus: 0
    condition: $(meta.level >= 5)
