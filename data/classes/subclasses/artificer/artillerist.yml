id: artillerist
name: Artillerist
description: Specialize in using magic to hurl energy, projectiles, and deadly explosions on the battlefield.
type: Folder
tags:
  - artificerSubclass
children:
  - type: Reference
    target:
      - woodcarversTools
      - martialWeaponProficiency
  - type: Reference
    target:
      - shield
      - thunderwave
    condition: $(meta.level >= 3)
  - type: Reference
    target:
      - scorchingRay
      - shatter
    condition: $(meta.level >= 5)
  - type: Reference
    target:
      - fireball
      - windWall
    condition: $(meta.level >= 9)
  - type: Reference
    target:
      - iceStorm
      - wallOfFire
    condition: $(meta.level >= 13)
  - type: Reference
    target:
      - coneOfCold
      - wallOfForce
    condition: $(meta.level >= 17)
  - id: eldritchCannonFlamethrower
    type: Activity
    duration: instantaneous
    name: Flamethrower
    time: bonus action
    range: self
    condition: $(meta.level >= 3)
    mechanic:
      pattern: save
      save:
        ability: dex
        dc: $(attributes.spellcasting.save)
      target:
        type: area
        aoe:
          shape: cone
          size: 15
        range: $(range)
      failure:
        type: damage
        dice:
          count: '$(meta.level >= 9 ? 3 : 2)'
          sides: 8
          bonus: 0
        damageType: fire
      success:
        halfDamage: true
  - id: eldritchCannonForceBallista
    type: Activity
    duration: instantaneous
    name: Force Ballista
    time: bonus action
    range: 120 feet
    condition: $(meta.level >= 3)
    mechanic:
      pattern: attack
      attack:
        type: spell
        classification: ranged
        bonus: $(stats.int.mod + attributes.prof)
      target:
        type: single
        range: $(range)
      hit:
        - type: damage
          dice:
            count: '$(meta.level >= 9 ? 3 : 2)'
            sides: 8
          damageType: force
        - type: movement
          movementType: forced
          direction: push
          distance: 5
  - id: eldritchCannonProtector
    type: Activity
    duration: instantaneous
    name: Protector
    time: bonus action
    range: 10 feet
    condition: $(meta.level >= 3)
    mechanic:
      pattern: healing
      healing:
        dice:
          count: '$(meta.level >= 9 ? 2 : 1)'
          sides: 8
          bonus: $(stats.int.mod)
        type: tempHitPoints
      target:
        type: multiple
        range: $(range)
  - type: Effect
    target: activities[(tags=artificer AND tags=damageSpell) OR thunderwave OR shatter OR scorchingRay].mechanic.damage.extraDice
    operation: push
    value:
      count: 1
      sides: 8
      bonus: 0
    condition: $(meta.level >= 5)
