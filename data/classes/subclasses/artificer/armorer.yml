id: armorer
name: Armorer
description: Modify armor to function as a second skin, enhancing magic, attacks, and generating defense.
type: Folder
tags:
  - artificerSubclass
children:
  - type: Reference
    target:
      - heavyArmorTraining
      - smithsTools
  - type: Reference
    target:
      - magicMissile
      - thunderwave
    condition: $(meta.level >= 3)
  - type: Reference
    target:
      - mirrorImage
      - shatter
    condition: $(meta.level >= 5)
  - type: Reference
    target:
      - hypnoticPattern
      - lightningBolt
    condition: $(meta.level >= 9)
  - type: Reference
    target:
      - fireShield
      - greaterInvisibility
    condition: $(meta.level >= 13)
  - type: Reference
    target:
      - passwall
      - wallOfForce
    condition: $(meta.level >= 17)
  - id: armorModel
    name: Armor Model
    type: Slot
    target: armorModel
    condition: $(meta.level >= 3)
  - type: Reference
    target:
      - extraAttack
    condition: $(meta.level >= 5)
