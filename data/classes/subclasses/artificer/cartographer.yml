id: cartographer
name: Cartographer
description: Navigate and scout, using your creations to highlight threats, safeguard allies, and carve portals.
type: Folder
tags:
  - artificerSubclass
children:
  - type: Reference
    target:
      - calligraphersSupplies
      - cartographersTools
  - type: Reference
    target:
      - faerieFire
      - guidingBolt
      - healingWord
    condition: $(meta.level >= 3)
  - type: Reference
    target:
      - locateObject
      - mindSpike
    condition: $(meta.level >= 5)
  - type: Reference
    target:
      - callLightning
      - clairvoyance
    condition: $(meta.level >= 9)
  - type: Reference
    target:
      - banishment
      - locateCreature
    condition: $(meta.level >= 13)
  - type: Reference
    target:
      - scrying
      - teleportationCircle
    condition: $(meta.level >= 17)
  - id: adventurersAtlas
    type: Activity
    duration: instantaneous
    range: self
    name: Adventurer's Atlas
    time: free action
    description: |
      Whenever you finish a Long Rest while holding Cartographer's Tools, you can use that tool to create a set of magical maps by touching at least two creatures (one of whom can be yourself), up to a maximum number of $(Math.max(1, stats.int.mod)) creatures.

      While carrying the map, a target gains the following benefits:

      **Awareness.** The target adds 1d4 to its Initiative rolls.

      **Positioning.** The target knows the location of all other map holders that are on the same plane of existence as itself. When casting a spell or creating another effect that requires being able to see the effect's target, a map holder can target another map holder regardless of sight or cover, so long as the other map holder is still within range.
    mechanic:
      pattern: automatic
      trigger:
        text: Whenever you finish a Long Rest
      target:
        type: touch
        count: '$(Math.max(1, stats.int.mod))'
      payloads:
        - type: rollModifier
          modifierType: add
          dice: 1d4
          targetRolls:
            - initiative
        - type: text
          text: target knows the location of all other map holders on the same plane and can target them with spells regardless of sight or cover within range
    condition: $(meta.level >= 3)
  - id: portalJump
    type: Activity
    duration: instantaneous
    range: self
    name: Portal Jump
    time: free action
    description: |
      On your turn, you can spend $(Math.floor(attributes.movement.walk / 2 / 5) * 5) feet of movement to teleport to an unoccupied space you can see within 10 feet of yourself or within 5 feet of a creature that is within 30 feet of you and holding one of your Adventurer's Atlas maps. You can't use this benefit if your Speed is 0.
    mechanic:
      pattern: automatic
      target:
        type: self
      payloads:
        type: movement
        movementType: allow
        text: spend $(Math.floor(attributes.movement.walk / 2 / 5) * 5) feet of movement to teleport to an unoccupied space within 10 feet or within 5 feet of an Adventurer's Atlas map holder within 30 feet
    condition: $(meta.level >= 3)
  - id: illuminatedCartography
    type: Resource
    name: Illuminated Cartography
    quantity: $(Math.max(1, stats.int.mod))
    condition: $(meta.level >= 3)
  - type: Effect
    target: activities[id=faerieFire].resource
    operation: set
    value: illuminatedCartography
    condition: $(meta.level >= 3)
  - id: guidedPrecision
    type: Effect
    name: Guided Precision
    target: activities[id=faerieFire].mechanic.payloads
    operation: push
    value:
      type: text
      text: add $(Math.max(1, stats.int.mod)) to one damage roll when hitting a creature affected by Faerie Fire; taking damage can't cause you to lose Concentration on Faerie Fire
    condition: $(meta.level >= 5)
