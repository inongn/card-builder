id: graveDomain
name: Grave Domain
description: Guard the boundary between life and death, drawing upon transitional energy to heal or smite.
type: Folder
tags:
  - clericSubclass
children:
  - type: Reference
    target:
      - detectEvilAndGood
      - falseLife
      - gentleRepose
      - rayOfEnfeeblement
      - spareTheDying
    condition: $(meta.level >= 3)
  - type: Reference
    target:
      - revivify
      - vampiricTouch
    condition: $(meta.level >= 5)
  - type: Reference
    target:
      - blight
      - deathWard
    condition: $(meta.level >= 7)
  - type: Reference
    target:
      - circleOfMortalityPull
    condition: $(meta.level >= 3)
  - id: returnToLifeSpareTheDying
    type: Effect
    target: activities[id=spareTheDying].time
    operation: set
    value: bonus action
    condition: $(meta.level >= 3)
  - type: Reference
    target:
      - circleOfMortalityHealing
    condition: $(meta.level >= 3)
  - type: Reference
    target:
      - pathToTheGrave
    condition: $(meta.level >= 3)
  - id: sentinelAtDeathsDoor
    type: Resource
    name: Sentinel at Death's Door
    quantity: $(Math.max(1, stats.wis.mod))
    condition: $(meta.level >= 6)
  - type: Reference
    target:
      - sentinelAtDeathsDoor
    condition: $(meta.level >= 6)
