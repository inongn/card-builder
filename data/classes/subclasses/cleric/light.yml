id: lightDomain
name: Light Domain
description: Emphasize the divine power of blazing fire and revelation, burning away darkness and chasing away lies.
type: Folder
tags:
  - clericSubclass
children:
  - type: Reference
    target:
      - burningHands
      - faerieFire
      - scorchingRay
      - seeInvisibility
    condition: $(meta.level >= 3)
  - type: Reference
    target:
      - daylight
      - fireball
    condition: $(meta.level >= 5)
  - type: Reference
    target:
      - arcaneEye
      - wallOfFire
    condition: $(meta.level >= 7)
  - type: Reference
    target:
      - flameStrike
      - scrying
    condition: $(meta.level >= 9)
  - id: radianceOfTheDawn
    type: Activity
    name: Radiance of the Dawn
    time: action
    range: self
    duration: Instantaneous
    resource: channelDivinity
    description: You emit a flash of light in a 30-foot Emmanation originating from yourself. Any magical Darkness in the area is dispelled. Each creature of your choice in the area must make a DC $(attributes.spellcasting.save) Constitution saving throw, taking $(2)d10+$(meta.level) Radiant damage on a failed save, or half as much on a success.
    mechanic:
      pattern: save
      save:
        ability: con
        dc: $(attributes.spellcasting.save)
      target:
        type: area
        aoe:
          shape: emanation
          size: 30
        range: self
        filter: creatures of your choice
      failure:
        type: damage
        dice:
          count: 2
          sides: 10
          bonus: $(meta.level)
        damageType: radiant
      success:
        halfDamage: true
      failureOrSuccess:
        type: text
        text: any magical Darkness in the area is dispelled
    condition: $(meta.level >= 3)
  - id: wardingFlare
    type: Activity
    name: Warding Flare
    time: reaction
    range: 30 feet
    duration: Instantaneous
    resource: wardingFlare
    description: |
      When a creature that you can see within range makes an attack roll, you impose Disadvantage on the roll.
      $(meta.level >= 6 ? "You also give the target of the attack $(2)d6$(formatBonus(stats.wis.mod)) Temporary Hit Points." : "")
    mechanic:
      pattern: automatic
      trigger:
        event: make_attack
        text: When a creature you can see makes an attack roll
      target:
        type: self
      payloads:
        - type: text
          text: 'impose disadvantage on the roll.'
    condition: $(meta.level >= 3)
  - id: wardingFlareTempHP
    type: Effect
    name: Warding Flare (Level 6)
    target: activities[id=wardingFlare].mechanic
    operation: push
    value:
      target:
        inherit: trigger
      pattern: healing
      healing:
        dice:
          count: 2
          sides: 6
          bonus: $(stats.wis.mod)
        type: tempHitPoints
    condition: $(meta.level >= 6)
  - id: wardingFlare
    type: Resource
    name: Warding Flare
    quantity: $(Math.max(1, stats.wis.mod))
    sr: '$(meta.level >= 6 ? ''all'' : 0)'
    condition: $(meta.level >= 3)
