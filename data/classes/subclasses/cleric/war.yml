id: warDomain
name: War Domain
description: Excel in battle by tapping into the magic of war, inspiring others or offering violence as a prayer.
type: Folder
tags:
  - clericSubclass
children:
  - type: Reference
    target:
      - guidingBolt
      - magicWeapon
      - shieldOfFaith
      - spiritualWeapon
    condition: $(meta.level >= 3)
  - type: Reference
    target:
      - crusadersMantle
      - spiritGuardians
    condition: $(meta.level >= 5)
  - type: Reference
    target:
      - fireShield
      - freedomOfMovement
    condition: $(meta.level >= 7)
  - type: Reference
    target:
      - holdMonster
      - steelWindStrike
    condition: $(meta.level >= 9)
  - id: guidedStrike
    type: Activity
    name: Guided Strike
    time: reaction
    range: 30 feet
    duration: Instantaneous
    resource: channelDivinity
    condition: $(meta.level >= 3)
    description: When you or a creature within range misses with an attack roll, you give that roll a +10 bonus, potentially causing it to hit.
  - id: warPriest
    type: Activity
    name: War Priest
    time: bonus action
    range: self
    duration: Instantaneous
    resource: warPriest
    condition: $(meta.level >= 3)
    description: You make one attack with a weapon or an Unarmed Strike.
  - id: warPriest
    type: Resource
    name: War Priest
    quantity: $(Math.max(1, stats.wis.mod))
    condition: $(meta.level >= 3)
  - id: warGodsBlessingShield
    type: Effect
    target: activities[id=shieldOfFaith].resource
    operation: set
    value: channelDivinity
    condition: $(meta.level >= 6)
  - id: warGodsBlessingSpirit
    type: Effect
    target: activities[id=spiritualWeapon].resource
    operation: set
    value: channelDivinity
    condition: $(meta.level >= 6)
