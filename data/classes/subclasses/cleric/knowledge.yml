id: knowledgeDomain
name: Knowledge Domain
description: 'Value learning and information, using divine insights to uncover secrets and influence minds.'
type: Folder
tags:
  - clericSubclass
children:
  - id: subclassName
    type: Effect
    target: meta.sub
    operation: set
    value: "Knowledge"

  # Level 3: Blessings of Knowledge
  - id: blessingsOfKnowledgeTools
    name: "Blessings of Knowledge Tool Proficiency"
    type: Slot
    target: tool NOT gamingSet NOT musicalInstrument NOT thievesTools NOT poisonersKit NOT navigatorsTools NOT herbalismKit NOT forgeryKit NOT disguiseKit OR artisansToolsProficiency    
    quantity: 1
    condition: $(meta.level >= 3)

  - id: blessingsOfKnowledgeSkills
    name: "Blessings of Knowledge Skill Proficiencies"
    type: Slot
    target: arcanaProficiency OR historyProficiency OR natureProficiency OR religionProficiency
    quantity: 2
    condition: $(meta.level >= 3)

  - id: blessingsOfKnowledgeExpertise
    name: "Blessings of Knowledge Expertises"
    type: Slot
    target: arcanaExpertise OR historyExpertise OR natureExpertise OR religionExpertise
    quantity: 2
    condition: $(meta.level >= 3)

  # Level 3: Knowledge Domain Spells
  - type: Reference
    target: [command, comprehendLanguages, detectMagic, detectThoughts, identify, mindSpike]
    condition: $(meta.level >= 3)
  - type: Reference
    target: [dispelMagic, nondetection, tongues]
    condition: $(meta.level >= 5)
  - type: Reference
    target: [banishment, confusion]
    condition: $(meta.level >= 7)

  # Level 3: Mind Magic
  - id: mindMagic
    type: Activity
    duration: instantaneous
    name: Mind Magic
    time: action
    range: self
    resource: channelDivinity
    condition: $(meta.level >= 3)
    description: "You cast one of the following spells without expending a spell slot or requiring Material components: *Comprehend Languages*, *Detect Magic*, *Detect Thoughts*, *Identify*, or *Mind Spike*."

  # Level 6: Unfettered Mind
  - id: unfetteredMindTelepathy
    type: Activity
    time: free action
    duration: instantaneous
    name: Unfettered Mind
    range: 60 feet
    condition: $(meta.level >= 6)
    description: "You gain telepathy out to 60 feet. When you use this telepathy, you can simultaneously contact up to $(Math.max(1, stats.wis.mod)) creatures."

  - type: Reference
    target: intSave
    condition: $(meta.level >= 6)
