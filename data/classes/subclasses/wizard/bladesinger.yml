id: bladesinger
name: Bladesinger
description: Master a wizardry tradition mixing swordplay and dance to channel magic into your singing blades.
tags:
  - wizardSubclass
type: Folder
children:
  - type: Reference
    target:
      - bladesong
  - id: bladesong
    name: Bladesong
    type: Resource
    quantity: (Math.max(1, stats.int.mod))
  - type: Reference
    target:
      - martialWeaponProficiency
  - id: bladesingerSkillProficiencies
    type: Slot
    name: Bladesinger Skill Proficiencies
    quantity: 1
    target: acrobaticsProficiency OR athleticsProficiency OR performanceProficiency OR persuasionProficiency
  - type: Reference
    target:
      - extraAttack
    condition: $(meta.level >= 5)
