id: evoker
name: Evoker
description: Create powerful elemental effects like searing flame and crackling lightning, blasting armies afar.
type: Folder
tags:
  - wizardSubclass
children:
  - id: potentCantripEffect
    type: Effect
    target: activities[tags=cantrip].mechanic.miss.halfDamage
    operation: set
    value: true
  - id: potentCantripEffect2
    type: Effect
    target: activities[tags=cantrip].mechanic.success.halfDamage
    operation: set
    value: true
  - id: sculptSpells
    type: Trait
    name: Sculpt Spells
    description: When you cast a spell that requires a Saving Throw, your allies automatically succeed on their saving throw and take no damage if they would normally take half.
    condition: $(meta.level >= 6)
