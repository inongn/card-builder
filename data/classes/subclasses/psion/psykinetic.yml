id: psykinetic
name: Psykinetic
description: Mold psionic force like a malleable tool, erecting sturdy barriers and striking with the force of a battering ram.
type: Folder
tags:
  - psionSubclass
children:
  - type: Reference
    target:
      - cloudOfDaggers
      - levitate
      - shield
      - thunderwave
    condition: $(meta.level >= 3)
  - type: Reference
    target:
      - slow
      - telekineticCrush
    condition: $(meta.level >= 5)
  - type: Reference
    target:
      - otilukesResilientSphere
      - stoneShape
    condition: $(meta.level >= 7)
  - id: telekineticTechniques
    type: Effect
    target: activities[id=telekineticPropel].mechanic.failure
    operation: push
    description: |
      You can roll 5d4 instead of expending a Psionic Energy Die.

      When a target fails its saving throw, you can impose one of the following effects:
      * **Boost.** The target's Speed increases by 10 feet until the start of your next turn.
      * **Disorient.** The target cannot make Opportunity Attacks until the start of its next turn.
      * **Telekinetic Bolt.** The target takes Force damage equal to the number rolled on the die.
    value:
      type: choice
      text: "and choose one of the following:"
      options:
        - name: Boost
          text: "the target's Speed increases by 10 feet until the start of your next turn"
        - name: Disorient
          text: "the target cannot make Opportunity Attacks until the start of its next turn"
        - name: Telekinetic Bolt
          text: "the target takes 1d$(attributes.psiDice) Force damage"
    condition: $(meta.level >= 3)
  - id: destructiveTrance
    type: Activity
    name: Destructive Trance
    time: free action
    range: self
    duration: 10 minutes
    resource: psionicEnergyDice
    description: Enter a destructive state for the duration. You gain a Fly Speed of 20 feet (hover), and when you cast a Psion spell using a spell slot, add 1d$(attributes.psiDice) to one damage roll of that spell.
    mechanic:
      pattern: automatic
      target:
        type: self
      payloads:
        - type: text
          text: "gain a Fly Speed of 20 feet (hover), and when you cast a Psion spell using a spell slot, add 1d$(attributes.psiDice) to one damage roll of that spell"
    condition: $(meta.level >= 6)
  - id: reboundingField
    type: Effect
    target: activities[id=shield].mechanic.blocks
    operation: push
    name: Rebounding Field
    description: The attacker must make a DC $(attributes.spellcasting.save) Dexterity saving throw, taking 1d$(attributes.psiDice)$(formatBonus(stats.int.mod)) Force damage on a failed save, or half on a success. You gain Temporary Hit Points equal to the damage dealt.
    value:
      pattern: save
      save:
        ability: dex
        dc: $(attributes.spellcasting.save)
      target:
        inherit: trigger
      failure:
        type: damage
        dice:
          count: 1
          sides: $(attributes.psiDice)
          bonus: $(stats.int.mod)
        damageType: force
      success:
        halfDamage: true
      failureOrSuccess:
        type: healing
        healing:
          type: tempHitPoints
          text: gain Temporary Hit Points equal to the damage dealt
    condition: $(meta.level >= 6)
