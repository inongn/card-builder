id: seer
name: Seer
description: Master the stream of time and foresight, slipping through attacks, guiding allies, and altering outcomes.
type: Folder
tags:
  - psionSubclass
children:
  - type: Reference
    target:
      - detectEvilAndGood
      - findTraps
      - guidingBolt
      - huntersMark
    condition: $(meta.level >= 3)
  - type: Reference
    target:
      - augury
      - seeInvisibility
    condition: $(meta.level >= 5)
  - type: Reference
    target:
      - arcaneEye
      - locateCreature
    condition: $(meta.level >= 7)
  - id: precognitiveDefense
    type: Effect
    target: attributes.ac
    operation: set
    value: $(10 + stats.dex.mod + stats.int.mod)
    condition: $(meta.level >= 3)
  - id: splitSecondWarning
    type: Reference
    target: dexAdvantage
    condition: $(meta.level >= 3)
  - id: instantSlip
    type: Activity
    name: Instant Slip
    time: reaction
    range: self
    duration: Instantaneous
    resource: psionicEnergyDice
    description: When another creature damages you with an attack roll, reduce the damage by 1d$(attributes.psiDice)$(formatBonus(stats.int.mod)).
    mechanic:
      pattern: automatic
      trigger:
        text: When another creature damages you with an attack roll
      target:
        type: self
      payloads:
        - type: text
          text: reduce the damage by 1d$(attributes.psiDice)$(formatBonus(stats.int.mod))
    condition: $(meta.level >= 3)
  - id: foresightPropel
    type: Effect
    target: activities[id=telekineticPropel].mechanic
    operation: push
    value:
      - pattern: automatic
        text: A willing target can use its Reaction to move up to half its Speed without provoking Opportunity Attacks and gains 1d$(attributes.psiDice) to its AC until the start of your next turn.
    condition: $(meta.level >= 6)
  - id: temporalGlitch
    type: Activity
    name: Temporal Glitch
    time: reaction
    range: self
    duration: Instantaneous
    resource: psionicEnergyDice
    description: When you fail a Constitution saving throw to maintain Concentration, add 1d$(attributes.psiDice) to the roll, potentially turning a fail into a success. The Psionic Energy is expended only if the check succeeds.
    mechanic:
      pattern: automatic
      trigger:
        text: When you fail a Constitution saving throw to maintain Concentration
      target:
        type: self
      payloads:
        - type: rollModifier
          modifierType: add
          dice:
            count: 1
            sides: $(attributes.psiDice)
          targetRolls: save
          saveFilter:
            ability: con
          text: add 1d$(attributes.psiDice) to the roll, potentially turning a fail into a success
    condition: $(meta.level >= 6)
