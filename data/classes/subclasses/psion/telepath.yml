id: telepath
name: Telepath
description: 'Master tactics in the landscape of the mind, bolstering mental defenses of allies and probing thoughts undetected.'
type: Folder
tags:
  - psionSubclass
children:
  - id: subclassName
    type: Effect
    target: meta.sub
    operation: set
    value: "Telepath"

  # Level 3: Telepath Spells
  - type: Reference
    target: [bane, command, detectThoughts, mindSpike]
    condition: $(meta.level >= 3)
  - type: Reference
    target: [counterspell, slow]
    condition: $(meta.level >= 5)
  - type: Reference
    target: [compulsion, confusion]
    condition: $(meta.level >= 7)

  # Level 3: Mind Infiltrator
  - id: mindInfiltrator
    type: Extra
    target: detectThoughts
    condition: $(meta.level >= 3)
    name: Mind Infiltrator
    description: "If the target fails its Wisdom save against Read Thoughts, it does not know you are probing its mind."

  # Level 3: Telepathic Distraction
  - id: telepathicDistraction
    type: Activity
    name: Telepathic Distraction
    time: reaction
    range: 30 feet
    duration: Instantaneous
    resource: psionicEnergyDice
    condition: $(meta.level >= 3)
    description: "When a creature within range hits with an attack roll, subtract 1d$(attributes.psiDice) from the attack roll, potentially causing it to miss. The charge is expended only if the target misses."

  # Level 6: Bulwark Mind
  - id: bulwarkMind
    type: Activity
    name: Bulwark Mind
    time: free action
    range: self
    duration: 10 minutes
    resource: psionicEnergyDice
    condition: $(meta.level >= 6)
    description: "Enter a fortified state for 10 minutes. You gain Resistance to Psychic damage, and add 1d$(attributes.psiDice) to Intelligence, Wisdom, and Charisma saving throws."

  - type: Effect
    target: activities[tags=cantrip AND tags=psion AND tags=damageSpell].description["d12"]
    operation: replace
    value: "d12$(formatBonus(stats.int.mod))"
    condition: $(meta.level >= 6)
  - type: Effect
    target: activities[tags=cantrip AND tags=psion AND tags=damageSpell].description["d10"]
    operation: replace
    value: "d10$(formatBonus(stats.int.mod))"
    condition: $(meta.level >= 6)
  - type: Effect
    target: activities[tags=cantrip AND tags=psion AND tags=damageSpell].description["d8"]
    operation: replace
    value: "d8$(formatBonus(stats.int.mod))"
    condition: $(meta.level >= 6)
  - type: Effect
    target: activities[tags=cantrip AND tags=psion AND tags=damageSpell].description["d6"]
    operation: replace
    value: "d6$(formatBonus(stats.int.mod))"
    condition: $(meta.level >= 6)
  - type: Effect
    target: activities[tags=cantrip AND tags=psion AND tags=damageSpell].description["d4"]
    operation: replace
    value: "d4$(formatBonus(stats.int.mod))"
    condition: $(meta.level >= 6)
