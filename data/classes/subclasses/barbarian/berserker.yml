id: berserker
name: Path of the Berserker
description: Direct your Rage toward violence, thrilling in untrammeled fury and the chaos of battle.
tags:
  - barbarianSubclass
type: Folder
children:
  - id: frenzy
    type: Effect
    target: activities[id=recklessAttack].mechanic.payloads
    operation: push
    value:
      text: deal extra $(attributes.rageDamage)d6 damage to the first creature hit on your turn while Rage is active
  - id: mindlessRageCharmed
    type: Reference
    target: charmedImmunity
    form: rage
    condition: $(meta.level >= 6)
  - id: mindlessRageFrightened
    type: Reference
    target: frightenedImmunity
    form: rage
    condition: $(meta.level >= 6)
