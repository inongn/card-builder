id: wildHeart
name: Path of the Wild Heart
description: Communicate with animals and channel supernatural might as your Rage deepens your primal connection.
tags:
  - barbarianSubclass
type: Folder
children:
  - type: Reference
    target:
      - beastSense
      - speakWithAnimals
      - wisCaster
  - id: rageOfTheWilds
    type: Activity
    time: free action
    duration: instantaneous
    range: self
    name: Rage of the Wilds
    description: 'Your Rage taps into the primal power of animals. When you activate your Rage, you gain one of the following options of your choice:'
    mechanic:
      mode: choice
      trigger:
        text: When you activate your Rage
      blocks:
        - pattern: automatic
          name: Bear
          target:
            type: self
          payloads:
            type: text
            text: gain Resistance to every damage type except Force, Necrotic, Psychic, and Radiant while Raging
        - pattern: automatic
          name: Eagle
          target:
            type: self
          payloads:
            - type: text
              text: take the Disengage and Dash actions as part of this Bonus Action; while Raging, you can take a Bonus Action to take both actions again
        - pattern: automatic
          name: Wolf
          target:
            type: self
          payloads:
            type: text
            text: while Raging, your allies have Advantage on attack rolls against any enemy of yours within 5 feet of you
  - id: aspectOfTheWilds
    type: Slot
    target: classOption OR aspectOfTheWilds
    name: Aspect of the Wilds
    condition: $(meta.level >= 6)
