id: worldTree
name: Path of the World Tree
description: Connect with the cosmic World Tree through your Rage, drawing on its magic for vitality and travel.
tags:
  - barbarianSubclass
type: Folder
children:
  - id: vitalitySurge
    type: Effect
    name: Vitality Surge
    target: activities[id=rage].mechanic
    operation: push
    value:
      pattern: healing
      healing:
        dice:
          count: 0
          sides: 0
          bonus: $(meta.level)
        type: tempHitPoints
      target:
        type: self
  - id: lifeGivingForce
    type: Activity
    name: Life-Giving Force
    time: free action
    range: 10 feet
    duration: Instantaneous
    target: rage
    description: You tap into the life force of the World Tree. At the start of each of your turns while your Rage is active, choose a creature within range to gain $(attributes.rageDamage)d6 Temporary Hit Points. If any of these Temporary Hit Points remain when your Rage ends, they vanish.
    mechanic:
      pattern: healing
      trigger:
        text: at the start of each of your turns while Raging
      healing:
        dice:
          count: $(attributes.rageDamage)
          sides: 6
        type: tempHitPoints
      target:
        type: single
        range: $(range)
  - id: branchesOfTheTree
    type: Activity
    name: Branches of the Tree
    time: reaction
    range: 30 feet
    duration: Instantaneous
    description: When a creature you can see starts its turn within range while your Rage is active, you summon spectral branches of the World Tree around it. The target must succeed on a DC $(8 + stats.str.mod + attributes.prof) Strength saving throw or be teleported to an unoccupied space you can see within 5 feet of yourself. After it teleports, you can reduce its Speed to 0 until the end of the current turn.
    mechanic:
      pattern: save
      trigger:
        text: while Raging, when a creature within starts its turn
      save:
        ability: str
        dc: $(8 + stats.str.mod + attributes.prof)
      target:
        type: single
        range: $(range)
      failure:
        - type: text
          text: the target is teleported to an unoccupied space within 5 feet of you, and you can reduce its Speed to 0 until the end of its turn
    condition: $(meta.level >= 6)
