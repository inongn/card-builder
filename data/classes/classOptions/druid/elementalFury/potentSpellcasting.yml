id: potentSpellcasting
summary: "Add Wisdom modifier to the damage dealt by your cleric cantrips."
name: Potent Spellcasting
tags: [elementalFury]
type: Folder
children:
  - type: Effect
    target: activities[tags=cantrip AND tags=damageSpell].mechanic.hit.dice.bonus
    operation: add
    value: $(stats.wis.mod)
  - type: Effect
    target: activities[tags=cantrip AND tags=damageSpell].mechanic.failure.dice.bonus
    operation: add
    value: $(stats.wis.mod)