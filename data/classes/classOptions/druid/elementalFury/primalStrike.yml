id: primalStrike
summary: Infuse weapon and beast strikes with extra elemental damage.
name: Primal Strike
tags:
  - elementalFury
type: Folder
children:
  - id: primalStrikeWeapon
    type: Effect
    target: activities[tags=weaponAttack].mechanic.hit
    operation: push
    value:
      type: damage
      dice:
        count: 1
        sides: 8
      damageType:
        - cold
        - fire
        - lightning
        - thunder
  - id: primalStrikeWildShape
    type: Effect
    target: statblocks[tags=wildShapeTemplate OR tags=lunarWildShape].actions[id=bestialStrike].mechanic.hit
    operation: push
    value:
      type: damage
      dice:
        count: 1
        sides: 8
      damageType:
        - cold
        - fire
        - lightning
        - thunder
