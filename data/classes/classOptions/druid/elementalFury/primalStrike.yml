id: primalStrike
summary: Infuse weapon and beast strikes with extra elemental damage.
name: Primal Strike
tags:
  - elementalFury
type: Folder
children:
  - id: primalStrikeWeapon
    type: Effect
    target: activities[tags=weaponAttack].mechanic.hit
    operation: push
    value:
      type: damage
      dice:
        count: 1
        sides: 8
      damageType:
        - cold
        - fire
        - lightning
        - thunder
  - id: primalStrikeWildShape
    type: Effect
    target: statblocks[wildShapeTemplate].actions["damage"]
    operation: replace
    value: damage plus 1d8 Cold, Fire, Lightning or Thunder damage
