id: potentSpellcastingCleric
summary: Add Wisdom modifier to the damage dealt by your cleric cantrips.
name: Potent Spellcasting
type: Folder
tags:
  - blessedStrikes
children:
  - type: Effect
    target: activities[tags=cantrip AND tags=damageSpell].mechanic.damage.dice.bonus
    operation: add
    value: $(stats.wis.mod)
