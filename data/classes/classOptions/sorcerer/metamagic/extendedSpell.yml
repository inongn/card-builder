id: extendedSpell
summary: Double the duration of a spell up to a maximum of 24 hours.
name: Extended Spell
type: Folder
tags:
  - metamagic
children:
  - id: extendedSpellActivity
    type: Activity
    time: free action
    duration: instantaneous
    range: self
    name: Extended Spell
    resource: 1 sorceryPoints
    description: When you cast a spell that has a duration of 1 minute or longer, you double its duration to a maximum duration of 24 hours. If the affected spell requires Concentration, you have Advantage on any saving throw you make to maintain that Concentration.
    mechanic:
      pattern: automatic
      trigger:
        event: cast_spell
      target:
        type: self
      payloads:
        - type: text
          text: double the duration of a spell (max 24 hours), and gain Advantage on Concentration saves
