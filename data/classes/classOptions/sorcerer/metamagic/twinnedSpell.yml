id: twinnedSpell
summary: Target a second creature with a spell that normally targets only one.
name: Twinned Spell
type: Folder
tags:
  - metamagic
children:
  - id: twinnedSpellActivity
    type: Activity
    time: free action
    duration: instantaneous
    range: self
    name: Twinned Spell
    resource: 1 sorceryPoints
    description: When you cast a spell, such as Charm Person, that can be cast with a higher-level spell slot to target an additional creature, you increase the spell's effective level by 1.
    mechanic:
      pattern: automatic
      trigger:
        event: cast_spell
      target:
        type: self
      payloads:
        - type: text
          text: increase the spell's effective level by 1 to affect an additional creature
