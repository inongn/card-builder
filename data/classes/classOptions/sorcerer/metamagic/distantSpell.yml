id: distantSpell
summary: Double the range of a spell or turn a touch spell into range.
name: Distant Spell
type: Folder
tags:
  - metamagic
children:
  - id: distantSpellActivity
    type: Activity
    time: free action
    duration: instantaneous
    range: self
    name: Distant Spell
    resource: 1 sorceryPoints
    description: When you cast a spell that has a range of at least 5 feet, you double the spell's range. Or when you cast a spell that has a range of Touch, you make the spell's range 30 feet.
    mechanic:
      pattern: automatic
      trigger:
        event: cast_spell
      target:
        type: self
      payloads:
        - type: text
          text: double the range of a spell (or make a Touch spell's range 30 feet)
