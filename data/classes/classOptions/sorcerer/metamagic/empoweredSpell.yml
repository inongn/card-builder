id: empoweredSpell
summary: Reroll damage dice on a spell to maximize your damage output.
name: Empowered Spell
type: Folder
tags:
  - metamagic
children:
  - id: empoweredSpellActivity
    type: Activity
    time: free action
    duration: instantaneous
    range: self
    name: Empowered Spell
    resource: 1 sorceryPoints
    description: |
      When you roll damage for a spell, you can reroll a number of the damage dice up to $(Math.max(1, stats.cha.mod)), and you must use the new rolls.

      You can use Empowered Spell even if you've already used a different Metamagic option during the casting of the spell.
    mechanic:
      pattern: utility
      text: Reroll up to $(Math.max(1, stats.cha.mod)) damage dice and use the new rolls.
