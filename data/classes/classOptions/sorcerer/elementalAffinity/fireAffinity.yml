id: fireAffinity
name: Fire Affinity
summary: "Gain fire resistance and add Charisma modifier to fire damage spells."
type: Folder
tags:
  - elementalAffinity
children:
  - type: Reference
    target: fireResistance
  # Bake CHA mod into fire damage spell rolls (like potentSpellcasting)
  - type: Effect
    target: activities[tags=damageSpell AND tags=fireDamage].mechanic.hit.dice.bonus
    operation: add
    value: $(stats.cha.mod)
  - type: Effect
    target: activities[tags=damageSpell AND tags=fireDamage].mechanic.failure.dice.bonus
    operation: add
    value: $(stats.cha.mod)
