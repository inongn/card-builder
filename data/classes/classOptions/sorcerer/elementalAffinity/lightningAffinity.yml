id: lightningAffinity
name: Lightning Affinity
summary: "Gain lightning resistance and add Charisma modifier to lightning damage spells."
type: Folder
tags:
  - elementalAffinity
children:
  - type: Reference
    target: lightningResistance
  - type: Effect
    target: activities[tags=damageSpell AND tags=lightningDamage].mechanic.damage.dice.bonus
    operation: add
    value: $(stats.cha.mod)