id: poisonAffinity
name: Poison Affinity
summary: "Gain poison resistance and add Charisma modifier to poison damage spells."
type: Folder
tags:
  - elementalAffinity
children:
  - type: Reference
    target: poisonResistance
  - type: Effect
    target: activities[tags=damageSpell AND tags=poisonDamage].mechanic.damage.dice.bonus
    operation: add
    value: $(stats.cha.mod)
