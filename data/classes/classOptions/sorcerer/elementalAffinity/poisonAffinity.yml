id: poisonAffinity
name: Poison Affinity
summary: "Gain poison resistance and add Charisma modifier to poison damage spells."
type: Folder
tags:
  - elementalAffinity
children:
  - type: Reference
    target: poisonResistance
  - type: Effect
    target: activities[tags=damageSpell AND tags=poisonDamage].mechanic.hit.dice.bonus
    operation: add
    value: $(stats.cha.mod)
  - type: Effect
    target: activities[tags=damageSpell AND tags=poisonDamage].mechanic.failure.dice.bonus
    operation: add
    value: $(stats.cha.mod)
