id: coldAffinity
name: Cold Affinity
summary: "Gain cold resistance and add Charisma modifier to cold damage spells."
type: Folder
tags:
  - elementalAffinity
children:
  - type: Reference
    target: coldResistance
  - type: Effect
    target: activities[tags=damageSpell AND tags=coldDamage].mechanic.hit.dice.bonus
    operation: add
    value: $(stats.cha.mod)
  - type: Effect
    target: activities[tags=damageSpell AND tags=coldDamage].mechanic.failure.dice.bonus
    operation: add
    value: $(stats.cha.mod)