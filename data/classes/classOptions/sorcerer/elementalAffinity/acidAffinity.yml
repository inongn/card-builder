id: acidAffinity
name: Acid Affinity
summary: "Gain acid resistance and add Charisma modifier to acid damage spells."
type: Folder
tags:
  - elementalAffinity
children:
  - type: Reference
    target: acidResistance
  - type: Effect
    target: activities[tags=damageSpell AND tags=acidDamage].mechanic.damage.dice.bonus
    operation: add
    value: $(stats.cha.mod)