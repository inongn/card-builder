id: psionicGuards
name: Psionic Guards
summary: Gain Immunity to Charmed/Frightened conditions and Advantage on Int saves.
tags:
  - psionicDiscipline
type: Activity
time: free action
range: self
duration: 1 round
resource: psionicEnergyDice
description: |
  At the start of your turn, you gain Immunity to the Charmed and Frightened conditions and Advantage on Intelligence saving throws until the start of your next turn. If you are Charmed or Frightened when you use this discipline, the condition ends on you.

  When you use Psionic Guards, you can also use a different Psionic Discipline this turn.

mechanic:
  pattern: automatic
  trigger:
    event: start_turn
  target:
    type: self
  payloads:
    - type: defense
      defense: immunity
      conditions: [charmed, frightened]
      end: end_of_your_next_turn
    - type: rollModifier
      modifierType: advantage
      targetRolls: save
      saveFilter:
        ability: int
      end: end_of_your_next_turn
