id: expandedAwareness
name: Expanded Awareness
summary: "Add a Psionic Energy Die to a Search ability check."
tags: [psionicDiscipline, classOption]
type: Activity
time: free action
range: self
duration: Instantaneous
resource: psionicEnergyDice
description: |
  When you take the Search action, you can roll 1d$(attributes.psiDice) and add the number rolled to the ability check. If this causes you to succeed on the ability check, the die is expended.
