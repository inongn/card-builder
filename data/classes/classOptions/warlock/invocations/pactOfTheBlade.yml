id: pactOfTheBladeFolder
summary: "Summon or bind a magical pact weapon in your hand."
name: Pact of the Blade
tags:
  - eldritchInvocation
type: Folder
children:
  - id: pactOfTheBlade
    type: Attribute
    value: true
  - id: pactOfTheBladeSpellcastingRoll
    type: Effect
    target: activities[tags=weaponAttack NOT unarmed].mechanic.attack.bonus
    operation: set
    value:  $(attributes.spellcasting.attack)
  - id: pactOfTheBladeSpellcastingDamage
    type: Effect
    target: activities[tags=weaponAttack NOT unarmed].mechanic.hit.dice.bonus
    operation: set
    value:  $(attributes.spellcasting.attack)
  - 