id: gazeOfTwoMinds
summary: Perceive through the senses of a willing humanoid target.
name: Gaze of Two Minds
tags:
  - eldritchInvocation
condition: $(meta.level >= 5)
type: Activity
range: self
time: bonus action
duration: 1 turn
description: Touch a willing creature to perceive through its senses until the end of your next turn. Use a Bonus Action to extend the duration.
mechanic:
  pattern: automatic
  target:
    type: single
    range: touch
    filter: willing creature
  payloads:
    - type: text
      text: perceive through the target's senses until the end of your next turn