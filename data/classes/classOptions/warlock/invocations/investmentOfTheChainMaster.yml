id: investmentOfTheChainMaster
summary: Enhance your familiar with flying/swimming speed and boosted attacks.
name: Investment of the Chain Master
tags:
  - eldritchInvocation
condition: $(meta.level >= 5)
prerequisite: Pact of the Chain
prerequisiteCondition: $(attributes.pactOfTheChain == true)
type: Folder
children:
  - id: commandFamiliar
    type: Activity
    duration: instantaneous
    range: self
    time: bonus action
    name: Command Familiar
    description: You command the familiar to make an attack.
    condition: $(attributes.pactOfTheChain == true)
  - id: familiarResistance
    type: Activity
    duration: instantaneous
    range: self
    time: reaction
    name: Familiar Resistance
    description: When the familiar takes damage, you can take a Reaction to grant it Resistance against that damage.
    mechanic:
      pattern: automatic
      trigger:
        text: when the familiar takes damage
      target:
        type: single
        filter: familiar
      payloads:
        - type: text
          text: grant it Resistance against that damage
    condition: $(attributes.pactOfTheChain == true)