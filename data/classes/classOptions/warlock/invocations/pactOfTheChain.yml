id: pactOfTheChainFolder
summary: Gain an upgraded imp, pseudodragon, quasit, or sprite familiar.
name: Pact of the Chain
tags:
  - eldritchInvocation
type: Attribute
children:
  - id: pactOfTheChain
    type: Attribute
    value: true
  - type: Reference
    target: findFamiliar
  - id: pactOfTheChainAttack
    name: Command Familiar
    type: Trait
    description: When you take the Attack action on your turn, you can replace one attack with a command to your familiar to make one attack with its Reaction.
    condition: $(!attributes.thirstingBlade)
  - id: pactOfTheChainExtraAttack
    type: Effect
    target: traits[id=extraAttack].description["per turn."]
    operation: replace
    condition: $(attributes.thirstingBlade == true)
    value: "per turn, and you can replace one attack with a command to your familiar to make one attack of its own with its Reaction."
