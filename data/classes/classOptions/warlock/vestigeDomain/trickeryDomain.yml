id: trickeryDomainVestige
summary: "Gain illusory stealth spells and trickster duplicates from the Trickery Domain."
name: Trickery Domain
tags: [vestigeType]
type: Folder
children:
  - type: Reference
    target: [charmPerson, disguiseSelf, invisibility, passWithoutTrace]
  - type: Reference
    condition: meta.level >= 5
    target: [blink, dispelMagic]
  - type: Reference
    condition: meta.level >= 7
    target: [dimensionDoor, polymorph]
  - type: Reference
    condition: meta.level >= 9
    target: [dominatePerson, modifyMemory]
