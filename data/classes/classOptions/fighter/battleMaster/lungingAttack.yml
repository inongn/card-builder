id: lungingAttack
summary: Increase your melee attack reach and deal extra damage.
name: Lunging Attack
tags:
  - maneuver
type: Activity
duration: instantaneous
range: self
time: bonus action
resource: superiorityDice
description: You take the Dash action. If you move at least 5 feet in a straight line immediately before hitting with a melee attack as part of the Attack action on this turn, you add 1d$(attributes.superiorityDie) to the attack's damage roll.
mechanic:
  pattern: automatic
  target:
    type: self
  payloads:
    - type: text
      text: take the Dash action; moving 5 feet in a straight line before hitting with a melee attack adds 1d$(attributes.superiorityDie) to the damage roll
