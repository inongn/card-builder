id: ambush
summary: Add a maneuver die to a Dexterity (Stealth) check or Initiative roll.
name: Ambush
tags:
  - maneuver
type: Activity
time: free action
duration: instantaneous
range: self
resource: superiorityDice
description: When you make a Dexterity (Stealth) check or an Initiative roll, you add 1d$(attributes.superiorityDie) to the roll.
mechanic:
  pattern: automatic
  target:
    type: self
  payloads:
    - type: rollModifier
      modifierType: add
      dice:
        count: 1
        sides: $(attributes.superiorityDie)
      targetRolls:
        - check
        - initiative
      text: add 1d$(attributes.superiorityDie) to a Dexterity (Stealth) check or Initiative roll