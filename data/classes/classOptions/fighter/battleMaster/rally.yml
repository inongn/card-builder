id: rally
summary: Bolster an ally with temporary hit points using your maneuver die.
name: Rally
tags:
  - maneuver
type: Activity
duration: instantaneous
range: self
time: bonus action
resource: superiorityDice
description: You bolster the resolve of a companion. Choose an ally of yours within 30 feet of yourself who can see or hear you. That creature gains 1d$(attributes.superiorityDie)+$(Math.floor(meta.level/2)) Temporary Hit Points.
mechanic:
  pattern: healing
  target:
    type: single
    range: 30 feet
    filter: ally
  healing:
    dice:
      count: 1
      sides: $(attributes.superiorityDie)
      bonus: $(Math.floor(meta.level/2))
    type: tempHitPoints
