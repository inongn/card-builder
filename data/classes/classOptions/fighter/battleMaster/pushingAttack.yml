id: pushingAttack
summary: Deal extra damage and push the target back up to 15 feet.
name: Pushing Attack
tags:
  - maneuver
type: Activity
time: free action
duration: instantaneous
range: self
resource: superiorityDice
description: When you hit a creature with an attack roll using a weapon or an Unarmed Strike, you attempt to drive the target back. Add 1d$(attributes.superiorityDie) to the attack's damage roll. If the target is Large or smaller, it must succeed on a DC $(attributes.superioritySave) Strength saving throw or be pushed up to 15 feet directly away from you.
mechanic:
  pattern: save
  trigger:
    event: hit_with_attack
  save:
    ability: str
    dc: $(attributes.superioritySave)
  target:
    inherit: trigger
  failureOrSuccess:
    type: damage
    dice:
      count: 1
      sides: $(attributes.superiorityDie)
  failure:
    - type: movement
      movementType: forced
      direction: push
      distance: 15