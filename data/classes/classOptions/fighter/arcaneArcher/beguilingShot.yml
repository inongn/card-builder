id: beguilingShot
name: Beguiling Shot
summary: Deal extra psychic damage and charm the target toward an ally.
tags:
  - arcaneShotOption
type: Activity
duration: instantaneous
range: self
time: free action
resource: arcaneShot
description: When you hit a creature with a weapon attack using a bow, choose one of your allies within 30 feet of the target. Add 2d6 Psychic damage to the attack's damage roll, and the target must succeed on a DC $(attributes.spellcasting.save) Wisdom saving throw or be Charmed by the chosen ally until the start of your next turn.
mechanic:
  pattern: save
  trigger:
    event: hit_with_attack
    attackFilter:
      classification: ranged
      type: weapon
  save:
    ability: wis
    dc: $(attributes.spellcasting.save)
  target:
    inherit: trigger
  failureOrSuccess:
    type: damage
    dice:
      count: 2
      sides: 6
    damageType: psychic
  failure:
    - type: condition
      condition: charmed
      end: end_of_your_next_turn
      text: by the chosen ally
