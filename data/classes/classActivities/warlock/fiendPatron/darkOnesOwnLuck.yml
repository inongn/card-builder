id: darkOnesOwnLuck
type: Activity
duration: instantaneous
range: self
name: Dark One's Own Luck
time: free action
resource: darkOnesOwnLuck
description: >-
  You call on your fiendish patron to alter fate in your favor. When you make an
  ability check or a saving throw, you can use this feature to add 1d10 to your
  roll. You can do so after seeing the roll but before any of the roll's effects
  occur.
mechanic:
  pattern: utility
  trigger: When you make an ability check or saving throw
  text: Add 1d10 to your roll.
