id: darkOnesBlessing
type: Activity
range: self
name: Dark One's Blessing
time: free action
duration: instantaneous
description: >-
  When you reduce an enemy to 0 Hit Points, you gain $(meta.level +
  stats.cha.mod) Temporary Hit Points. You also gain this benefit if someone
  else reduces an enemy within 10 feet of you to 0 Hit Points.
mechanic:
  pattern: healing
  healing:
    dice:
      count: 0
      sides: 0
      bonus: $(meta.level + stats.cha.mod)
    type: tempHitPoints
  trigger: When you or a nearby ally reduces an enemy to 0 Hit Points
