id: devilishTongue
name: Devilish Tongue
summary: Add a Psionic Energy Die to an Influence ability check.
tags:
  - psionicDiscipline
type: Activity
time: free action
range: self
duration: Instantaneous
resource: psionicEnergyDice
description: |
  When you take the Influence action, you can roll 1d$(attributes.psiDice) and add the number rolled to the ability check. If this causes you to succeed on the ability check, the charge is expended.
mechanic:
  pattern: utility
  trigger: When you take the Influence action
  text: Roll 1d$(attributes.psiDice) and add it to the ability check. Expend the charge only if you succeed.
