id: biofeedback
name: Biofeedback
summary: Gain Temporary Hit Points when casting Necromancy or Transmutation spells.
tags:
  - psionicDiscipline
type: Activity
time: free action
range: self
duration: Instantaneous
resource: psionicEnergyDice
description: |
  When you cast a Psion spell of the Necromancy or Transmutation school, you gain 1d$(attributes.psiDice)+$(Math.max(1, stats.int.mod)) Temporary Hit Points per charge expended.
mechanic:
  pattern: healing
  trigger: When you cast a Psion Necromancy or Transmutation spell
  healing:
    dice:
      count: 1
      sides: $(attributes.psiDice)
      bonus: $(Math.max(1, stats.int.mod))
    type: tempHitPoints
  text: Gain 1d$(attributes.psiDice)+$(Math.max(1, stats.int.mod)) Temporary Hit Points per charge expended.
