id: telekineticPropel
type: Activity
name: Telekinetic Propel
time: bonus action
range: 30 feet
duration: Instantaneous
resource: psionicEnergyDice
description: |
  Choose a Large or smaller creature other than you within range. The target must make a DC $(attributes.spellcasting.save) Strength saving throw. On a failed save, it is moved 5d$(attributes.psiDice) feet straight toward or away from you.
mechanic:
  pattern: save
  save:
    ability: str
    dc: $(attributes.spellcasting.save)
    failure:
      text: Target is moved 5d$(attributes.psiDice) feet straight toward or away from you.
  target:
    type: single
    range: 30 feet
