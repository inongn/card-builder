id: stunningStrike
type: Activity
time: free action
duration: instantaneous
range: self
name: Stunning Strike
resource: 1 focusPoints
description: >-
  Once per turn when you hit with an attack, the target must make a DC
  $(attributes.monkSaveDC) Constitution saving throw. On a failed save, the
  target has the Stunned condition until the start of your next turn. On a
  success, the target's Speed is halved and the next attack roll against it has
  Advantage.
mechanic:
  pattern: save
  trigger: When you hit a creature with an attack
  save:
    ability: con
    dc: $(attributes.monkSaveDC)
    failure:
      text: Target has the Stunned condition until the start of your next turn.
    success:
      text: Target Speed is halved and next attack roll against it has Advantage.
  target:
    type: single
