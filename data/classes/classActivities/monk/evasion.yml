id: evasion
type: Activity
time: free action
duration: instantaneous
range: self
name: Evasion
description: >-
  When you're subjected to an effect that allows you to make a Dexterity saving
  throw to take only half damage, you instead take no damage if you succeed and
  only half damage if you fail. You can't use this if you have the Incapacitated
  condition.
mechanic:
  pattern: utility
  trigger: >-
    When subjected to an effect that allows a Dexterity saving throw for half
    damage
  text: Take no damage on a success, and half damage on a failure.
