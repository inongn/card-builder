id: rage
type: Activity
name: Rage
time: bonus action
range: self
duration: 10 minutes
resource: rage
description: |
  You imbue yourself with primal power. While active, you gain the following benefits:

  **Damage Resistance.** You have resistance to Bludgeoning, Piercing, and Slashing damage. 

  **Rage Damage.** When you make an attack using Strength and deal damage, you gain a $(formatBonus(attributes.rageDamage)) bonus to the damage. 

  **Strength Advantage.** You have Advantage on Strength checks and Strength saving throws.
mechanic:
  pattern: utility
  text: You imbue yourself with primal power.
extra:
  - name: Damage Resistance
    description: You have resistance to Bludgeoning, Piercing, and Slashing damage.
  - name: Rage Damage
    description: When you make an attack using Strength and deal damage, you gain a $(formatBonus(attributes.rageDamage)) bonus to the damage.
  - name: Strength Advantage
    description: You have Advantage on Strength checks and Strength saving throws.
