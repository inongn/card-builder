id: wildShapeActivity
type: Activity
name: Wild Shape
time: bonus action
range: self
duration: $(meta.level / 2) hours
resource: wildShape
description: >
  You transform into a beast form. You choose whether your equipment falls to
  the ground, merges into your new form, or is worn by it. While in a form, you
  retain your personality, memories, and ability to speak, and the following
  rules apply:


  **Temporary Hit Points.** You gain $(meta.level * 2) Temporary Hit Points.


  **Game Statistics.** Your game statistics are replaced by the Beast's stat
  block, but you retain your creature type; Hit Points; Hit Point Dice;
  Intelligence, Wisdom, and Charisma scores.


  **No Spellcasting.** You can't cast spells, but shape-shifting doesn't break
  your Concentration or otherwise interfere with a spell you've already cast.
mechanic:
  pattern: healing
  healing:
    dice:
      count: 0
      sides: 0
      bonus: $(meta.level * 2)
    type: tempHitPoints
  text: >-
    Transform into a Beast form gaining temporary hit points equal to twice your
    Druid level.
